<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RABBIT HOLE - MISSION 3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;

  background:#000;
}

:root{
  /* 녹색 버튼 */
  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  /* 대화창 */
  --talk-width:min(88vw,600px);
  --talk-bottom:15vh;

  /* 화살표 */
  --control-bottom:31vh;
  --arrow-w:82px;
  --arrow-h:68px;

  /* 문제 UI */
  --ui-bottom:5.5vh;

  /* 대화창 색 */
  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}


/* =========================================================
   배경
   ★ bduq32.png 사용 안 함
========================================================= */

body{
  position:relative;

  background:
    url("bduq31.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   대화창
========================================================= */

.talk-box-wrap{
  position:fixed;

  left:50%;
  bottom:var(--talk-bottom);

  transform:translateX(-50%);

  width:var(--talk-width);

  display:none;

  z-index:30;
}

.talk-box-wrap.show{
  display:block;

  animation:fadeSimple .35s ease;
}


.talk-box{
  width:100%;

  padding:22px 25px;

  border:3px solid var(--paper-border);

  background:rgba(244,236,209,.97);

  color:var(--paper-text);

  font-size:23px;
  font-weight:700;

  line-height:1.55;

  word-break:keep-all;
  white-space:pre-line;

  box-shadow:
    0 7px 14px rgba(0,0,0,.22);
}


/* =========================================================
   화살표 / 미션시작 / 나무로
========================================================= */

.talk-controls{
  position:fixed;

  left:50%;
  bottom:var(--control-bottom);

  transform:translateX(-50%);

  width:var(--talk-width);
  height:var(--arrow-h);

  display:none;

  align-items:center;
  justify-content:space-between;

  z-index:40;
}

.talk-controls.show{
  display:flex;

  animation:fadeSimple .35s ease;
}


/* =========================================================
   화살표
========================================================= */

.arrow-btn{
  width:var(--arrow-w);
  height:var(--arrow-h);

  flex:0 0 var(--arrow-w);

  border:none;
  background:transparent;

  padding:0;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;

  transition:transform .15s ease;
}

.arrow-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}

.arrow-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}

.arrow-btn svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(0 7px 8px rgba(0,0,0,.40))
    drop-shadow(0 2px 2px rgba(0,0,0,.30));
}

.arrow-shape{
  fill:var(--green);

  stroke:var(--green-dark);
  stroke-width:3;
}

.arrow-highlight{
  fill:rgba(255,255,255,.25);
}

.arrow-btn.hidden{
  visibility:hidden;
  pointer-events:none;
}


/* =========================================================
   미션시작 / 나무로
========================================================= */

.round-btn{
  display:none;

  height:58px;
  min-width:130px;

  padding:0 25px;

  border:3px solid var(--green-dark);

  border-radius:15px;

  background:var(--green);

  color:#fffdf1;

  font-size:20px;
  font-weight:900;

  line-height:1;

  white-space:nowrap;

  cursor:pointer;

  box-shadow:
    0 7px 8px rgba(0,0,0,.35),
    0 2px 2px rgba(0,0,0,.25),
    inset 0 2px 2px rgba(255,255,255,.25);

  text-shadow:
    0 1px 2px rgba(0,0,0,.25);

  -webkit-tap-highlight-color:transparent;

  transition:transform .15s ease;
}

.round-btn.show{
  display:block;
}

.round-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}

.round-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}


/* =========================================================
   미션 카드
========================================================= */

.mission-wrap{
  position:fixed;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(86vw,620px);

  display:none;

  z-index:25;
}

.mission-wrap.show{
  display:block;

  animation:missionOpen .4s ease;
}


.mission-card{
  width:100%;

  padding:34px 30px 30px;

  border:5px solid var(--paper-border);

  border-radius:14px;

  background:rgba(244,236,209,.97);

  text-align:center;

  box-shadow:
    0 14px 30px rgba(0,0,0,.30);
}


.mission-title{
  color:#784738;

  font-size:28px;
  font-weight:900;

  line-height:1.4;

  margin-bottom:24px;

  word-break:keep-all;
}


.mission-kit{
  color:#235a9e;

  font-size:31px;
  font-weight:900;

  margin-bottom:28px;
}


/* =========================================================
   미션 그림 영역
   ★ bduq2의 질문 박스와 같은 위치/크기 계열
========================================================= */

.mission-image-box{
  width:100%;

  height:142px;

  padding:10px;

  border:5px solid #8d4cff;

  border-radius:13px;

  background:#fff;

  margin-bottom:25px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}


.mission-image{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;
}


.mission-guide{
  color:#000;

  font-size:38px;
  font-weight:900;

  line-height:1.35;
}


/* =========================================================
   문제 입력 UI
========================================================= */

.ui-wrap{
  position:fixed;

  left:50%;
  bottom:var(--ui-bottom);

  transform:translateX(-50%);

  width:clamp(420px,56vw,560px);

  z-index:35;

  display:none;

  flex-direction:column;

  gap:14px;
}

.ui-wrap.show{
  display:flex;

  animation:fadeUp .35s ease;
}


.answer-row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    86px;

  gap:12px;
}


.answer-input{
  width:100%;
  height:58px;

  border:none;
  border-radius:14px;

  padding:0 18px;

  font-size:20px;

  outline:none;

  background:rgba(255,255,255,.96);

  color:#222;

  box-shadow:
    0 8px 18px rgba(0,0,0,.25);
}


.submit-btn{
  height:58px;

  border:none;
  border-radius:14px;

  font-size:18px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      var(--green-light),
      var(--green)
    );

  cursor:pointer;

  box-shadow:
    0 7px 0 var(--green-dark),
    0 10px 16px rgba(0,0,0,.28),
    inset 0 2px 2px rgba(255,255,255,.30);
}


/* =========================================================
   하단 버튼
========================================================= */

.action-row{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}


.action-btn{
  height:54px;

  border:none;
  border-radius:14px;

  font-size:17px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      var(--green-light),
      var(--green)
    );

  cursor:pointer;

  box-shadow:
    0 6px 0 var(--green-dark),
    0 9px 15px rgba(0,0,0,.27),
    inset 0 2px 2px rgba(255,255,255,.30);
}


.submit-btn:active,
.action-btn:active{
  transform:translateY(4px);
}


.action-btn:disabled{
  opacity:.42;

  cursor:default;
}


/* =========================================================
   안내 모달
========================================================= */

.info-modal{
  position:fixed;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.55);

  z-index:100;
}


.info-modal.show{
  display:flex;
}


.info-box{
  width:min(86vw,560px);

  background:#f7f4df;

  border-radius:22px;

  padding:30px 24px;

  text-align:center;

  box-shadow:
    0 18px 40px rgba(0,0,0,.35);
}


.modal-title{
  font-size:28px;
  font-weight:900;

  margin-bottom:18px;

  color:var(--green-dark);
}


.modal-content{
  font-size:22px;

  line-height:1.6;

  color:#25351d;

  white-space:pre-line;

  word-break:keep-all;
}


.modal-close{
  margin-top:22px;

  height:50px;

  min-width:100px;

  border:none;
  border-radius:14px;

  padding:0 24px;

  font-size:17px;
  font-weight:900;

  color:#fff;

  background:var(--green);

  cursor:pointer;
}


/* =========================================================
   결과 영상
========================================================= */

.video-modal{
  position:fixed;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.68);

  z-index:300;
}


.video-modal.show{
  display:flex;
}


.video-box{
  width:clamp(360px,58vw,760px);

  max-height:76vh;

  overflow:hidden;

  border-radius:24px;

  background:transparent;
}


.result-video{
  display:block;

  width:100%;
  height:auto;

  border-radius:24px;

  background:transparent;
}


/* =========================================================
   애니메이션
========================================================= */

.shake{
  animation:shake .25s ease;
}


@keyframes shake{
  0%{
    transform:translateX(-50%) translateX(0);
  }

  25%{
    transform:translateX(-50%) translateX(-6px);
  }

  50%{
    transform:translateX(-50%) translateX(6px);
  }

  75%{
    transform:translateX(-50%) translateX(-4px);
  }

  100%{
    transform:translateX(-50%) translateX(0);
  }
}


@keyframes fadeUp{
  from{
    opacity:0;

    transform:
      translateX(-50%)
      translateY(12px);
  }

  to{
    opacity:1;

    transform:
      translateX(-50%)
      translateY(0);
  }
}


@keyframes fadeSimple{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}


@keyframes missionOpen{
  from{
    opacity:0;

    transform:
      translate(-50%,-47%)
      scale(.96);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}


/* =========================================================
   휴대폰
   ★ 기준 bduq2와 같은 수치
========================================================= */

@media(max-width:600px){

  :root{
    --talk-width:min(92vw,360px);

    --talk-bottom:12vh;

    --control-bottom:28vh;

    --arrow-w:58px;
    --arrow-h:48px;

    --ui-bottom:4.5vh;
  }


  .talk-box{
    padding:15px 17px;

    border-width:2px;

    font-size:16px;

    line-height:1.5;

    box-shadow:
      0 5px 10px rgba(0,0,0,.22);
  }


  .round-btn{
    height:46px;
    min-width:100px;

    padding:0 16px;

    border-width:3px;
    border-radius:13px;

    font-size:15px;

    box-shadow:
      0 6px 7px rgba(0,0,0,.32),
      0 2px 2px rgba(0,0,0,.22),
      inset 0 2px 2px rgba(255,255,255,.25);
  }


  .mission-wrap{
    width:min(88vw,380px);

    top:43%;
  }


  .mission-card{
    padding:24px 18px 22px;

    border-width:4px;

    border-radius:12px;
  }


  .mission-title{
    font-size:19px;

    margin-bottom:16px;
  }


  .mission-kit{
    font-size:22px;

    margin-bottom:17px;
  }


  .mission-image-box{
    height:91px;

    padding:7px;

    border-width:4px;

    margin-bottom:16px;
  }


  .mission-guide{
    font-size:26px;
  }


  .ui-wrap{
    width:min(88vw,330px);

    gap:11px;
  }


  .answer-row{
    grid-template-columns:
      minmax(0,1fr)
      64px;

    gap:8px;
  }


  .answer-input{
    height:52px;

    font-size:16px;

    padding:0 14px;

    border-radius:13px;
  }


  .submit-btn{
    height:52px;

    font-size:16px;

    border-radius:13px;
  }


  .action-row{
    gap:8px;
  }


  .action-btn{
    height:48px;

    font-size:14px;

    border-radius:13px;
  }


  .modal-title{
    font-size:23px;
  }


  .modal-content{
    font-size:18px;
  }


  .video-box{
    width:72vw;

    max-width:340px;

    border-radius:18px;
  }


  .result-video{
    border-radius:18px;
  }
}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{
    --talk-width:92vw;

    --talk-bottom:12vh;

    --control-bottom:27vh;

    --arrow-w:54px;
    --arrow-h:45px;

    --ui-bottom:4vh;
  }


  .talk-box{
    font-size:15px;

    padding:13px 15px;
  }


  .round-btn{
    height:44px;

    min-width:94px;

    padding:0 14px;

    font-size:14px;
  }


  .mission-wrap{
    width:90vw;
  }


  .mission-title{
    font-size:18px;
  }


  .mission-kit{
    font-size:21px;
  }


  .mission-image-box{
    height:84px;
  }


  .mission-guide{
    font-size:24px;
  }


  .ui-wrap{
    width:min(90vw,310px);
  }


  .answer-row{
    grid-template-columns:
      minmax(0,1fr)
      58px;

    gap:7px;
  }


  .answer-input{
    height:50px;

    font-size:15px;

    padding:0 12px;
  }


  .submit-btn{
    height:50px;

    font-size:15px;
  }


  .action-row{
    gap:7px;
  }


  .action-btn{
    height:46px;

    font-size:13px;
  }
}


/* =========================================================
   낮은 화면
========================================================= */

@media(max-height:700px){

  .talk-box{
    font-size:14px;
    line-height:1.4;

    padding:11px 14px;
  }

  .mission-wrap{
    top:40%;
  }

  .mission-card{
    padding-top:18px;
    padding-bottom:18px;
  }
}

</style>
</head>


<body>


<!-- =====================================================
     화살표 / 미션시작 / 나무로
===================================================== -->

<div
  class="talk-controls"
  id="talkControls"
>

  <!-- 왼쪽 화살표 -->

  <button
    id="prevTalkBtn"
    class="arrow-btn hidden"
    type="button"
    onclick="prevTalk()"
    aria-label="이전"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="M84 10 Q92 15 92 26 L92 70 Q92 81 84 86 Q76 91 67 84 L22 54 Q13 48 22 42 L67 12 Q76 5 84 10 Z"
      />

      <path
        class="arrow-highlight"
        d="M78 18 Q84 21 84 28 L84 36 L39 48 L78 22 Z"
      />

    </svg>

  </button>


  <!-- 오른쪽 화살표 -->

  <button
    id="nextTalkBtn"
    class="arrow-btn"
    type="button"
    onclick="nextTalk()"
    aria-label="다음"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="M36 10 Q28 15 28 26 L28 70 Q28 81 36 86 Q44 91 53 84 L98 54 Q107 48 98 42 L53 12 Q44 5 36 10 Z"
      />

      <path
        class="arrow-highlight"
        d="M42 18 Q36 21 36 28 L36 36 L81 48 L42 22 Z"
      />

    </svg>

  </button>


  <!-- 미션시작 -->

  <button
    id="missionStartBtn"
    class="round-btn"
    type="button"
    onclick="startMission()"
  >
    미션시작
  </button>


  <!-- 나무로 -->

  <button
    id="treeBtn"
    class="round-btn"
    type="button"
    onclick="finishMission()"
  >
    나무로
  </button>

</div>


<!-- =====================================================
     HTML/CSS 대화창
===================================================== -->

<div
  class="talk-box-wrap"
  id="talkBoxWrap"
>

  <div
    class="talk-box"
    id="talkBox"
  ></div>

</div>


<!-- =====================================================
     미션 카드
===================================================== -->

<div
  class="mission-wrap"
  id="missionWrap"
>

  <div class="mission-card">

    <div
      class="mission-title"
      id="missionTitle"
    ></div>

    <div
      class="mission-kit"
      id="missionKit"
    ></div>


    <!-- 미션 그림 -->

    <div class="mission-image-box">

      <img
        class="mission-image"
        src="bduq333.png"
        alt="꽝 없는 뽑기 기계 미션 그림"
      >

    </div>


    <div
      class="mission-guide"
      id="missionGuide"
    ></div>

  </div>

</div>


<!-- =====================================================
     문제 입력
===================================================== -->

<div
  class="ui-wrap"
  id="uiWrap"
>

  <div class="answer-row">

    <input
      id="answerInput"
      class="answer-input"
      type="text"
      inputmode="numeric"
      placeholder="정답을 입력하세요"
      autocomplete="off"
    >

    <button
      class="submit-btn"
      type="button"
      onclick="checkAnswer()"
    >
      입력
    </button>

  </div>


  <div class="action-row">

    <button
      class="action-btn"
      type="button"
      onclick="showHint()"
    >
      힌트보기
    </button>


    <button
      class="action-btn"
      id="answerBtn"
      type="button"
      onclick="showAnswer()"
      disabled
    >
      정답보기
    </button>


    <button
      class="action-btn"
      type="button"
      onclick="showReward()"
    >
      당근갯수
    </button>

  </div>

</div>


<!-- =====================================================
     안내 모달
===================================================== -->

<div
  class="info-modal"
  id="infoModal"
>

  <div class="info-box">

    <div
      class="modal-title"
      id="modalTitle"
    >
      안내
    </div>

    <div
      class="modal-content"
      id="modalContent"
    ></div>

    <button
      class="modal-close"
      type="button"
      onclick="closeModal()"
    >
      닫기
    </button>

  </div>

</div>


<!-- =====================================================
     결과 영상
===================================================== -->

<div
  class="video-modal"
  id="videoModal"
>

  <div class="video-box">

    <video
      id="resultVideo"
      class="result-video"
      playsinline
      muted
    ></video>

  </div>

</div>


<script>

/* =========================================================
   ★ bduq3 설정
========================================================= */

const missionConfig = {

  /* 문제 번호 */
  missionNumber:3,


  /* 정답 */
  correctAnswer:"725",


  /* 힌트 */
  hintText:
    "상품에는 모두 숫자가 있습니다.",


  /* 정답보기 */
  answerText:
    "725",


  /* =====================================================
     문제 시작 전 대사 4개
  ===================================================== */

  introTexts:[

    `이곳은 장미꽃 향기와 별빛이 가득하고,
신기한 뽑기 기계가 숨겨진 '행운의 정원'이야!`,

    `찰칵! 손잡이를 돌려 방금 톡 하고 떨어진 저 영롱한
캡슐을 보렴!`,

    `겉보기엔 그저 평범한 구슬 같아 보이지만,
이 캡슐 속에는 세상에 단 하나뿐인
아주 특별한 마음이 담겨져 있지.`,

    `과연 너희가 뽑은 캡슐에는 무엇이 담겨져 있을까?`

  ],


  /* =====================================================
     미션 카드
  ===================================================== */

  missionTitle:
    "장소 #3: 꽝 없는 뽑기 기계",

  missionKit:
    "C 1, C 2 키트 사용",

  missionGuide:
    "정답은 숫자 3개",


  /* =====================================================
     문제 성공 후 대사

     ★ 올려준 이미지 내용 그대로 사용
     첫 번째와 두 번째 문구가 같은 것도 그대로 유지
  ===================================================== */

  successTexts:[

    `캡슐 속에 숨겨진 진짜 비밀을 멋지게 밝혀냈구나!
역시 이 기계는 절대로 '꽝'을 주지 않는 법이지.`,

    `이 소중한 행운의 힘을 품고, 이제 다음 장소로
신나게 발걸음을 옮겨볼까?`

  ]

};


/* =========================================================
   저장
========================================================= */

const PROGRESS_KEY =
  "bdu_progress_v1";


let usedHint=false;
let usedAnswer=false;
let locked=false;

let talkMode="intro";
let currentTalk=0;

let pendingScore=null;


/* =========================================================
   요소
========================================================= */

const talkBoxWrap =
  document.getElementById("talkBoxWrap");

const talkBox =
  document.getElementById("talkBox");

const talkControls =
  document.getElementById("talkControls");

const prevTalkBtn =
  document.getElementById("prevTalkBtn");

const nextTalkBtn =
  document.getElementById("nextTalkBtn");

const missionStartBtn =
  document.getElementById("missionStartBtn");

const treeBtn =
  document.getElementById("treeBtn");

const missionWrap =
  document.getElementById("missionWrap");

const uiWrap =
  document.getElementById("uiWrap");


/* =========================================================
   진행상황
========================================================= */

function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(PROGRESS_KEY)
    ) || {};

  }

  catch(e){

    return {};

  }

}


function setProgress(progress){

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );

}


/* =========================================================
   정답 비교
========================================================= */

function normalize(text){

  return String(text)
    .replace(/\s+/g,"")
    .trim()
    .toLowerCase();

}


/* =========================================================
   리워드 2 / 1 / 0
========================================================= */

function currentScore(){

  /* 정답보기 사용 */
  if(usedAnswer){
    return 0;
  }

  /* 힌트 사용 */
  if(usedHint){
    return 1;
  }

  /* 힌트 없이 정답 */
  return 2;

}


/* =========================================================
   현재까지 획득한 당근
========================================================= */

function getTotalScore(){

  const progress =
    getProgress();

  let total=0;


  for(let i=1;i<=5;i++){

    if(
      progress[i]
      &&
      progress[i].completed
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }


  return total;

}


/* =========================================================
   결과 저장
========================================================= */

function saveResult(score){

  const progress =
    getProgress();


  progress[
    missionConfig.missionNumber
  ]={

    completed:true,

    score:score,

    usedHint:usedHint,

    usedAnswer:usedAnswer

  };


  setProgress(progress);

}


/* =========================================================
   안내 모달
========================================================= */

function openModal(title,content){

  document
    .getElementById("modalTitle")
    .textContent=title;


  document
    .getElementById("modalContent")
    .textContent=content;


  document
    .getElementById("infoModal")
    .classList
    .add("show");

}


function closeModal(){

  document
    .getElementById("infoModal")
    .classList
    .remove("show");

}


/* =========================================================
   힌트
========================================================= */

function showHint(){

  if(locked){
    return;
  }


  usedHint=true;


  document
    .getElementById("answerBtn")
    .disabled=false;


  openModal(
    "힌트",
    missionConfig.hintText
  );

}


/* =========================================================
   정답보기
========================================================= */

function showAnswer(){

  if(locked){
    return;
  }


  if(!usedHint){
    return;
  }


  usedAnswer=true;


  openModal(
    "정답",
    missionConfig.answerText
  );

}


/* =========================================================
   당근 갯수
========================================================= */

function showReward(){

  openModal(

    "당근 갯수",

    `현재까지 획득한 당근은 ${getTotalScore()}개입니다.`

  );

}


/* =========================================================
   현재 대사 배열
========================================================= */

function getCurrentTalkList(){

  if(talkMode==="intro"){

    return missionConfig.introTexts;

  }


  return missionConfig.successTexts;

}


/* =========================================================
   대화 표시
========================================================= */

function showTalk(){

  const list =
    getCurrentTalkList();


  talkBox.textContent =
    list[currentTalk];


  talkBoxWrap
    .classList
    .add("show");


  talkControls
    .classList
    .add("show");


  updateTalkControls();

}


/* =========================================================
   화살표 / 버튼 상태
========================================================= */

function updateTalkControls(){

  const list =
    getCurrentTalkList();


  const total =
    list.length;


  /* 첫 대사에서는 왼쪽 화살표 숨김 */

  if(currentTalk===0){

    prevTalkBtn
      .classList
      .add("hidden");

  }

  else{

    prevTalkBtn
      .classList
      .remove("hidden");

  }


  /* 오른쪽 버튼 초기화 */

  nextTalkBtn.style.display="none";


  missionStartBtn
    .classList
    .remove("show");


  treeBtn
    .classList
    .remove("show");


  /* 마지막 대사 전에는 오른쪽 화살표 */

  if(currentTalk < total-1){

    nextTalkBtn.style.display="block";

    return;

  }


  /* 시작 전 마지막 */

  if(talkMode==="intro"){

    missionStartBtn
      .classList
      .add("show");

  }


  /* 성공 후 마지막 */

  else{

    treeBtn
      .classList
      .add("show");

  }

}


/* =========================================================
   다음 대화
========================================================= */

function nextTalk(){

  const list =
    getCurrentTalkList();


  if(currentTalk < list.length-1){

    currentTalk++;

    showTalk();

  }

}


/* =========================================================
   이전 대화
========================================================= */

function prevTalk(){

  if(currentTalk>0){

    currentTalk--;

    showTalk();

  }

}


/* =========================================================
   미션 카드 작성
========================================================= */

function fillMissionCard(){

  document
    .getElementById("missionTitle")
    .textContent =
      missionConfig.missionTitle;


  document
    .getElementById("missionKit")
    .textContent =
      missionConfig.missionKit;


  document
    .getElementById("missionGuide")
    .textContent =
      missionConfig.missionGuide;

}


/* =========================================================
   미션 시작
   ★ 배경은 bduq31.png 그대로
========================================================= */

function startMission(){

  talkBoxWrap
    .classList
    .remove("show");


  talkControls
    .classList
    .remove("show");


  fillMissionCard();


  missionWrap
    .classList
    .add("show");


  uiWrap
    .classList
    .add("show");


  setTimeout(
    function(){

      document
        .getElementById("answerInput")
        .focus();

    },

    300
  );

}


/* =========================================================
   정답 확인
========================================================= */

function checkAnswer(){

  if(locked){
    return;
  }


  const input =
    document
      .getElementById("answerInput")
      .value;


  if(!input.trim()){

    openModal(
      "안내",
      "정답을 입력해주세요."
    );

    return;

  }


  /* =====================================================
     정답
  ===================================================== */

  if(
    normalize(input)
    ===
    normalize(
      missionConfig.correctAnswer
    )
  ){

    locked=true;


    pendingScore=
      currentScore();


    saveResult(
      pendingScore
    );


    closeModal();


    missionWrap
      .classList
      .remove("show");


    uiWrap
      .classList
      .remove("show");


    talkMode="success";

    currentTalk=0;


    setTimeout(
      function(){

        showTalk();

      },

      1000
    );

  }


  /* =====================================================
     오답
  ===================================================== */

  else{

    uiWrap
      .classList
      .remove("shake");


    void uiWrap.offsetWidth;


    uiWrap
      .classList
      .add("shake");


    openModal(
      "오답",
      "정답이 아닙니다."
    );

  }

}


/* =========================================================
   나무로
========================================================= */

function finishMission(){

  talkBoxWrap
    .classList
    .remove("show");


  talkControls
    .classList
    .remove("show");


  /* 정답보기 사용 = 영상 없음 */

  if(pendingScore===0){

    goMain();

    return;

  }


  playResultVideo(
    pendingScore
  );

}


/* =========================================================
   결과 영상
========================================================= */

function getVideoSrc(score){

  /* 힌트 없이 성공 */

  if(score===2){

    return "bduq1.mp4";

  }


  /* 힌트 사용 */

  if(score===1){

    return "bduq2.mp4";

  }


  return "";

}


/* =========================================================
   영상 재생
========================================================= */

function playResultVideo(score){

  const videoModal =
    document.getElementById(
      "videoModal"
    );


  const video =
    document.getElementById(
      "resultVideo"
    );


  const src =
    getVideoSrc(score);


  if(!src){

    goMain();

    return;

  }


  videoModal
    .classList
    .add("show");


  video.src=src;

  video.load();


  video.onended=
    function(){

      goMain();

    };


  video.onerror=
    function(){

      setTimeout(
        goMain,
        1000
      );

    };


  const playPromise=
    video.play();


  if(playPromise!==undefined){

    playPromise.catch(
      function(){

        setTimeout(
          goMain,
          1000
        );

      }
    );

  }

}


/* =========================================================
   메인 나무
========================================================= */

function goMain(){

  location.href =
    "https://baekko.github.io/cnedu/bdum.html";

}


/* =========================================================
   Enter 입력
========================================================= */

document
  .getElementById("answerInput")
  .addEventListener(
    "keydown",

    function(e){

      if(e.key==="Enter"){

        checkAnswer();

      }

    }
  );


/* =========================================================
   최초 실행
========================================================= */

fillMissionCard();


/* 2초 후 첫 대사 */

setTimeout(
  function(){

    talkMode="intro";

    currentTalk=0;

    showTalk();

  },

  2000
);

</script>
