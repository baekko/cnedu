<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PLAY THE BOOK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;min-height:100dvh;overflow:hidden;
  font-family:"Gowun Dodum",sans-serif;background:#54a9ee;
}
body{
  position:relative;
  background:url("ptbcl_select.png") no-repeat center center / cover;
}
:root{
  --elem-game:#4f7d32;
  --elem-game-dark:#29451b;
  --elem-class:#e67e32;
  --elem-class-dark:#8d461c;
  --teen-game:#315f9d;
  --teen-game-dark:#17385f;
  --teen-class:#6b4028;
  --teen-class-dark:#3b2115;
}

/* 2열 2행 선택 버튼 */
.choice-grid{
  position:fixed;
  left:50%;
  top:59%;
  transform:translate(-50%,-50%);
  width:min(84vw,650px);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
  z-index:20;
}
.choice-btn{
  aspect-ratio:1 / 1;
  min-width:0;
  border:3px solid var(--dark);
  border-radius:24px;
  background:var(--color);
  color:#fffdf1;
  font-family:"Gowun Dodum",sans-serif;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 8px 14px rgba(0,0,0,.28),
    inset 0 3px 3px rgba(255,255,255,.24),
    inset 0 -7px 12px rgba(0,0,0,.16);
  text-shadow:0 2px 3px rgba(0,0,0,.24);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  transition:transform .15s ease,filter .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.choice-btn:hover{transform:translateY(-4px) scale(1.025);filter:brightness(1.04)}
.choice-btn:active{transform:translateY(2px) scale(.97)}
.choice-btn .icon{
  font-size:clamp(42px,7vw,66px);
  line-height:1;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.20));
}
.choice-btn .label{
  font-size:clamp(20px,3vw,28px);
  line-height:1.25;
  text-align:center;
  word-break:keep-all;
}
.choice-btn .type{
  display:block;
  margin-top:6px;
  font-size:1.28em;
  line-height:1.05;
}
.elementary-game{--color:var(--elem-game);--dark:var(--elem-game-dark)}
.elementary-class{--color:var(--elem-class);--dark:var(--elem-class-dark)}
.teen-game{--color:var(--teen-game);--dark:var(--teen-game-dark)}
.teen-class{--color:var(--teen-class);--dark:var(--teen-class-dark)}

/* 코드 입력 모달 */
.code-modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.58);
}
.code-modal.show{display:flex}
.final-card{
  position:relative;
  width:min(86vw,560px);
  padding:30px 28px 27px;
  border:5px solid #7f4b3a;
  border-radius:28px;
  background:#f4ecd1;
  box-shadow:0 14px 30px rgba(0,0,0,.30);
  text-align:center;
  animation:cardIn .22s ease both;
}
.final-card::before{
  content:"";position:absolute;inset:15px;
  border:1px solid rgba(166,116,68,.55);
  border-radius:14px;pointer-events:none;
}
.final-card>*{position:relative;z-index:1}
.final-kit{
  color:#235a9e;font-size:25px;font-weight:900;margin-bottom:20px;
}
.final-question{
  min-height:66px;padding:12px 18px;margin-bottom:24px;
  border:5px solid #ff884d;border-radius:10px;background:#fff;
  color:#000;font-size:25px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.final-answer-row{
  width:100%;display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:12px;
}
.final-answer-input{
  width:100%;height:58px;border:none;border-radius:14px;padding:0 18px;
  outline:none;background:rgba(255,255,255,.97);color:#222;
  font-family:"Gowun Dodum",sans-serif;font-size:20px;font-weight:700;
  box-shadow:0 8px 18px rgba(0,0,0,.20);
}
.final-submit{
  height:58px;border:none;border-radius:14px;background:#5a321d;color:#fff;
  font-family:"Gowun Dodum",sans-serif;font-size:18px;font-weight:900;
  cursor:pointer;box-shadow:0 8px 16px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.22);
}
.final-submit:active{transform:translateY(2px) scale(.98)}
.code-message{
  min-height:24px;margin-top:13px;color:#8c3b2c;font-size:16px;font-weight:900;
}
.close-btn{
  position:absolute;right:12px;top:9px;z-index:5;
  width:38px;height:38px;border:0;background:transparent;color:#7f4b3a;
  font-family:"Gowun Dodum",sans-serif;font-size:26px;font-weight:900;cursor:pointer;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* 가로 화면 안내 */
.landscape-guide{display:none}
@media (orientation:landscape){
  .landscape-guide{
    position:fixed;inset:0;z-index:999999;display:flex;
    align-items:center;justify-content:center;background:#111;
  }
  .landscape-guide-text{
    font-family:"Gowun Dodum",sans-serif;font-size:20px;font-weight:700;
    line-height:1.7;text-align:center;color:#fff;
  }
}

@media(max-width:600px){
  .choice-grid{
    top:61%;
    width:min(86vw,390px);
    gap:14px;
  }
  .choice-btn{border-width:3px;border-radius:18px;gap:9px}
  .choice-btn .icon{font-size:42px}
  .choice-btn .label{font-size:17px}
  .final-card{
    width:min(88vw,380px);padding:22px 18px 20px;
    border-width:4px;border-radius:22px;
  }
  .final-card::before{inset:11px;border-radius:11px}
  .final-kit{font-size:21px;margin-bottom:14px}
  .final-question{
    min-height:56px;padding:10px 12px;margin-bottom:20px;
    border-width:3px;font-size:18px;
  }
  .final-answer-row{grid-template-columns:minmax(0,1fr) 64px;gap:8px}
  .final-answer-input{height:52px;padding:0 14px;border-radius:13px;font-size:16px}
  .final-submit{height:52px;border-radius:13px;font-size:16px}
  .code-message{font-size:14px}
}
@media(max-width:390px){
  .choice-grid{width:88vw;gap:11px;top:61.5%}
  .choice-btn{border-radius:16px}
  .choice-btn .icon{font-size:37px}
  .choice-btn .label{font-size:15px}
  .final-card{width:90vw;padding:19px 15px 18px}
  .final-card::before{inset:10px}
}

/* =========================================================
   코드 입력창 - BDUQ 미션카드 스타일
========================================================= */
.final-card{
  position:relative !important;
  overflow:hidden !important;
  width:min(86vw,620px) !important;
  padding:34px 36px 31px !important;
  border:1px solid #c7a37d !important;
  border-radius:5px !important;
  background:
    linear-gradient(rgba(255,250,240,.82),rgba(248,237,217,.82)),
    radial-gradient(circle at 25% 20%,rgba(150,105,60,.08),transparent 34%),
    radial-gradient(circle at 75% 72%,rgba(150,105,60,.07),transparent 38%),
    #f6ead6 !important;
  box-shadow:
    0 20px 45px rgba(0,0,0,.34),
    inset 0 0 35px rgba(130,85,45,.08) !important;
}
.final-card::before{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid rgba(166,116,68,.55);
  border-radius:0 !important;
  pointer-events:none;
  z-index:0;
}
.final-card > *{position:relative;z-index:1}

.final-kit{
  color:#784738 !important;
  font-family:"Gowun Dodum",sans-serif !important;
  font-size:28px !important;
  font-weight:900 !important;
  line-height:1.4 !important;
  margin-bottom:20px !important;
}
.final-question{
  min-height:auto !important;
  padding:0 !important;
  margin-bottom:22px !important;
  border:none !important;
  border-radius:0 !important;
  background:transparent !important;
  color:#235a9e !important;
  font-family:"Gowun Dodum",sans-serif !important;
  font-size:30px !important;
  font-weight:900 !important;
}
.close-btn{
  color:#784738 !important;
  font-family:"Gowun Dodum",sans-serif !important;
}

@media(max-width:600px){
  .choice-btn .type{
    margin-top:5px;
    font-size:1.32em;
  }
  .final-card{
    width:min(88vw,380px) !important;
    padding:27px 26px 24px !important;
    border-width:1px !important;
    border-radius:5px !important;
  }
  .final-card::before{
    inset:11px;
    border-radius:0 !important;
  }
  .final-kit{
    font-size:19px !important;
    margin-bottom:13px !important;
  }
  .final-question{
    font-size:21px !important;
    margin-bottom:18px !important;
  }
}
@media(max-width:390px){
  .choice-btn .type{font-size:1.34em}
  .final-card{
    width:90vw !important;
    padding:24px 22px 22px !important;
  }
  .final-card::before{inset:10px}
}


/* =========================================================
   선택버튼 이미지 / 코드입력창 최종 조정
========================================================= */
.choice-btn .icon{display:none !important;}
.choice-icon{
  display:block;
  width:58%;
  height:42%;
  object-fit:contain;
  flex:0 0 auto;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.20));
}

/* 코드카드 폭/위 여백 축소 */
.final-card{
  width:min(76vw,460px) !important;
  padding:24px 28px 25px !important;
}
.final-kit{
  margin-bottom:10px !important;
}
.final-question{
  margin-bottom:16px !important;
}

/* 입력창 + 우측 입력/닫기 2버튼 */
.final-answer-row{
  grid-template-columns:minmax(0,1fr) 82px !important;
  gap:10px !important;
  align-items:stretch;
}
.code-buttons{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:6px;
  height:58px;
}
.final-submit,
.final-close{
  width:100%;
  min-width:0;
  height:auto !important;
  border:none;
  border-radius:8px;
  color:#fff;
  font-family:"Gowun Dodum",sans-serif;
  font-size:13px !important;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:
    0 3px 6px rgba(0,0,0,.25),
    inset 0 1px 1px rgba(255,255,255,.22);
}
.final-submit{background:#5a321d !important;}
.final-close{background:#7a6659;}
.final-submit:active,
.final-close:active{transform:translateY(1px);}

@media(max-width:600px){
  .choice-icon{
    width:60%;
    height:40%;
  }
  .final-card{
    width:min(82vw,340px) !important;
    padding:20px 20px 20px !important;
  }
  .final-kit{
    margin-bottom:7px !important;
  }
  .final-question{
    margin-bottom:13px !important;
  }
  .final-answer-row{
    grid-template-columns:minmax(0,1fr) 66px !important;
    gap:8px !important;
  }
  .code-buttons{
    height:52px;
    gap:5px;
  }
  .final-submit,
  .final-close{
    border-radius:7px;
    font-size:11px !important;
  }
}
@media(max-width:390px){
  .final-card{
    width:84vw !important;
    padding:18px 18px 18px !important;
  }
}


/* =========================================================
   코드 안내문 - 필요할 때만 하단 공간 확장
========================================================= */
.code-message{
  min-height:0 !important;
  height:0;
  margin-top:0 !important;
  overflow:hidden;
  opacity:0;
  font-size:16px;
  font-weight:900;
  line-height:1.45;
  transition:
    height .18s ease,
    margin-top .18s ease,
    opacity .18s ease;
}
.code-message:not(:empty){
  height:auto;
  min-height:24px !important;
  margin-top:13px !important;
  opacity:1;
}
@media(max-width:600px){
  .code-message{
    font-size:14px;
  }
  .code-message:not(:empty){
    min-height:20px !important;
    margin-top:10px !important;
  }
}


/* 초등학생 게임용 - PLAY 로고 L 느낌의 밝은 녹색 */
.elementary-game{
  --color:#69c94b !important;
  --dark:#34782b !important;
}

</style>
</head>

<body>
<div class="landscape-guide">
  <div class="landscape-guide-text">📱<br>원활한 진행을 위해<br>세로 모드를 유지해 주세요.</div>
</div>

<main class="choice-grid" aria-label="북돋움 프로그램 선택">
  <button class="choice-btn elementary-game" type="button"
    onclick="openCode('초등학생 게임용','1111','bdut.html')">
    <img class="choice-icon" src="ptbg.png" alt="">
    <span class="label">초등학생<span class="type">게임용</span></span>
  </button>

  <button class="choice-btn teen-game" type="button"
    onclick="openCode('중·고등학생 게임용','3333','ptbt.html')">
    <img class="choice-icon" src="ptbg.png" alt="">
    <span class="label">중·고등학생<span class="type">게임용</span></span>
  </button>

  <button class="choice-btn elementary-class" type="button"
    onclick="openCode('초등학생 수업용','2222','bduc.html')">
    <img class="choice-icon" src="ptbl.png" alt="">
    <span class="label">초등학생<span class="type">수업용</span></span>
  </button>

  <button class="choice-btn teen-class" type="button"
    onclick="openCode('중·고등학생 수업용','4444','ptbc.html')">
    <img class="choice-icon" src="ptbl.png" alt="">
    <span class="label">중·고등학생<span class="type">수업용</span></span>
  </button>
</main>

<div class="code-modal" id="codeModal" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
  <div class="final-card">
    <div class="final-kit" id="codeTitle">프로그램 선택</div>
    <div class="final-question">코드 입력</div>
    <div class="final-answer-row">
      <input id="codeInput" class="final-answer-input" type="text"
        inputmode="numeric" pattern="[0-9]*" maxlength="4"
        placeholder="코드 4자리" autocomplete="off">
      <div class="code-buttons">
        <button class="final-submit" type="button" onclick="checkCode()">입력</button>
        <button class="final-close" type="button" onclick="closeCode()">닫기</button>
      </div>
    </div>
    <div class="code-message" id="codeMessage"></div>
  </div>
</div>

<script>
const codeModal = document.getElementById("codeModal");
const codeInput = document.getElementById("codeInput");
const codeTitle = document.getElementById("codeTitle");
const codeMessage = document.getElementById("codeMessage");

let selectedCode = "";
let selectedPage = "";

function openCode(title, code, page){
  selectedCode = code;
  selectedPage = page;
  codeTitle.textContent = title;
  codeInput.value = "";
  codeMessage.textContent = "";
  codeModal.classList.add("show");
}

function closeCode(){
  codeModal.classList.remove("show");
  codeInput.blur();
  selectedCode = "";
  selectedPage = "";
}

function checkCode(){
  const value = codeInput.value.trim();

  if(!value){
    codeMessage.textContent = "코드를 입력해주세요.";
    return;
  }

  if(value === selectedCode){
    codeMessage.textContent = "";
    location.href = selectedPage;
    return;
  }

  codeMessage.textContent = "코드가 맞지 않습니다.";
  codeInput.select();
}

codeInput.addEventListener("keydown", function(e){
  if(e.key === "Enter") checkCode();
});

codeModal.addEventListener("click", function(e){
  if(e.target === codeModal) closeCode();
});
</script>
</body>
</html>
