<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLAY THE BOOK</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

:root {
  --btn-w: clamp(140px, 30vw, 305px);
  --btn-h: clamp(200px, 50vw, 350px);
  --btn-gap: clamp(26px, 4vw, 70px);
  --btn-bottom: clamp(140px, 25vh, 275px);

  /* 불빛 테두리 조정값 */
  --glow-inset-x: 12%;
  --glow-top: 1%;
  --glow-bottom: 4%;
  --glow-radius-top: 999px;
  --glow-radius-bottom: 18px;
}

body {
  position: relative;
  background: url("ptb.png") no-repeat center center / cover;
}

.button-area {
  position: absolute;
  left: 50%;
  bottom: var(--btn-bottom);
  transform: translateX(-50%);
  display: flex;
  gap: var(--btn-gap);
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.choice-btn {
  width: var(--btn-w);
  height: var(--btn-h);
  border: none;
  background: transparent;
  cursor: pointer;
  position: relative;
  padding: 0;
  transition: transform 0.18s ease, filter 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.choice-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  position: relative;
  z-index: 2;
  filter:
    drop-shadow(0 12px 16px rgba(0,0,0,0.55))
    drop-shadow(0 4px 5px rgba(0,0,0,0.4));
}

/* 실제 버튼 모양에 맞춘 아치형 불빛 */
.choice-btn::after {
  content: "";
  position: absolute;
  left: var(--glow-inset-x);
  right: var(--glow-inset-x);
  top: var(--glow-top);
  bottom: var(--glow-bottom);

  border-radius:
    var(--glow-radius-top) var(--glow-radius-top)
    var(--glow-radius-bottom) var(--glow-radius-bottom);

  opacity: 0;
  pointer-events: none;
  z-index: 1;

  border: 3px solid rgba(255, 230, 120, 0.95);

  box-shadow:
    0 0 8px rgba(255, 230, 120, 0.95),
    0 0 18px rgba(255, 205, 70, 0.85),
    0 0 34px rgba(255, 165, 30, 0.65),
    inset 0 0 10px rgba(255, 230, 120, 0.45);

  transition: opacity 0.15s ease;
}

/* 버튼 뒤쪽으로 퍼지는 빛 */
.choice-btn::before {
  content: "";
  position: absolute;
  left: var(--glow-inset-x);
  right: var(--glow-inset-x);
  top: var(--glow-top);
  bottom: var(--glow-bottom);

  border-radius:
    var(--glow-radius-top) var(--glow-radius-top)
    var(--glow-radius-bottom) var(--glow-radius-bottom);

  opacity: 0;
  pointer-events: none;
  z-index: 0;

  background: rgba(255, 210, 90, 0.18);
  filter: blur(12px);
  transition: opacity 0.15s ease;
}

.choice-btn:hover {
  transform: translateY(-5px) scale(1.03);
}

.choice-btn:active {
  transform: translateY(1px) scale(0.98);
}

.choice-btn.selected::after,
.choice-btn.selected::before {
  opacity: 1;
}

.choice-btn.selected img {
  filter:
    brightness(1.12)
    saturate(1.1)
    drop-shadow(0 0 10px rgba(255,220,120,0.9))
    drop-shadow(0 12px 16px rgba(0,0,0,0.55));
}

.choice-btn.selected {
  animation: buttonFlash 0.42s ease;
}

@keyframes buttonFlash {
  0% { transform: scale(1); }
  45% { transform: scale(1.045); }
  100% { transform: scale(1); }
}

/* 휴대폰 세로 보정 */
@media (max-width: 430px) {
  :root {
    --btn-w: 120px;
    --btn-h: 200px;
    --btn-gap: 10px;
    --btn-bottom: 160px;

    --glow-inset-x: 12%;
    --glow-top: 1%;
    --glow-bottom: 4%;
    --glow-radius-bottom: 12px;
  }
}
</style>
</head>

<body>
  <div class="button-area">
    <button class="choice-btn" onclick="goPage(this, 'https://baekko.github.io/cnedu/ptrs.html')" aria-label="초등학생용">
      <img src="ptb7.png" alt="초등학생용">
    </button>

    <button class="choice-btn" onclick="goPage(this, 'https://baekko.github.io/cnedu/ptbs.html')" aria-label="중고등학생용">
      <img src="ptb13.png" alt="중고등학생용">
    </button>
  </div>

  <script>
    let isMoving = false;

    function goPage(button, url) {
      if (isMoving) return;
      isMoving = true;

      button.classList.add("selected");

      setTimeout(function () {
        location.href = url;
      }, 450);
    }
  </script>
</body>
</html>
