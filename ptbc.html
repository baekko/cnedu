<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY THE BOOK CLASS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",sans-serif;background:#000;}

:root{
  --shelf-w: clamp(560px, 72vw, 780px);
  --shelf-top: clamp(70px, 9vh, 105px);
  --wood:#7b4a2f;
  --wood-light:#8a5637;
  --wood-dark:#3f2418;
  --outer-border:10px;
  --inner-border:5px;
  --cell-gap:10px;
  --cell-h: clamp(168px, 21vw, 218px);
  --book-w: clamp(100px, 13vw, 135px);
  --book-h: clamp(143px, 18.6vw, 193px);
}

body{
  position:relative;
  background:url("ptbin.png") no-repeat center center / cover;
}

.page-wrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:var(--shelf-top);
}

.bookshelf{
  position:relative;
  width:var(--shelf-w);
  padding:12px;
  background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(0,0,0,.08)),var(--wood);
  border:var(--outer-border) solid var(--wood-light);
  box-shadow:0 24px 44px rgba(0,0,0,.33), inset 0 0 0 3px rgba(68,30,15,.24);
}

.bookshelf::before{
  content:"";
  position:absolute;
  left:-18px;
  right:-18px;
  top:-24px;
  height:24px;
  background:linear-gradient(180deg,#8a5637,#6b3f29);
  box-shadow:0 8px 14px rgba(0,0,0,.25);
}

.bookshelf::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-38px;
  transform:translateX(-50%);
  width:112%;
  height:48px;
  background:rgba(230,210,170,.58);
  border-radius:50%;
  z-index:-1;
}

.shelf-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,var(--cell-h));
  gap:var(--cell-gap);
}

.shelf-cell{
  background:radial-gradient(circle at center, rgba(120,70,40,.45), rgba(50,25,15,.18) 55%, rgba(0,0,0,.18)),var(--wood-dark);
  border:var(--inner-border) solid var(--wood-light);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  box-shadow:inset 0 10px 16px rgba(0,0,0,.34), inset 0 -4px 7px rgba(255,180,100,.08);
}

.empty-cell{
  visibility:hidden;
}

.mission-btn{
  border:none;
  background:transparent;
  cursor:pointer;
  padding:0;
  margin:0;
  display:block;
  width:var(--book-w);
  height:var(--book-h);
  transition:transform .18s ease, filter .18s ease;
  -webkit-tap-highlight-color:transparent;
}

.mission-btn img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 12px 10px rgba(0,0,0,.48))
    drop-shadow(4px 4px 5px rgba(0,0,0,.30))
    drop-shadow(-2px -1px 2px rgba(255,255,255,.14));
}

.mission-btn:hover{
  transform:translateY(-4px) scale(1.04);
  filter:brightness(1.08);
}

.mission-btn:active{
  transform:translateY(1px) scale(.97);
}

@media(max-width:600px){
  :root{
    --shelf-w:88vw;
    --shelf-top:9vh;
    --outer-border:7px;
    --inner-border:4px;
    --cell-gap:7px;
    --cell-h:112px;
    --book-w:66px;
    --book-h:94px;
  }

  .bookshelf{padding:8px;}
  .bookshelf::before{left:-12px;right:-12px;top:-18px;height:18px;}
  .bookshelf::after{bottom:-30px;height:38px;}
}

@media(max-width:390px){
  :root{
    --shelf-w:90vw;
    --shelf-top:8.5vh;
    --cell-h:103px;
    --book-w:60px;
    --book-h:86px;
  }
}
</style>
</head>

<body>
<div class="page-wrap">
  <div class="bookshelf">
    <div class="shelf-grid">
      <div class="shelf-cell">
        <button class="mission-btn" onclick="location.href='https://baekko.github.io/cnedu/ptbc1.html'">
          <img src="ptbc1.png" alt="수업용 1">
        </button>
      </div>

      <div class="shelf-cell">
        <button class="mission-btn" onclick="location.href='https://baekko.github.io/cnedu/ptbc2.html'">
          <img src="ptbc2.png" alt="수업용 2">
        </button>
      </div>

      <div class="shelf-cell">
        <button class="mission-btn" onclick="location.href='https://baekko.github.io/cnedu/ptbc3.html'">
          <img src="ptbc3.png" alt="수업용 3">
        </button>
      </div>

      <div class="shelf-cell">
        <button class="mission-btn" onclick="location.href='https://baekko.github.io/cnedu/ptbc4.html'">
          <img src="ptbc4.png" alt="수업용 4">
        </button>
      </div>

      <div class="shelf-cell">
        <button class="mission-btn" onclick="location.href='https://baekko.github.io/cnedu/ptbc5.html'">
          <img src="ptbc5.png" alt="수업용 5">
        </button>
      </div>

      <div class="shelf-cell empty-cell"></div>
    </div>
  </div>
</div>
</body>
</html>
