<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY THE BOOK MAIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",sans-serif;background:#000;}

:root{
  --shelf-w: clamp(560px, 72vw, 780px);
  --shelf-top: clamp(70px, 9vh, 105px);
  --wood:#9a5a34;
  --wood-light:#c87545;
  --wood-dark:#4a2719;
  --outer-border:10px;
  --inner-border:5px;
  --cell-gap:10px;
  --cell-h: clamp(168px, 21vw, 218px);
  --book-w: clamp(100px, 13vw, 135px);
  --book-h: clamp(143px, 18.6vw, 193px);
  --wide-w: clamp(160px, 21vw, 210px);
  --wide-h: clamp(96px, 12.6vw, 126px);
}

body{position:relative;background:url("ptbin.png") no-repeat center center / cover;}

.page-wrap{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start;padding-top:var(--shelf-top);}

.bookshelf{
  position:relative;
  width:var(--shelf-w);
  padding:12px;
  background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(0,0,0,.08)),var(--wood);
  border:var(--outer-border) solid var(--wood-light);
  box-shadow:0 24px 44px rgba(0,0,0,.33), inset 0 0 0 3px rgba(68,30,15,.24);
}

.bookshelf::before{
  content:"";
  position:absolute;
  left:-18px;
  right:-18px;
  top:-24px;
  height:24px;
  background:linear-gradient(180deg,#d18450,#a85d35);
  box-shadow:0 8px 14px rgba(0,0,0,.25);
}

.bookshelf::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-38px;
  transform:translateX(-50%);
  width:112%;
  height:48px;
  background:rgba(230,210,170,.58);
  border-radius:50%;
  z-index:-1;
}

.shelf-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,var(--cell-h));
  gap:var(--cell-gap);
}

.shelf-cell{
  background:radial-gradient(circle at center, rgba(120,70,40,.45), rgba(50,25,15,.18) 55%, rgba(0,0,0,.18)),var(--wood-dark);
  border:var(--inner-border) solid var(--wood-light);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  box-shadow:inset 0 10px 16px rgba(0,0,0,.34), inset 0 -4px 7px rgba(255,180,100,.08);
}

.mission-btn{
  border:none;
  background:transparent;
  cursor:pointer;
  position:relative;
  padding:0;
  margin:0;
  display:block;
  transition:transform .18s ease, filter .18s ease, opacity .18s ease;
  -webkit-tap-highlight-color:transparent;
}

.mission-btn.book{width:var(--book-w);height:var(--book-h);}
.mission-btn.wide{width:var(--wide-w);height:var(--wide-h);margin-bottom:22px;}

.mission-btn.book img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 12px 10px rgba(0,0,0,.48)) drop-shadow(4px 4px 5px rgba(0,0,0,.30)) drop-shadow(-2px -1px 2px rgba(255,255,255,.14));
}

.mission-btn.wide img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.24));
}

.mission-btn:hover:not(:disabled){transform:translateY(-4px) scale(1.04);filter:brightness(1.08);}
.mission-btn:active:not(:disabled){transform:translateY(1px) scale(.97);}
.mission-btn:disabled{opacity:.38;filter:grayscale(100%);cursor:default;}

.info-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
}

.info-modal.show{display:flex;}

.info-box{
  position:relative;
  width:min(82vw,560px);
  max-height:82vh;
  background:#fff7e8;
  border-radius:22px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.42);
}

.info-box img{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  display:block;
  border-radius:16px;
}

.info-close{
  position:absolute;
  right:-12px;
  top:-12px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#5a321d;
  color:white;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}

.reopen-btn{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  z-index:900;
  display:none;
  border:none;
  border-radius:999px;
  padding:10px 24px;
  background:rgba(90,50,29,.88);
  color:#fff8e8;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.32);
}

.reopen-btn.show{display:block;}

.dev-reset-btn{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:999;
  border:none;
  border-radius:10px;
  padding:10px 14px;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:600px){
  :root{
    --shelf-w:88vw;
    --shelf-top:9vh;
    --outer-border:7px;
    --inner-border:4px;
    --cell-gap:7px;
    --cell-h:112px;
    --book-w:66px;
    --book-h:94px;
    --wide-w:100px;
    --wide-h:60px;
  }

  .bookshelf{padding:8px;}
  .bookshelf::before{left:-12px;right:-12px;top:-18px;height:18px;}
  .bookshelf::after{bottom:-30px;height:38px;}
  .mission-btn.wide{margin-bottom:12px;}
  .info-box{width:88vw;padding:12px;}
  .info-close{right:-8px;top:-8px;width:36px;height:36px;font-size:21px;}
  .reopen-btn{bottom:12px;font-size:14px;padding:9px 20px;}
  .dev-reset-btn{right:10px;bottom:10px;padding:8px 10px;font-size:12px;}
}

@media(max-width:390px){
  :root{
    --shelf-w:90vw;
    --shelf-top:8.5vh;
    --cell-h:103px;
    --book-w:60px;
    --book-h:86px;
    --wide-w:92px;
    --wide-h:55px;
  }
}
</style>
</head>

<body>
<div class="page-wrap">
  <div class="bookshelf">
    <div class="shelf-grid">
      <div class="shelf-cell"><button class="mission-btn book" id="btn1" onclick="goMission(1)"><img src="ptbm1.png" alt="1번 문제"></button></div>
      <div class="shelf-cell"><button class="mission-btn book" id="btn2" onclick="goMission(2)"><img src="ptbm2.png" alt="2번 문제"></button></div>
      <div class="shelf-cell"><button class="mission-btn book" id="btn3" onclick="goMission(3)"><img src="ptbm3.png" alt="3번 문제"></button></div>
      <div class="shelf-cell"><button class="mission-btn book" id="btn4" onclick="goMission(4)"><img src="ptbm4.png" alt="4번 문제"></button></div>
      <div class="shelf-cell"><button class="mission-btn book" id="btn5" onclick="goMission(5)"><img src="ptbm5.png" alt="5번 문제"></button></div>
      <div class="shelf-cell"><button class="mission-btn wide" id="btn6" onclick="goMission(6)" disabled><img src="ptbm6.png" alt="6번"></button></div>
    </div>
  </div>
</div>

<div class="info-modal" id="infoModal">
  <div class="info-box">
    <button class="info-close" onclick="closeInfoModal()">×</button>
    <img id="infoModalImg" src="ptbmm.png" alt="안내 이미지">
  </div>
</div>

<button class="reopen-btn" id="reopenBtn" onclick="openInfoModal()">다시보기</button>
<button class="dev-reset-btn" onclick="resetDev()">개발용 초기화</button>

<script>
const PROGRESS_KEY = "ptb_progress_v1";
const MODAL_KEY = "ptbm_modal_seen_once";
const END_MODAL_KEY = "ptbm_end_modal_seen_once";

function getProgress(){
  try{
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
  }catch(e){
    return {};
  }
}

function all1to5Done(progress){
  for(let i=1;i<=5;i++){
    if(!progress[i] || !progress[i].completed) return false;
  }
  return true;
}

function applyButtons(){
  const progress = getProgress();

  for(let i=1;i<=5;i++){
    const btn = document.getElementById("btn"+i);
    btn.disabled = !!(progress[i] && progress[i].completed);
  }

  document.getElementById("btn6").disabled = !all1to5Done(progress);
}

function goMission(num){
  if(num>=1 && num<=5){
    location.href = `ptbq${num}.html`;
  }else if(num===6){
    location.href = "https://baekko.github.io/cnedu/ptbend.html";
  }
}

function resetDev(){
  if(confirm("개발용 초기화를 할까요?")){
    localStorage.removeItem(PROGRESS_KEY);
    sessionStorage.removeItem(MODAL_KEY);
    sessionStorage.removeItem(END_MODAL_KEY);
    location.reload();
  }
}

function setModalImage(src){
  document.getElementById("infoModalImg").src = src;
}

function openInfoModal(){
  document.getElementById("infoModal").classList.add("show");
}

function closeInfoModal(){
  document.getElementById("infoModal").classList.remove("show");
  document.getElementById("reopenBtn").classList.add("show");
}

window.addEventListener("pageshow", function(){
  applyButtons();

  const progress = getProgress();

  if(all1to5Done(progress)){
    document.getElementById("reopenBtn").classList.remove("show");

    if(sessionStorage.getItem(END_MODAL_KEY) !== "true"){
      sessionStorage.setItem(END_MODAL_KEY, "true");
      setModalImage("ptbme.png");

      setTimeout(function(){
        openInfoModal();
      }, 1000);
    }

    return;
  }

  if(sessionStorage.getItem(MODAL_KEY) !== "true"){
    sessionStorage.setItem(MODAL_KEY, "true");
    setModalImage("ptbmm.png");

    setTimeout(function(){
      openInfoModal();
    }, 1000);
  }
});

applyButtons();
</script>
</body>
</html>
