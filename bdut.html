<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#f4ecd1">

<title>RABBIT HOLE TITLE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  background:#000;

  font-family:
    "Gowun Dodum",
    sans-serif;
}


/* =========================================================
   래빗홀 버튼 색상
========================================================= */

:root{

  --green:#4f7d32;
  --green-dark:#29451b;

}


/* =========================================================
   배경 영상
========================================================= */

.video-bg{
  position:fixed;

  inset:0;

  z-index:1;

  overflow:hidden;

  background:#000;
}


.video-bg video{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* =========================================================
   다음 버튼

   ★ bdum의 모험시작 버튼 스타일과 동일
========================================================= */

.next-btn{

  position:fixed;

  left:50%;

  bottom:
    clamp(
      42px,
      6vh,
      70px
    );

  transform:
    translateX(-50%);

  z-index:20;

  display:none;


  /* 버튼 크기 */

  height:58px;

  min-width:145px;

  padding:
    0 28px;


  /* 테두리 */

  border:
    3px solid
    var(--green-dark);

  border-radius:15px;


  /* 색상 */

  background:
    var(--green);

  color:#fffdf1;


  /* 글씨 */

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;


  /* 버튼 효과 */

  cursor:pointer;

  box-shadow:
    0 5px 8px
    rgba(0,0,0,.30),

    inset 0 2px 2px
    rgba(255,255,255,.25);


  text-shadow:
    0 1px 2px
    rgba(0,0,0,.25);


  -webkit-tap-highlight-color:
    transparent;

  transition:
    transform .15s ease;
}


/* =========================================================
   버튼 등장
========================================================= */

.next-btn.show{

  display:block;

  animation:
    fadeUp .35s ease;
}


/* =========================================================
   버튼 마우스 효과
========================================================= */

.next-btn:hover{

  transform:
    translateX(-50%)
    translateY(-2px)
    scale(1.03);
}


/* =========================================================
   버튼 누름
========================================================= */

.next-btn:active{

  transform:
    translateX(-50%)
    translateY(2px)
    scale(.96);
}


/* =========================================================
   등장 애니메이션
========================================================= */

@keyframes fadeUp{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(14px);
  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0);
  }

}


/* =========================================================
   휴대폰

   ★ bdum 모험시작 버튼과 동일한 크기
========================================================= */

@media(max-width:600px){

  .next-btn{

    bottom:
      calc(
        36px
        +
        env(safe-area-inset-bottom)
      );

    height:46px;

    min-width:110px;

    padding:
      0 18px;

    border-width:3px;

    border-radius:13px;

    font-size:15px;
  }

}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  .next-btn{

    bottom:
      calc(
        30px
        +
        env(safe-area-inset-bottom)
      );

    height:44px;

    min-width:105px;

    padding:
      0 15px;

    font-size:14px;
  }

}


/* =========================================================
   ★ 래빗홀 공통 색상 잠금
   휴대폰 / 태블릿 / PC에서 색이 달라 보이지 않도록
   색상과 말박스 불투명도를 동일하게 고정
========================================================= */

:root{
  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}

.talk-box,
.mission-card,
.info-box{
  background:var(--paper) !important;
}

.talk-box{
  color:var(--paper-text) !important;
  border-color:var(--paper-border) !important;
}

.round-btn,
.adventure-btn,
.next-page-btn,
.next-btn,
.submit-btn,
.action-btn,
.modal-close{
  background:var(--green) !important;
  color:#fffdf1 !important;
  border-color:var(--green-dark) !important;
}

.arrow-shape{
  fill:var(--green) !important;
  stroke:var(--green-dark) !important;
}



/* =========================================================
   ★ 최종 색상 강제 고정
   휴대폰 / 태블릿 / PC에서 브라우저 기본 렌더링과
   그라데이션/반투명 차이를 없애고 동일한 HEX 색상 사용
========================================================= */

html, body{
  color-scheme:light only !important;
}

button, input{
  -webkit-appearance:none !important;
  appearance:none !important;
}

.talk-box,
.mission-card,
.info-box{
  background:#f4ecd1 !important;
  background-color:#f4ecd1 !important;
  background-image:none !important;
  opacity:1 !important;
}

.talk-box{
  color:#8c4a2e !important;
  -webkit-text-fill-color:#8c4a2e !important;
  border-color:#7f4b3a !important;
}

.round-btn,
.adventure-btn,
.next-page-btn,
.next-btn,
.submit-btn,
.action-btn:not(:disabled),
.modal-close{
  background:#4f7d32 !important;
  background-color:#4f7d32 !important;
  background-image:none !important;
  color:#fffdf1 !important;
  -webkit-text-fill-color:#fffdf1 !important;
  border-color:#29451b !important;
  opacity:1 !important;
  filter:none !important;
}

.arrow-shape{
  fill:#4f7d32 !important;
  stroke:#29451b !important;
}

.arrow-highlight{
  fill:rgba(255,255,255,.25) !important;
}



/* =========================================================
   ★ 태블릿 강제 다크모드 차단 + 래빗홀 색상 완전 고정
========================================================= */
:root{
  color-scheme:light only !important;
  supported-color-schemes:light !important;
}

html, body{
  color-scheme:light only !important;
  forced-color-adjust:none !important;
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
}

*, *::before, *::after{
  forced-color-adjust:none !important;
}

.talk-box{
  background:#f4ecd1 !important;
  background-color:#f4ecd1 !important;
  background-image:none !important;
  color:#8c4a2e !important;
  -webkit-text-fill-color:#8c4a2e !important;
  border-color:#7f4b3a !important;
  opacity:1 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

.mission-card{
  background:#f4ecd1 !important;
  background-color:#f4ecd1 !important;
  background-image:none !important;
  border-color:#7f4b3a !important;
  opacity:1 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

.info-box{
  background:#f7f4df !important;
  background-color:#f7f4df !important;
  background-image:none !important;
  opacity:1 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

.arrow-shape{
  fill:#4f7d32 !important;
  stroke:#29451b !important;
}

.round-btn,
.adventure-btn,
.next-page-btn,
.next-btn,
.modal-close{
  background:#4f7d32 !important;
  background-color:#4f7d32 !important;
  background-image:none !important;
  color:#fffdf1 !important;
  -webkit-text-fill-color:#fffdf1 !important;
  border-color:#29451b !important;
  opacity:1 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

.submit-btn,
.action-btn:not(:disabled){
  background:#4f7d32 !important;
  background-color:#4f7d32 !important;
  background-image:none !important;
  color:#fffdf1 !important;
  -webkit-text-fill-color:#fffdf1 !important;
  opacity:1 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

.answer-input,
.mission-question,
.mission-image-box{
  background:#ffffff !important;
  background-color:#ffffff !important;
  color:#111111 !important;
  -webkit-text-fill-color:#111111 !important;
  filter:none !important;
  mix-blend-mode:normal !important;
}

@media (prefers-color-scheme: dark){
  .talk-box{
    background:#f4ecd1 !important;
    color:#8c4a2e !important;
    -webkit-text-fill-color:#8c4a2e !important;
    border-color:#7f4b3a !important;
  }
  .mission-card{ background:#f4ecd1 !important; border-color:#7f4b3a !important; }
  .info-box{ background:#f7f4df !important; }
  .round-btn,.adventure-btn,.next-page-btn,.next-btn,.modal-close,.submit-btn,.action-btn:not(:disabled){
    background:#4f7d32 !important;
    color:#fffdf1 !important;
    -webkit-text-fill-color:#fffdf1 !important;
  }
  .arrow-shape{ fill:#4f7d32 !important; stroke:#29451b !important; }
}

@media (min-width:601px) and (max-width:1100px){
  .next-btn{ height:48px !important; min-width:108px !important; padding:0 18px !important; border-radius:13px !important; font-size:16px !important; bottom:42px !important; }
}

</style>
</head>


<body>


<!-- =====================================================
     타이틀 영상
===================================================== -->

<div class="video-bg">

  <video
    id="bgVideo"
    muted
    playsinline
  >

    <source
      src="bdut.mp4"
      type="video/mp4"
    >

  </video>

</div>


<!-- =====================================================
     다음 버튼
===================================================== -->

<button
  id="nextBtn"
  class="next-btn"
  type="button"
  onclick="goNext()"
>
  다음
</button>


<script>

const video =
  document.getElementById(
    "bgVideo"
  );


const nextBtn =
  document.getElementById(
    "nextBtn"
  );


let nextTimer =
  null;


/* =========================================================
   페이지 시작
========================================================= */

function startPage(){

  nextBtn
    .classList
    .remove(
      "show"
    );


  clearTimeout(
    nextTimer
  );


  video.pause();

  video.currentTime =
    0;


  video
    .play()
    .catch(
      function(){

        /*
          모바일에서 자동재생이 막혀도
          12초 뒤에는 다음 버튼 표시
        */

      }
    );


  /* =====================================================
     12초 후 다음 버튼
  ===================================================== */

  nextTimer =
    setTimeout(
      function(){

        nextBtn
          .classList
          .add(
            "show"
          );

      },

      12000
    );

}


/* =========================================================
   영상이 끝나도 화면 유지
========================================================= */

video.addEventListener(
  "ended",

  function(){

    video.pause();

  }
);


/* =========================================================
   다음 페이지
========================================================= */

function goNext(){

  location.href =
    "https://baekko.github.io/cnedu/bduin.html";

}


/* =========================================================
   최초 실행
========================================================= */

window.addEventListener(
  "load",
  startPage
);


/* =========================================================
   뒤로가기로 다시 왔을 때도 처음부터
========================================================= */

window.addEventListener(
  "pageshow",

  function(){

    startPage();

  }
);

</script>

</body>
</html>
