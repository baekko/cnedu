<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PTB QUESTION 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;

  background:#000;
}


/* =========================================================
   색상
========================================================= */

:root{

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#784738;

  --blue:#235a9e;
  --orange:#ff884d;

  --button:#5a321d;

  --ui-bottom:5.5vh;
}


/* =========================================================
   배경

   ★ 미션카드가 없는 새 ptbq2.png 사용
========================================================= */

body{
  position:relative;

  background:
    url("ptbq2.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   미션카드
========================================================= */

.mission-wrap{
  position:fixed;

  left:50%;
  top:43%;

  transform:
    translate(-50%,-50%);

  width:
    min(86vw,620px);

  display:none;

  z-index:25;
}


.mission-wrap.show{
  display:block;
}


.mission-card{
  width:100%;

  padding:
    30px 28px 27px;

  border:
    5px solid
    var(--paper-border);

  border-radius:
    28px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 14px 30px
    rgba(0,0,0,.30);
}


/* =========================================================
   제목
========================================================= */

.mission-title{
  color:
    var(--paper-text);

  font-size:28px;
  font-weight:900;

  line-height:1.4;

  margin-bottom:20px;

  word-break:keep-all;
}


/* =========================================================
   키트
========================================================= */

.mission-kit{
  color:
    var(--blue);

  font-size:30px;
  font-weight:900;

  margin-bottom:22px;
}


/* =========================================================
   미션 질문 박스

   ★ 이미지 없음
========================================================= */

.mission-question{
  width:100%;

  padding:
    15px 14px;

  margin-bottom:20px;

  border:
    5px solid
    var(--orange);

  border-radius:
    10px;

  background:#fff;

  color:#000;

  font-size:22px;
  font-weight:900;

  line-height:1.45;

  word-break:keep-all;
}


/* =========================================================
   정답 형식
========================================================= */

.mission-guide{
  color:#000;

  font-size:30px;
  font-weight:900;

  line-height:1.35;
}


/* =========================================================
   정답 입력 UI
========================================================= */

.ui-wrap{
  position:fixed;

  left:50%;
  bottom:
    var(--ui-bottom);

  transform:
    translateX(-50%);

  width:
    clamp(420px,56vw,560px);

  z-index:35;

  display:none;

  flex-direction:column;

  gap:14px;
}


.ui-wrap.show{
  display:flex;
}


.answer-row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    86px;

  gap:12px;
}


.answer-input{
  width:100%;
  height:58px;

  border:none;

  border-radius:14px;

  padding:
    0 18px;

  outline:none;

  background:
    rgba(255,255,255,.97);

  color:#222;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;
  font-weight:700;

  box-shadow:
    0 8px 18px
    rgba(0,0,0,.25);
}


.submit-btn{
  height:58px;

  border:none;

  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:18px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}


/* =========================================================
   힌트 / 정답 / 기억보상
========================================================= */

.action-row{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}


.action-btn{
  height:54px;

  border:none;

  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:17px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}


.submit-btn:active,
.action-btn:active{
  transform:
    translateY(2px)
    scale(.98);
}


.action-btn:disabled{
  opacity:.42;
  cursor:default;
}


/* =========================================================
   글자 모달
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);
}


.modal.show{
  display:flex;
}


.modal-box{
  width:
    min(86vw,560px);

  padding:
    30px 24px;

  border-radius:22px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 18px 40px
    rgba(0,0,0,.35);
}


.modal-title{
  color:#2b160c;

  font-size:28px;
  font-weight:900;

  margin-bottom:18px;
}


.modal-content{
  color:#2b160c;

  font-size:22px;
  font-weight:700;

  line-height:1.6;

  white-space:pre-line;
  word-break:keep-all;
}


.modal-close{
  height:50px;
  min-width:100px;

  margin-top:22px;

  padding:
    0 24px;

  border:none;

  border-radius:14px;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}



/* HTML 편지 모달 */
.letter-modal{position:fixed;inset:0;z-index:150;display:none;justify-content:center;align-items:center;padding:18px;background:rgba(0,0,0,.55)}
.letter-modal.show{display:flex;animation:letterFade .28s ease}
.letter-paper{position:relative;width:min(88vw,520px);height:min(76vh,700px);min-height:560px;padding:118px 46px 82px;overflow:hidden;background:linear-gradient(rgba(255,250,240,.78),rgba(248,237,217,.78)),radial-gradient(circle at 25% 20%,rgba(150,105,60,.08),transparent 34%),radial-gradient(circle at 75% 72%,rgba(150,105,60,.07),transparent 38%),#f6ead6;border:1px solid #c7a37d;border-radius:5px;box-shadow:0 20px 45px rgba(0,0,0,.42),inset 0 0 35px rgba(130,85,45,.08);animation:letterOpen .38s ease}
.letter-paper:before{content:"";position:absolute;inset:15px;border:1px solid rgba(166,116,68,.55);pointer-events:none}
.letter-top{position:absolute;top:7%;left:50%;transform:translateX(-50%);color:#a77a50;font-size:28px;letter-spacing:.14em;white-space:nowrap}
.letter-content{position:relative;z-index:2;color:#2d2925;font-family:"Nanum Pen Script","Gowun Dodum",sans-serif;font-size:30px;font-weight:400;line-height:1.42;letter-spacing:.015em;display:block;height:auto;white-space:pre-line;word-break:keep-all;text-align:left}
.letter-bottom{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);color:#b58a61;font-size:18px;letter-spacing:.18em;white-space:nowrap}
.letter-close{position:absolute;right:8%;bottom:8%;z-index:4;height:42px;min-width:76px;padding:0 17px;border:none;border-radius:13px;background:var(--button);color:#fff;font-family:"Gowun Dodum",sans-serif;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.28)}
@keyframes letterOpen{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes letterFade{from{opacity:0}to{opacity:1}}
@keyframes missionReveal{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes uiReveal{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mission-wrap.show{display:block;animation:missionReveal .38s ease both}.ui-wrap.show{display:flex;animation:uiReveal .38s ease both}
@media(max-width:600px){.letter-paper{width:88vw;height:min(74vh,650px);min-height:500px;padding:100px 34px 72px}.letter-content{font-size:25px;line-height:1.42}.letter-top{top:6%;font-size:24px}.letter-bottom{bottom:4.5%}.letter-close{right:7%;bottom:7%}}
@media(max-width:390px){.letter-paper{width:90vw;height:min(74vh,620px);min-height:480px;padding:92px 29px 68px}.letter-content{font-size:23px;line-height:1.4}}


/* =========================================================
   결과 영상
========================================================= */

.video-modal{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.68);
}


.video-modal.show{
  display:flex;
}


.video-box{
  width:
    clamp(360px,58vw,760px);

  max-height:76vh;

  overflow:hidden;

  border-radius:24px;

  background:transparent;

  box-shadow:
    0 22px 55px
    rgba(0,0,0,.55);
}


.result-video{
  display:block;

  width:100%;
  height:auto;

  border-radius:24px;

  background:transparent;
}


.video-fallback{
  display:none;

  width:100%;

  padding:
    30px 20px;

  border-radius:24px;

  background:#fff7e8;

  color:#3b2012;

  text-align:center;

  font-size:22px;
  font-weight:900;

  line-height:1.5;

  white-space:pre-line;
}


.video-fallback.show{
  display:block;
}


/* =========================================================
   오답 흔들림
========================================================= */

.shake{
  animation:
    shake .25s ease;
}


@keyframes shake{

  0%{
    transform:
      translateX(-50%)
      translateX(0);
  }

  25%{
    transform:
      translateX(-50%)
      translateX(-6px);
  }

  50%{
    transform:
      translateX(-50%)
      translateX(6px);
  }

  75%{
    transform:
      translateX(-50%)
      translateX(-4px);
  }

  100%{
    transform:
      translateX(-50%)
      translateX(0);
  }

}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px){

  .mission-wrap{
    width:
      min(88vw,380px);

    top:42%;
  }


  .mission-card{
    padding:
      22px 18px 20px;

    border-width:4px;

    border-radius:22px;
  }


  .mission-title{
    font-size:19px;

    margin-bottom:13px;
  }


  .mission-kit{
    font-size:21px;

    margin-bottom:14px;
  }


  .mission-question{
    padding:
      10px 8px;

    margin-bottom:13px;

    border-width:3px;

    border-radius:8px;

  }


  .mission-guide{
    font-size:21px;
  }


  .ui-wrap{
    width:
      min(88vw,330px);

    bottom:4.5vh;

    gap:11px;
  }


  .answer-row{
    grid-template-columns:
      minmax(0,1fr)
      64px;

    gap:8px;
  }


  .answer-input{
    height:52px;

    padding:
      0 14px;

    border-radius:13px;

  }


  .submit-btn{

  }

  }


  .action-btn{

  }

  }


  .modal-content{

  }


  .image-box{
    width:88vw;

  }

/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  .mission-wrap{
    width:90vw;

    top:41%;
  }


  .mission-card{
    padding:
      19px 15px 18px;
  }


  .mission-title{
    font-size:18px;
  }


  .mission-kit{
    font-size:20px;
  }


  .mission-question{
    font-size:15px;
  }


  .mission-guide{

  }

/* =========================================================
   높이가 낮은 화면
========================================================= */

@media(max-height:700px){

  .mission-wrap{
    top:38%;
  }


  .mission-card{
    padding-top:16px;
    padding-bottom:16px;
  }


  .mission-title{
    margin-bottom:10px;
  }


  .mission-kit{
    margin-bottom:10px;
  }


  .mission-question{
    margin-bottom:10px;
  }

/* 가로 화면 안내 */
.landscape-guide{
  display:none;
}

@media (orientation: landscape){
  .landscape-guide{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
  }

  .landscape-guide-text{
    font-family:"Gowun Dodum",sans-serif;
    font-size:20px;
    font-weight:700;

/* =========================================================
   미션카드 편지지형 디자인
   - 기존 Gowun Dodum 폰트/문구/문제이미지 유지
   - 알림편지의 종이 질감과 이중 테두리만 차용
   - 상단 편지 아이콘 / 하단 하트 장식 없음
========================================================= */
.mission-card{
  position:relative;
  overflow:hidden;

  border:1px solid #c7a37d !important;
  border-radius:5px !important;

  background:
    linear-gradient(rgba(255,250,240,.82),rgba(248,237,217,.82)),
    radial-gradient(circle at 25% 20%,rgba(150,105,60,.08),transparent 34%),
    radial-gradient(circle at 75% 72%,rgba(150,105,60,.07),transparent 38%),
    #f6ead6 !important;

  box-shadow:
    0 20px 45px rgba(0,0,0,.34),
    inset 0 0 35px rgba(130,85,45,.08) !important;

  padding:34px 36px 31px !important;
}

/* 편지지 안쪽의 얇은 테두리 */
.mission-card::before{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid rgba(166,116,68,.55);
  pointer-events:none;
  z-index:0;
}

/* 내용은 안쪽 테두리보다 위 */
.mission-card > *{
  position:relative;
  z-index:1;
}

/* 폰트는 기존 미션카드 그대로 유지 */
.mission-title,
.mission-kit,
.mission-guide{
  font-family:"Gowun Dodum",sans-serif !important;
}

/* 문제 그림 박스도 종이와 어울리게 너무 두껍지 않게 */
.mission-image-box{
  border-width:3px !important;
  border-color:#d58a58 !important;
  background:rgba(255,255,255,.78) !important;
}

@media(max-width:600px){
  .mission-card{
    padding:27px 26px 24px !important;
  }
  .mission-card::before{
    inset:11px;
  }
  .mission-image-box{
    border-width:2px !important;
  }
}

@media(max-width:390px){
  .mission-card{
    padding:24px 22px 22px !important;
  }
  .mission-card::before{
    inset:10px;
  }
}

@media(max-height:700px){
  .mission-card{
    padding-top:22px !important;
    padding-bottom:20px !important;
  }
}


/* ===== 최신 원본 기준 25:40 박스형 ===== */
html,body{width:100%!important;height:100%!important;min-height:100dvh!important;overflow:hidden!important;}
body{display:flex!important;align-items:center!important;justify-content:center!important;background:#17110d!important;}
.ptb-frame{
 width:min(90vw,calc((100dvh - 24px)*.625));
 aspect-ratio:25/40;
 position:relative;
 overflow:hidden;
 background:url("ptbq2.png") center center/cover no-repeat;
 border:5px solid #7f4b3a;
 box-shadow:0 16px 32px rgba(0,0,0,.38);
 container-type:inline-size;
}
.ptb-frame .mission-wrap,.ptb-frame .ui-wrap,.ptb-frame .bottom-btn-area{position:absolute!important;}
.ptb-frame .modal,.ptb-frame .letter-modal,.ptb-frame .video-modal,.ptb-frame .score-modal,.ptb-frame .reset-modal{position:absolute!important;}

/* 미션카드의 최신 디자인은 건드리지 않고, 카드 전체 폭만 입력 UI와 동일 */
.ptb-frame .mission-wrap,
.ptb-frame .ui-wrap{
 left:5% !important;
 right:5% !important;
 width:auto !important;
 max-width:none !important;
}
.ptb-frame .mission-wrap{
 transform:translateY(-50%) !important;
}
.ptb-frame .ui-wrap{
 transform:none !important;
}
/* 최신 원본의 1px 편지지 외곽선/안쪽선 강제 보존 */
.ptb-frame .mission-card{width:100% !important;box-sizing:border-box!important;border-width:1px!important;}
.ptb-frame .mission-card::before{border-width:1px!important;}

/* ===== 편지 알림창 공통 규격: 전 페이지 동일 / 본문 11줄 기준 ===== */
.ptb-frame .letter-modal{position:absolute!important;inset:0!important;padding:0!important;}
.ptb-frame .letter-paper{
  width:88% !important;
  height:76% !important;
  min-height:0 !important;
  padding:23% 9% 16% !important;
  box-sizing:border-box !important;
}
.ptb-frame .letter-paper::before{inset:3% !important;}
.ptb-frame .letter-content{
  font-size:6.0cqw !important;
  line-height:1.36 !important;
  letter-spacing:.01em !important;
  white-space:pre-line !important;
  word-break:keep-all !important;
  overflow:visible !important;
}
.ptb-frame .letter-top{top:6% !important;font-size:5.6cqw !important;}
.ptb-frame .letter-bottom{bottom:4.5% !important;font-size:4cqw !important;}
.ptb-frame .letter-close{
  right:7% !important;bottom:6.5% !important;
  height:10cqw !important;min-width:18cqw !important;
  padding:0 4cqw !important;font-size:3.7cqw !important;
}

/* 편지 알림창 폰트 전체 1단계 축소 */
.ptb-frame .letter-content{font-size:5.0cqw !important;}
.ptb-frame .letter-top{font-size:4.6cqw !important;}
.ptb-frame .letter-bottom{font-size:3.0cqw !important;}
.ptb-frame .letter-close{font-size:2.7cqw !important;}

/* ===== 미션 제목: 한 줄 고정 ===== */
.ptb-frame .mission-title{
  white-space:nowrap !important;
  word-break:keep-all !important;
  overflow:visible !important;
  font-size:4.35cqw !important;
  letter-spacing:-0.025em !important;
}

/* ===== 힌트/정답보기: 편지 알림창과 같은 디자인, 2줄 기준 ===== */
.ptb-frame .modal{
  position:absolute !important;
  inset:0 !important;
  display:none;
  justify-content:center !important;
  align-items:center !important;
  padding:0 !important;
  background:rgba(0,0,0,.55) !important;
}
.ptb-frame .modal.show{display:flex !important;}
.ptb-frame .modal-box{
  position:relative !important;
  width:88% !important;
  height:35% !important;
  min-height:0 !important;
  padding:17% 9% 12% !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  background:

<body>

    세로 모드를 유지해 주세요.
  </div>
</div>
<div class="ptb-frame">


<!-- =====================================================
     미션카드
===================================================== -->

<div
  class="mission-wrap"
  id="missionWrap"
>

  <div class="mission-card">


    <div class="mission-title">
      기억 #2: 여름을 한 입 베어 물었더니
    </div>

      B 1, B 2 키트 사용
    </div>

      여름에 하지오와 유찬이는...
    </div>


    <div class="mission-guide">
      정답은 알파벳 4자
    </div>


  </div>

</div>


<!-- =====================================================
     정답 입력 UI
===================================================== -->

<div
  class="ui-wrap"
  id="uiWrap"
>

  <div class="answer-row">


    <input
      id="answerInput"

      spellcheck="false"
    >

      class="submit-btn"
      type="button"

    </button>

      class="action-btn"
      type="button"
      onclick="showHint()"
    >
      힌트보기
    </button>


    <button
      class="action-btn"
      id="answerBtn"
      type="button"
      onclick="showAnswer()"
      disabled
    >
      정답보기
    </button>


    <button
      class="action-btn"
      type="button"
      onclick="showScore()"
    >
      기억보상
    </button>


  </div>

===================================================== -->

  class="modal"
  id="infoModal"
>

      class="modal-title"
      id="modalTitle"
    >
      안내
    </div>

      class="modal-content"
      id="modalContent"
    ></div>


    <button
      class="modal-close"
      type="button"
      onclick="closeModal()"
    >

    </button>

<script>

/* =========================================================
   문제 설정
========================================================= */

const missionConfig = {

  missionNumber:2,

  correctAnswer:"love",

  hintText:
    "여름의 조각만 맞추세요.",

  answerText:
    "love",

  bgImage:
    "ptbq2.png",

  introLetter:
    `도서관에서 보낸 오늘도
언젠가는 기억에서 사라질 것이다.
그래도 이곳에서 느꼈던 행복만큼은,
마음속 어딘가에 
오래 남아 있기를 바랐다.`,

  correctLetter:
    `하지오는 평범했던 어느 여름을
오래도록 간직하고 싶어 했다.
아무렇지 않게 흘러가는 하루가,
누군가에게는 평생 잊고 싶지 않은
계절이 될 수도 있으니까.`

};


/* =========================================================
   진행상황
========================================================= */

const PROGRESS_KEY =
  "ptb_progress_v1";


let usedHint=false;
let usedAnswer=false;
let locked=false;

let pendingScore=null;

let letterModalMode=
  "intro";


function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(
        PROGRESS_KEY
      )
    ) || {};

  }

  catch(e){

    return {};

  }

}


function setProgress(
  progress
){

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );

}
function saveUsageState(){
  const progress=getProgress(), n=missionConfig.missionNumber, old=progress[n]||{};
  if(old.completed===true) return;
  progress[n]={completed:false,usedHint:usedHint,usedAnswer:usedAnswer};
  setProgress(progress);
}
function loadUsageState(){
  const saved=getProgress()[missionConfig.missionNumber];
  if(!saved) return;
  usedHint=saved.usedHint===true;
  usedAnswer=saved.usedAnswer===true;
  if(usedHint) document.getElementById("answerBtn").disabled=false;
}


/* =========================================================
   정답 비교
========================================================= */

function normalize(
  text
){

  return String(text)

    .replace(
      /\s+/g,
      ""
    )

    .trim()

    .toLowerCase();

}


/* =========================================================
   점수
========================================================= */

function currentScore(){

  if(
    usedAnswer
  ){
    return 0;
  }


  if(
    usedHint
  ){
    return 10;
  }


  return 20;

}


/* =========================================================
   결과 저장
========================================================= */

function saveResult(score){
  const progress=getProgress(), n=missionConfig.missionNumber, old=progress[n]||{};
  if(old.completed===true) return false;
  progress[n]={completed:true,score:score,usedHint:usedHint,usedAnswer:usedAnswer};
  setProgress(progress);
  return true;
}


/* =========================================================
   일반 모달
========================================================= */

function openModal(
  title,
  content
){

  document
    .getElementById(
      "modalTitle"
    )
    .textContent=
      title;


  document
    .getElementById(
      "modalContent"
    )
    .textContent=
      content;


  document
    .getElementById(
      "infoModal"
    )
    .classList
    .add(
      "show"
    );

}


function closeModal(){

  document
    .getElementById(
      "infoModal"
    )
    .classList
    .remove(
      "show"
    );

}


/* =========================================================
   HTML 편지
========================================================= */
function openLetterModal(content,mode){
  letterModalMode=mode;
  document.getElementById("letterContent").textContent=content;
  document.getElementById("letterModal").classList.add("show");
}
function closeLetterModal(){
  document.getElementById("letterModal").classList.remove("show");
  if(letterModalMode==="intro"){
    requestAnimationFrame(showMission);
    return;
  }
  if(letterModalMode==="correct" && pendingScore!==null){
    const score=pendingScore; pendingScore=null;
    if(score===0){location.href="ptbm.html";return;}
    playVideoAndReturn(score);
  }
}

/* =========================================================
   미션 표시
========================================================= */

function showMission(){

  document
    .getElementById(
      "missionWrap"
    )
    .classList
    .add(
      "show"
    );


  document
    .getElementById(
      "uiWrap"
    )
    .classList
    .add(
      "show"
    );


  /*
    자동 focus 없음.
    휴대폰 키보드는 사용자가
    입력창을 직접 눌렀을 때만 열림.
  */

}


/* =========================================================
   미션 숨김
========================================================= */

function hideMission(){

  document
    .getElementById(
      "missionWrap"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "uiWrap"
    )
    .classList
    .remove(
      "show"
    );

}


/* =========================================================
   힌트
========================================================= */

function showHint(){

  if(
    locked
  ){
    return;
  }


  usedHint=
    true;

  saveUsageState();


  document
    .getElementById(
      "answerBtn"
    )
    .disabled=
      false;


  openModal(
    "힌트",
    missionConfig.hintText
  );

}


/* =========================================================
   정답보기
========================================================= */

function showAnswer(){

  if(
    locked
  ){
    return;
  }


  if(
    !usedHint
  ){
    return;
  }


  usedAnswer=
    true;

  saveUsageState();


  openModal(
    "정답",
    missionConfig.answerText
  );

}


/* =========================================================
   총 기억보상
========================================================= */

function getTotalScore(){

  const progress=
    getProgress();


  let total=
    0;


  for(
    let i=1;
    i<=5;
    i++
  ){

    if(
      progress[i]
      &&
      progress[i].completed
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }


  return total;

}


function showScore(){

  openModal(

    "기억보상",

    `현재까지 모은 기억보상은 ${getTotalScore()}입니다.`

  );

}


/* =========================================================
   정답 확인
========================================================= */

function checkAnswer(){

  if(
    locked
  ){
    return;
  }


  const input=
    document
      .getElementById(
        "answerInput"
      )
      .value;


  if(
    !input.trim()
  ){

    openModal(
      "안내",
      "정답을 입력해주세요."
    );


    return;

  }


  /* =====================================================
     정답
  ===================================================== */

  if(
    normalize(input)
    ===
    normalize(
      missionConfig.correctAnswer
    )
  ){

    locked=
      true;


    const existingResult=getProgress()[missionConfig.missionNumber];
    if(existingResult && existingResult.completed===true){
      location.href="ptbm.html";
      return;
    }
    pendingScore=currentScore();
    saveResult(pendingScore);


    closeModal();


    /* 카드와 UI 제거 */

    hideMission();


    /* 2초 뒤 성공 편지 */

    setTimeout(
      function(){

        openLetterModal(missionConfig.correctLetter,"correct");

      },

      2000
    );


    return;

  }


  /* =====================================================
     오답
  ===================================================== */

  const ui=
    document.getElementById(
      "uiWrap"
    );


  ui
    .classList
    .remove(
      "shake"
    );


  void ui.offsetWidth;


  ui
    .classList
    .add(
      "shake"
    );


  openModal(
    "오답",
    "정답이 아닙니다."
  );

}


/* =========================================================
   영상 파일
========================================================= */

function getVideoSrc(score){

  if(score === 20){
    return "ptbq1.mp4";
  }

  if(score === 10){
    return "ptbq2.mp4";
  }

  return "";
}


/* =========================================================
   영상 재생 후 ptbm
========================================================= */

function playVideoAndReturn(
  score
){

  const videoModal=
    document.getElementById(
      "videoModal"
    );


  const video=
    document.getElementById(
      "resultVideo"
    );


  const fallback=
    document.getElementById(
      "videoFallback"
    );


  videoModal
    .classList
    .add(
      "show"
    );


  fallback
    .classList
    .remove(
      "show"
    );


  fallback.textContent=
    "";


  video.style.display=
    "block";


  video.src=
    getVideoSrc(
      score
    );


  video.load();


  const goBack=
    function(){

      location.href=
        "ptbm.html";

    };


  video.onended=
    goBack;


  video.onerror=
    function(){

      video.style.display=
        "none";


      fallback.textContent=
        `${score}점 획득!
영상 파일을 확인해주세요.`;


      fallback
        .classList
        .add(
          "show"
        );


      setTimeout(
        goBack,
        1800
      );

    };


  const playPromise=
    video.play();


  if(
    playPromise !==
    undefined
  ){

    playPromise.catch(
      function(){

        video.style.display=
          "none";


        fallback.textContent=
          `${score}점 획득!
영상을 재생할 수 없습니다.`;


        fallback
          .classList
          .add(
            "show"
          );


        setTimeout(
          goBack,
          1800
        );

      }
    );

  }

}


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    "answerInput"
  )
  .addEventListener(
    "keydown",

    function(e){

      if(
        e.key ===
        "Enter"
      ){

        checkAnswer();

      }

    }
  );


/* =========================================================
   최초 실행

   1초 후 첫 편지
========================================================= */

document.body.style.backgroundImage=
  `url("${missionConfig.bgImage}")`;


loadUsageState();
setTimeout(function(){
  openLetterModal(missionConfig.introLetter,"intro");
},1000);

</script>
