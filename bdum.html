<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RABBIT HOLE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

/* =========================================================
   기본
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;
}


/* =========================================================
   공통 변수
========================================================= */

:root{

  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;

  --intro-width:min(88vw,600px);

  --arrow-w:82px;
  --arrow-h:68px;

  --talk-gap:14px;
}


/* =========================================================
   전체 배경
========================================================= */

body{
  position:relative;

  width:100%;
  height:100%;
  min-height:100dvh;

  overflow:hidden;

  background:#1788EB;
}


/* =========================================================
   나무 프레임

   새 bdum.png
   1024 × 1455 기준
========================================================= */

.scene{
  position:fixed;

  left:50%;
  top:50%;

  width:
    max(
      100vw,
      calc(100dvh * 1024 / 1455)
    );

  height:
    max(
      100dvh,
      calc(100vw * 1455 / 1024)
    );

  transform:
    translate(-50%,-50%);

  overflow:hidden;

  z-index:1;
}


/* =========================================================
   나무 배경
========================================================= */

.tree-bg{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:fill;

  pointer-events:none;
  user-select:none;

  z-index:1;
}


/* =========================================================
   책 버튼
========================================================= */

.book-btn{
  position:absolute;

  width:12.8%;

  border:none;
  margin:0;
  padding:0;

  background:transparent;

  cursor:pointer;

  z-index:10;

  transform:
    translate(-50%,-50%);

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .45s ease,
    transform .18s ease;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;
}


.book-btn.open{
  opacity:1;
  visibility:visible;

  pointer-events:auto;
}


.book-btn img{
  width:100%;
  height:auto;

  display:block;

  object-fit:contain;

  filter:
    drop-shadow(
      0 8px 8px
      rgba(0,0,0,.38)
    )
    drop-shadow(
      3px 4px 3px
      rgba(0,0,0,.20)
    );
}


.book-btn:hover:not(:disabled){
  transform:
    translate(-50%,-50%)
    translateY(-4px)
    scale(1.05);
}


.book-btn:active:not(:disabled){
  transform:
    translate(-50%,-50%)
    translateY(2px)
    scale(.96);
}


/* =========================================================
   완료한 책은 완전히 사라짐
========================================================= */

.book-btn:disabled{
  display:none;
}


/* =========================================================
   책 위치
========================================================= */

.book1{
  left:55%;
  top:20%;
}

.book2{
  left:27%;
  top:32%;
}

.book3{
  left:55%;
  top:38%;
}

.book4{
  left:27%;
  top:54%;
}

.book5{
  left:76%;
  top:51%;
}


/* =========================================================
   대화 전체 영역
========================================================= */

.intro-stage{
  position:fixed;

  left:50%;
  top:51%;

  transform:
    translateX(-50%);

  width:
    var(--intro-width);

  z-index:100;

  display:none;
}


.intro-stage.show{
  display:block;

  animation:
    fadeSimple .35s ease;
}


/* =========================================================
   화살표
========================================================= */

.arrow-btn{
  position:absolute;

  top:0;

  width:
    var(--arrow-w);

  height:
    var(--arrow-h);

  border:none;

  background:transparent;

  padding:0;

  cursor:pointer;

  z-index:20;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

  transition:
    transform .15s ease;
}


#prevTalkBtn{
  left:0;
}


#nextTalkBtn{
  right:0;
}


.arrow-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}


.arrow-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}


.arrow-btn svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(
      0 7px 8px
      rgba(0,0,0,.40)
    )
    drop-shadow(
      0 2px 2px
      rgba(0,0,0,.30)
    );
}


.arrow-shape{
  fill:
    var(--green);

  stroke:
    var(--green-dark);

  stroke-width:3;
}


.arrow-highlight{
  fill:
    rgba(255,255,255,.25);
}


.arrow-btn.hidden{
  visibility:hidden;

  pointer-events:none;
}


/* =========================================================
   말박스
========================================================= */

.talk-box{
  position:absolute;

  left:0;

  top:
    calc(
      var(--arrow-h)
      +
      var(--talk-gap)
    );

  width:100%;

  padding:
    22px 25px;

  border:
    3px solid
    var(--paper-border);

  background:
    var(--paper);

  color:
    var(--paper-text);

  font-size:23px;

  font-weight:700;

  line-height:1.55;

  word-break:keep-all;

  white-space:pre-line;

  box-shadow:
    0 7px 14px
    rgba(0,0,0,.22);
}


/* =========================================================
   모험시작 / 마지막 다음 버튼
========================================================= */

.adventure-btn{
  position:absolute;

  left:50%;

  transform:
    translateX(-50%);

  display:none;

  height:58px;

  min-width:145px;

  padding:
    0 28px;

  border:
    3px solid
    var(--green-dark);

  border-radius:15px;

  background:
    var(--green);

  color:#fffdf1;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;

  cursor:pointer;

  box-shadow:
    0 5px 8px
    rgba(0,0,0,.30),

    inset 0 2px 2px
    rgba(255,255,255,.25);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.25);

  z-index:30;

  -webkit-tap-highlight-color:
    transparent;
}


.adventure-btn.show{
  display:block;
}


.adventure-btn:hover{
  transform:
    translateX(-50%)
    translateY(-2px)
    scale(1.03);
}


.adventure-btn:active{
  transform:
    translateX(-50%)
    translateY(2px)
    scale(.96);
}


/* =========================================================
   테스트 초기화
========================================================= */

.dev-reset{
  position:fixed;

  right:10px;

  bottom:
    calc(
      10px
      +
      env(safe-area-inset-bottom)
    );

  z-index:1000;

  border:none;

  border-radius:999px;

  padding:
    8px 12px;

  background:
    rgba(42,60,45,.84);

  color:white;

  font-size:12px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.28);

  -webkit-tap-highlight-color:
    transparent;
}


/* =========================================================
   애니메이션
========================================================= */

@keyframes fadeSimple{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


@keyframes bookOpen{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.72);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px){

  :root{

    --intro-width:
      min(92vw,360px);

    --arrow-w:58px;

    --arrow-h:48px;

    --talk-gap:10px;
  }


  .intro-stage{
    top:48%;
  }


  .talk-box{
    padding:
      15px 17px;

    border-width:2px;

    font-size:16px;

    line-height:1.5;

    box-shadow:
      0 5px 10px
      rgba(0,0,0,.22);
  }


  .adventure-btn{
    height:46px;

    min-width:110px;

    padding:
      0 18px;

    border-width:3px;

    border-radius:13px;

    font-size:15px;
  }

}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{

    --intro-width:92vw;

    --arrow-w:54px;

    --arrow-h:45px;

    --talk-gap:9px;
  }


  .intro-stage{
    top:47%;
  }


  .talk-box{
    padding:
      13px 15px;

    font-size:15px;

    line-height:1.45;
  }


  .adventure-btn{
    height:44px;

    min-width:105px;

    padding:
      0 15px;

    font-size:14px;
  }


  .dev-reset{
    padding:
      7px 9px;

    font-size:11px;
  }

}


/* =========================================================
   높이가 낮은 화면
========================================================= */

@media(max-height:700px){

  .intro-stage{
    top:43%;
  }


  .talk-box{
    padding:
      11px 14px;

    font-size:14px;

    line-height:1.4;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     나무 + 책열매
===================================================== -->

<div class="scene">

  <img
    src="bdum.jpg"
    class="tree-bg"
    alt=""
  >


  <button
    id="book1"
    class="book-btn book1"
    type="button"
    onclick="goMission(1)"
    aria-label="1번 문제"
  >

    <img
      src="bdum1.png"
      alt="1번 책"
    >

  </button>


  <button
    id="book2"
    class="book-btn book2"
    type="button"
    onclick="goMission(2)"
    aria-label="2번 문제"
  >

    <img
      src="bdum2.png"
      alt="2번 책"
    >

  </button>


  <button
    id="book3"
    class="book-btn book3"
    type="button"
    onclick="goMission(3)"
    aria-label="3번 문제"
  >

    <img
      src="bdum3.png"
      alt="3번 책"
    >

  </button>


  <button
    id="book4"
    class="book-btn book4"
    type="button"
    onclick="goMission(4)"
    aria-label="4번 문제"
  >

    <img
      src="bdum4.png"
      alt="4번 책"
    >

  </button>


  <button
    id="book5"
    class="book-btn book5"
    type="button"
    onclick="goMission(5)"
    aria-label="5번 문제"
  >

    <img
      src="bdum5.png"
      alt="5번 책"
    >

  </button>

</div>


<!-- =====================================================
     대화 / 화살표
===================================================== -->

<div
  class="intro-stage"
  id="introStage"
>


  <!-- 이전 -->

  <button
    id="prevTalkBtn"
    class="arrow-btn hidden"
    type="button"
    onclick="prevTalk()"
    aria-label="이전"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="
        M84 10
        Q92 15 92 26
        L92 70
        Q92 81 84 86
        Q76 91 67 84
        L22 54
        Q13 48 22 42
        L67 12
        Q76 5 84 10 Z
        "
      />

      <path
        class="arrow-highlight"
        d="
        M78 18
        Q84 21 84 28
        L84 36
        L39 48
        L78 22 Z
        "
      />

    </svg>

  </button>


  <!-- 다음 -->

  <button
    id="nextTalkBtn"
    class="arrow-btn"
    type="button"
    onclick="nextTalk()"
    aria-label="다음"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="
        M36 10
        Q28 15 28 26
        L28 70
        Q28 81 36 86
        Q44 91 53 84
        L98 54
        Q107 48 98 42
        L53 12
        Q44 5 36 10 Z
        "
      />

      <path
        class="arrow-highlight"
        d="
        M42 18
        Q36 21 36 28
        L36 36
        L81 48
        L42 22 Z
        "
      />

    </svg>

  </button>


  <!-- 말박스 -->

  <div
    class="talk-box"
    id="talkBox"
  ></div>


  <!-- 모험시작 / 엔딩 다음 -->

  <button
    id="adventureBtn"
    class="adventure-btn"
    type="button"
    onclick="handleMainButton()"
  >
    모험시작
  </button>

</div>


<!-- =====================================================
     테스트 초기화
===================================================== -->

<button
  class="dev-reset"
  type="button"
  onclick="devReset()"
>
  테스트 초기화
</button>


<script>

/* =========================================================
   저장 키
========================================================= */

const PROGRESS_KEY =
  "bdu_progress_v1";


/*
  ★ sessionStorage가 아니라 localStorage 사용

  모험시작을 한 번 누르면
  문제 페이지를 갔다 돌아와도
  절대로 첫 환영인사가 다시 나오지 않음.
*/

const INTRO_DONE_KEY =
  "bdum_intro_done_v2";


let currentTalk =
  0;


let storyMode =
  "intro";


let storyTimer =
  null;


/* =========================================================
   처음 안내 4개
========================================================= */

const introTalks = [

  `“래빗홀 속 세계에 온 걸 환영해!”`,

  `“여기가 네가 처음 모험을 시작할 '책열매나무'야.
이 나무에는 평범한 열매 대신, 신비한 이야기가
담긴 책열매가 열리지.”`,

  `“책열매를 선택하면 새로운 장소로 이어질 거야.
그곳의 문제를 해결하면 다시 이곳으로 돌아올 수
있어.”`,

  `“자, 친구를 찾고 싶다면 책열매 하나를 골라봐!
래빗홀의 모험은 여기서부터 시작이야.”`

];


/* =========================================================
   마지막 11개 대화
========================================================= */

function getEndingTalks(){

  const carrotCount =
    getTotalCarrots();


  return [

    `“정말 대단해! 그 많은 문제를 전부 해결하다니!
래빗홀 속 세계에서의 모험은 재미있었어?”`,

    `“어떤 곳에서는 한참 고민하기도 했을 거고,
어떤 곳에서는 헤매기도 했겠지.
그래도 그냥 지나치지 않고
하나씩 살펴보고, 생각하고, 결국 답을 찾아냈잖아.”`,

    `“처음에는 책열매에 무슨 이야기가 기다리고 있는지
알 수 없지만, 한 장 한 장 따라가다 보면
처음에는 보이지 않던 것들이 보이기 시작하거든.”`,

    `“그러다 보면 어느새 처음과는 조금 다른 생각을
하고 있는 자신을 발견하기도 하고.”`,

    `“그러니까 오늘 네가 찾아낸 건
문제의 정답만은 아닐지도 몰라.
아무튼, 여기까지 온 건 정말 대단해!”`,

    `“아! 그리고 네가 모험하면서 모은 것도 있지?
어디 보자. 당근을 몇 개나 모았나 볼까?”`,

    `“하나, 둘, 셋……
모두 ${carrotCount}개.
이건 네가 래빗홀을 여행했다는 증거야”`,

    `한참 토끼의 말을 듣던 우리는 물었어.
“그런데…… 내 친구는?”`,

    `“아, 맞다!
친구를 데려오기로 했었지?
내가 가서 데려올게.”`,

    `“너 그동안 너무 많이 돌아다녔잖아.
여기서 잠깐 쉬고 있도록 해.
내가 아래에서 그 애를 데려오면
금방 친구를 데리고 돌아올게.”`,

    `우리는 책열매나무에 등을 기대고 앉았어.
긴장이 풀려서인지 갑자기 눈꺼풀이 무거워졌어.
그리고 얼마 지나지 않아, 깊은 잠에 빠져들었어.`

  ];

}


/* =========================================================
   요소
========================================================= */

const introStage =
  document.getElementById(
    "introStage"
  );


const talkBox =
  document.getElementById(
    "talkBox"
  );


const prevTalkBtn =
  document.getElementById(
    "prevTalkBtn"
  );


const nextTalkBtn =
  document.getElementById(
    "nextTalkBtn"
  );


const adventureBtn =
  document.getElementById(
    "adventureBtn"
  );


/* =========================================================
   진행 데이터 읽기
========================================================= */

function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(
        PROGRESS_KEY
      )
    ) || {};

  }

  catch(e){

    return {};

  }

}


/* =========================================================
   완료된 문제 개수
========================================================= */

function getCompletedCount(){

  const progress =
    getProgress();


  let count =
    0;


  for(
    let i=1;
    i<=5;
    i++
  ){

    if(
      progress[i]
      &&
      progress[i].completed === true
    ){

      count++;

    }

  }


  return count;

}


/* =========================================================
   당근 총합

   문제 페이지 저장값
   score 2 / 1 / 0 합산
========================================================= */

function getTotalCarrots(){

  const progress =
    getProgress();


  let total =
    0;


  for(
    let i=1;
    i<=5;
    i++
  ){

    if(
      progress[i]
      &&
      progress[i].completed === true
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }


  return total;

}


/* =========================================================
   책 상태
========================================================= */

function applyBookState(){

  const progress =
    getProgress();


  for(
    let i=1;
    i<=5;
    i++
  ){

    const button =
      document.getElementById(
        "book" + i
      );


    button.disabled =
      !!(
        progress[i]
        &&
        progress[i].completed === true
      );

  }

}


/* =========================================================
   책 전부 숨김
========================================================= */

function hideBooks(){

  for(
    let i=1;
    i<=5;
    i++
  ){

    const button =
      document.getElementById(
        "book" + i
      );


    button
      .classList
      .remove(
        "open"
      );

  }

}


/* =========================================================
   남은 책만 표시
========================================================= */

function showBooks(){

  for(
    let i=1;
    i<=5;
    i++
  ){

    const button =
      document.getElementById(
        "book" + i
      );


    if(
      !button.disabled
    ){

      button
        .classList
        .add(
          "open"
        );


      button.style.animation =
        `bookOpen .45s ease ${((i-1) * .08)}s both`;

    }

  }

}


/* =========================================================
   현재 사용할 대화 배열
========================================================= */

function getCurrentTalks(){

  if(
    storyMode ===
    "ending"
  ){

    return getEndingTalks();

  }


  return introTalks;

}


/* =========================================================
   처음 환영 안내
========================================================= */

function showIntro(){

  storyMode =
    "intro";


  currentTalk =
    0;


  hideBooks();


  introStage
    .classList
    .add(
      "show"
    );


  updateTalk();

}


/* =========================================================
   ★ 5문제 완료 후 마지막 대화
========================================================= */

function showEndingStory(){

  storyMode =
    "ending";


  currentTalk =
    0;


  hideBooks();


  adventureBtn
    .classList
    .remove(
      "show"
    );


  introStage
    .classList
    .add(
      "show"
    );


  updateTalk();

}


/* =========================================================
   모험시작 / 다음 버튼 위치
========================================================= */

function updateAdventurePosition(){

  requestAnimationFrame(
    function(){

      const styles =
        getComputedStyle(
          talkBox
        );


      const talkTop =
        parseFloat(
          styles.top
        );


      const talkHeight =
        talkBox.offsetHeight;


      adventureBtn.style.top =
        (
          talkTop
          +
          talkHeight
          +
          12
        )
        +
        "px";

    }
  );

}


/* =========================================================
   대사 화면 갱신
========================================================= */

function updateTalk(){

  const talks =
    getCurrentTalks();


  talkBox.textContent =
    talks[
      currentTalk
    ];


  /* 첫 번째 말박스 */

  if(
    currentTalk === 0
  ){

    prevTalkBtn
      .classList
      .add(
        "hidden"
      );

  }

  else{

    prevTalkBtn
      .classList
      .remove(
        "hidden"
      );

  }


  const isLast =
    currentTalk ===
    talks.length - 1;


  /* 마지막 말박스 */

  if(
    isLast
  ){

    nextTalkBtn.style.visibility =
      "hidden";


    nextTalkBtn.style.pointerEvents =
      "none";


    /*
      처음 대화 마지막:
      모험시작

      엔딩 대화 마지막:
      다음
    */

    if(
      storyMode ===
      "ending"
    ){

      adventureBtn.textContent =
        "다음";

    }

    else{

      adventureBtn.textContent =
        "모험시작";

    }


    adventureBtn
      .classList
      .add(
        "show"
      );


    updateAdventurePosition();

  }

  else{

    nextTalkBtn.style.visibility =
      "visible";


    nextTalkBtn.style.pointerEvents =
      "auto";


    adventureBtn
      .classList
      .remove(
        "show"
      );

  }

}


/* =========================================================
   오른쪽 화살표
========================================================= */

function nextTalk(){

  const talks =
    getCurrentTalks();


  if(
    currentTalk <
    talks.length - 1
  ){

    currentTalk++;


    updateTalk();

  }

}


/* =========================================================
   왼쪽 화살표
========================================================= */

function prevTalk(){

  if(
    currentTalk > 0
  ){

    currentTalk--;


    updateTalk();

  }

}


/* =========================================================
   모험시작 / 다음 공통 버튼
========================================================= */

function handleMainButton(){

  /*
    엔딩 대화 마지막
    → bduend
  */

  if(
    storyMode ===
    "ending"
  ){

    location.href =
      "https://baekko.github.io/cnedu/bduend.html";


    return;

  }


  /*
    처음 모험시작
  */

  startAdventure();

}


/* =========================================================
   처음 모험 시작
========================================================= */

function startAdventure(){

  /*
    ★ localStorage에 저장

    문제 페이지를 갔다 돌아와도
    절대 환영인사를 다시 띄우지 않음.
  */

  localStorage.setItem(
    INTRO_DONE_KEY,
    "true"
  );


  introStage
    .classList
    .remove(
      "show"
    );


  adventureBtn
    .classList
    .remove(
      "show"
    );


  showBooks();

}


/* =========================================================
   문제 페이지 이동
========================================================= */

function goMission(
  number
){

  const button =
    document.getElementById(
      "book" + number
    );


  if(
    button.disabled
  ){

    return;

  }


  location.href =
    `https://baekko.github.io/cnedu/bduq${number}.html`;

}


/* =========================================================
   테스트 초기화
========================================================= */

function devReset(){

  /*
    문제 진행상황
  */

  localStorage.removeItem(
    PROGRESS_KEY
  );


  /*
    처음 환영인사 기록
  */

  localStorage.removeItem(
    INTRO_DONE_KEY
  );


  /*
    혹시 과거 버전에서 남아 있는
    저장키도 같이 삭제
  */

  sessionStorage.removeItem(
    "bdum_intro_done"
  );


  sessionStorage.removeItem(
    "bdum_end_video_started"
  );


  clearTimeout(
    storyTimer
  );


  location.reload();

}


/* =========================================================
   ★ 페이지 상태 결정

   이 함수 하나에서만 판단한다.

   완료 0:
   - 첫 방문 → 환영 인사
   - 이미 모험시작 누름 → 책 표시

   완료 1~4:
   - 환영 인사 없음
   - 남은 책 표시

   완료 5:
   - 영상 없음
   - 마지막 11개 대화
========================================================= */

function initializePage(){

  clearTimeout(
    storyTimer
  );


  /*
    책 완료상태 다시 읽기
  */

  applyBookState();


  /*
    기존 화면 초기화
  */

  hideBooks();


  introStage
    .classList
    .remove(
      "show"
    );


  adventureBtn
    .classList
    .remove(
      "show"
    );


  const completedCount =
    getCompletedCount();


  /* =====================================================
     ★ 5개 전부 완료

     마지막 문제에서 돌아온 직후
     1초 뒤 엔딩 말박스 표시
  ===================================================== */

  if(
    completedCount === 5
  ){

    /*
      첫 환영인사는 이미 끝난 상태로 강제
    */

    localStorage.setItem(
      INTRO_DONE_KEY,
      "true"
    );


    storyTimer =
      setTimeout(
        function(){

          showEndingStory();

        },

        1000
      );


    return;

  }


  /* =====================================================
     ★ 1~4개 완료

     어떤 경우에도 환영인사 다시 안 나옴
  ===================================================== */

  if(
    completedCount >= 1
  ){

    localStorage.setItem(
      INTRO_DONE_KEY,
      "true"
    );


    showBooks();


    return;

  }


  /* =====================================================
     완료 0개

     정말 첫 방문일 때만 환영인사
  ===================================================== */

  if(
    localStorage.getItem(
      INTRO_DONE_KEY
    )
    !==
    "true"
  ){

    storyTimer =
      setTimeout(
        function(){

          showIntro();

        },

        1000
      );


    return;

  }


  /* =====================================================
     모험시작은 눌렀지만
     아직 첫 문제를 풀지 않은 경우
  ===================================================== */

  showBooks();

}


/* =========================================================
   페이지가 실제로 표시될 때마다 실행

   bduq → bdum 이동도 여기서 판정
========================================================= */

window.addEventListener(
  "pageshow",
  function(){

    initializePage();

  }
);


/* =========================================================
   화면 크기 변경
========================================================= */

window.addEventListener(
  "resize",
  function(){

    if(
      adventureBtn
        .classList
        .contains(
          "show"
        )
    ){

      updateAdventurePosition();

    }

  }
);

</script>

</body>
</html>
