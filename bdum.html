<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RABBIT HOLE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

/* =========================================================
   기본
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;
}


/* =========================================================
   공통 변수
========================================================= */

:root{

  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;


  /* 스토리 너비 */
  --intro-width:min(88vw,600px);


  /* 화살표 크기 */
  --arrow-w:82px;
  --arrow-h:68px;


  /*
    ★ 화살표와 말박스 사이 간격
  */
  --talk-gap:14px;

}


/* =========================================================
   전체 배경

   ★ 이미지 위/아래와 조금 더 가까운 색
========================================================= */

body{
  position:relative;
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  background:#1788EB;
}


/* =========================================================
   나무 프레임

   새 bdum.png는 주변 하늘/땅을 넓힌 이미지 사용.
   화면 비율에 따라 주변부가 더 보이거나 덜 보이게 하고
   나무와 책 버튼은 같은 좌표계 안에서 함께 움직임.
========================================================= */

.scene{
  position:fixed;
  left:50%;
  top:50%;

  /*
    새 이미지 비율 1024 × 1455 기준.
    화면 전체를 빈틈없이 덮되 이미지 비율은 유지.
  */
  width:max(100vw, calc(100dvh * 1024 / 1455));
  height:max(100dvh, calc(100vw * 1455 / 1024));

  transform:translate(-50%,-50%);
  overflow:hidden;
  z-index:1;
}


/* =========================================================
   나무 배경
========================================================= */

.tree-bg{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;
  object-fit:fill;

  pointer-events:none;
  user-select:none;

  z-index:1;
}


/* =========================================================
   책 버튼

   ★ 처음에는 숨김
========================================================= */

.book-btn{
  position:absolute;

  width:12.8%;

  border:none;
  margin:0;
  padding:0;

  background:transparent;

  cursor:pointer;

  z-index:10;

  transform:
    translate(-50%,-50%);

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .45s ease,
    transform .18s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.book-btn.open{
  opacity:1;
  visibility:visible;

  pointer-events:auto;
}


.book-btn img{
  width:100%;
  height:auto;

  display:block;

  object-fit:contain;

  filter:
    drop-shadow(
      0 8px 8px
      rgba(0,0,0,.38)
    )
    drop-shadow(
      3px 4px 3px
      rgba(0,0,0,.20)
    );
}


.book-btn:hover:not(:disabled){
  transform:
    translate(-50%,-50%)
    translateY(-4px)
    scale(1.05);
}


.book-btn:active:not(:disabled){
  transform:
    translate(-50%,-50%)
    translateY(2px)
    scale(.96);
}


/* 완료한 책은 사라짐 */

.book-btn:disabled{
  display:none;
}


/* =========================================================
   책 위치
========================================================= */

.book1{
  left:55%;
  top:20%;
}

.book2{
  left:27%;
  top:32%;
}

.book3{
  left:55%;
  top:38%;
}

.book4{
  left:27%;
  top:54%;
}

.book5{
  left:76%;
  top:51%;
}


/* =========================================================
   처음 안내 스토리

   ★ 전체 묶음을 위로 올림

   이 숫자를 높이면 아래로,
   낮추면 위로 이동함.
========================================================= */

.intro-stage{
  position:fixed;

  left:50%;

  /*
    이전 62~64%보다 위로 올림
  */
  top:51%;

  transform:
    translateX(-50%);

  width:var(--intro-width);

  z-index:100;

  display:none;
}


.intro-stage.show{
  display:block;

  animation:
    fadeSimple .35s ease;
}


/* =========================================================
   화살표

   ★ 완전히 고정

   말박스가 몇 줄이어도
   화살표 위치는 절대 변하지 않음
========================================================= */

.arrow-btn{
  position:absolute;

  top:0;

  width:var(--arrow-w);
  height:var(--arrow-h);

  border:none;

  background:transparent;

  padding:0;

  cursor:pointer;

  z-index:20;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

  transition:
    transform .15s ease;
}


/* 왼쪽 */

#prevTalkBtn{
  left:0;
}


/* 오른쪽 */

#nextTalkBtn{
  right:0;
}


.arrow-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}


.arrow-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}


.arrow-btn svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(
      0 7px 8px
      rgba(0,0,0,.40)
    )
    drop-shadow(
      0 2px 2px
      rgba(0,0,0,.30)
    );
}


.arrow-shape{
  fill:var(--green);

  stroke:var(--green-dark);

  stroke-width:3;
}


.arrow-highlight{
  fill:
    rgba(255,255,255,.25);
}


.arrow-btn.hidden{
  visibility:hidden;

  pointer-events:none;
}


/* =========================================================
   말박스

   ★ 핵심 수정

   화살표 높이 전체가 끝난 뒤
   14px 아래에서 말박스 시작

   따라서 절대 겹치지 않음.
========================================================= */

.talk-box{
  position:absolute;

  left:0;

  top:
    calc(
      var(--arrow-h)
      +
      var(--talk-gap)
    );

  width:100%;

  padding:
    22px 25px;

  border:
    3px solid
    var(--paper-border);

  background:
    var(--paper);

  color:
    var(--paper-text);

  font-size:23px;

  font-weight:700;

  line-height:1.55;

  word-break:keep-all;

  white-space:pre-line;

  box-shadow:
    0 7px 14px
    rgba(0,0,0,.22);
}


/* =========================================================
   모험시작 버튼

   ★ 실제 말박스 높이를 JS에서 계산해서
      말박스 아래 중앙에 배치
========================================================= */

.adventure-btn{
  position:absolute;

  left:50%;

  transform:
    translateX(-50%);

  display:none;

  height:58px;

  min-width:145px;

  padding:
    0 28px;

  border:
    3px solid
    var(--green-dark);

  border-radius:15px;

  background:
    var(--green);

  color:#fffdf1;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;

  cursor:pointer;

  box-shadow:
    0 5px 8px
    rgba(0,0,0,.30),
    inset 0 2px 2px
    rgba(255,255,255,.25);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.25);

  z-index:30;

  -webkit-tap-highlight-color:
    transparent;
}


.adventure-btn.show{
  display:block;
}


.adventure-btn:hover{
  transform:
    translateX(-50%)
    translateY(-2px)
    scale(1.03);
}


.adventure-btn:active{
  transform:
    translateX(-50%)
    translateY(2px)
    scale(.96);
}


/* =========================================================
   엔딩 영상
========================================================= */

.video-modal{
  position:fixed;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.60);

  z-index:500;
}


.video-modal.show{
  display:flex;
}


.video-box{
  width:min(
    70vw,
    650px
  );

  max-height:75vh;

  overflow:hidden;

  border-radius:22px;

  background:transparent;

  animation:
    videoOpen .4s ease;
}


.end-video{
  display:block;

  width:100%;
  height:auto;

  max-height:75vh;

  object-fit:contain;

  border-radius:22px;
}


/* =========================================================
   테스트 초기화
========================================================= */

.dev-reset{
  position:fixed;

  right:10px;

  bottom:
    calc(
      10px
      +
      env(safe-area-inset-bottom)
    );

  z-index:1000;

  border:none;

  border-radius:999px;

  padding:
    8px 12px;

  background:
    rgba(42,60,45,.84);

  color:white;

  font-size:12px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.28);

  -webkit-tap-highlight-color:
    transparent;
}


/* =========================================================
   애니메이션
========================================================= */

@keyframes fadeSimple{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


@keyframes bookOpen{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.72);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


@keyframes videoOpen{

  from{
    opacity:0;

    transform:
      scale(.88);
  }

  to{
    opacity:1;

    transform:
      scale(1);
  }

}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px){

  :root{

    --intro-width:
      min(92vw,360px);

    --arrow-w:58px;

    --arrow-h:48px;

    /*
      휴대폰은 화살표와 말박스 사이
      10px
    */
    --talk-gap:10px;

  }


  /*
    ★ 전체 묶음을 위로 이동

    기존 62% → 48%
  */
  .intro-stage{
    top:48%;
  }


  .talk-box{

    padding:
      15px 17px;

    border-width:2px;

    font-size:16px;

    line-height:1.5;

    box-shadow:
      0 5px 10px
      rgba(0,0,0,.22);
  }


  .adventure-btn{

    height:46px;

    min-width:110px;

    padding:
      0 18px;

    border-width:3px;

    border-radius:13px;

    font-size:15px;
  }


  .video-box{

    width:76vw;

    max-width:340px;

    border-radius:18px;
  }


  .end-video{
    border-radius:18px;
  }

}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{

    --intro-width:92vw;

    --arrow-w:54px;

    --arrow-h:45px;

    --talk-gap:9px;

  }


  /*
    ★ 작은 폰에서도 충분히 위로
  */
  .intro-stage{
    top:47%;
  }


  .talk-box{

    padding:
      13px 15px;

    font-size:15px;

    line-height:1.45;
  }


  .adventure-btn{

    height:44px;

    min-width:105px;

    padding:
      0 15px;

    font-size:14px;
  }


  .dev-reset{

    padding:
      7px 9px;

    font-size:11px;
  }

}


/* =========================================================
   화면 높이가 짧은 휴대폰
========================================================= */

@media(max-height:700px){

  /*
    더 위로
  */
  .intro-stage{
    top:43%;
  }


  .talk-box{

    padding:
      11px 14px;

    font-size:14px;

    line-height:1.4;
  }

}


/* =========================================================
   ★ 래빗홀 공통 색상 잠금
   휴대폰 / 태블릿 / PC에서 색이 달라 보이지 않도록
   색상과 말박스 불투명도를 동일하게 고정
========================================================= */

:root{
  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}

.talk-box,
.mission-card,
.info-box{
  background:var(--paper) !important;
}

.talk-box{
  color:var(--paper-text) !important;
  border-color:var(--paper-border) !important;
}

.round-btn,
.adventure-btn,
.next-page-btn,
.next-btn,
.submit-btn,
.action-btn,
.modal-close{
  background:var(--green) !important;
  color:#fffdf1 !important;
  border-color:var(--green-dark) !important;
}

.arrow-shape{
  fill:var(--green) !important;
  stroke:var(--green-dark) !important;
}

</style>
</head>


<body>


<!-- =====================================================
     나무 + 책열매
===================================================== -->

<div class="scene">

  <img
    src="bdum.jpg"
    class="tree-bg"
    alt=""
  >


  <button
    id="book1"
    class="book-btn book1"
    type="button"
    onclick="goMission(1)"
    aria-label="1번 문제"
  >
    <img
      src="bdum1.png"
      alt="1번 책"
    >
  </button>


  <button
    id="book2"
    class="book-btn book2"
    type="button"
    onclick="goMission(2)"
    aria-label="2번 문제"
  >
    <img
      src="bdum2.png"
      alt="2번 책"
    >
  </button>


  <button
    id="book3"
    class="book-btn book3"
    type="button"
    onclick="goMission(3)"
    aria-label="3번 문제"
  >
    <img
      src="bdum3.png"
      alt="3번 책"
    >
  </button>


  <button
    id="book4"
    class="book-btn book4"
    type="button"
    onclick="goMission(4)"
    aria-label="4번 문제"
  >
    <img
      src="bdum4.png"
      alt="4번 책"
    >
  </button>


  <button
    id="book5"
    class="book-btn book5"
    type="button"
    onclick="goMission(5)"
    aria-label="5번 문제"
  >
    <img
      src="bdum5.png"
      alt="5번 책"
    >
  </button>

</div>


<!-- =====================================================
     처음 안내
===================================================== -->

<div
  class="intro-stage"
  id="introStage"
>


  <!-- 왼쪽 화살표 -->

  <button
    id="prevTalkBtn"
    class="arrow-btn hidden"
    type="button"
    onclick="prevTalk()"
    aria-label="이전"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="M84 10 Q92 15 92 26 L92 70 Q92 81 84 86 Q76 91 67 84 L22 54 Q13 48 22 42 L67 12 Q76 5 84 10 Z"
      />

      <path
        class="arrow-highlight"
        d="M78 18 Q84 21 84 28 L84 36 L39 48 L78 22 Z"
      />

    </svg>

  </button>


  <!-- 오른쪽 화살표 -->

  <button
    id="nextTalkBtn"
    class="arrow-btn"
    type="button"
    onclick="nextTalk()"
    aria-label="다음"
  >

    <svg viewBox="0 0 120 96">

      <path
        class="arrow-shape"
        d="M36 10 Q28 15 28 26 L28 70 Q28 81 36 86 Q44 91 53 84 L98 54 Q107 48 98 42 L53 12 Q44 5 36 10 Z"
      />

      <path
        class="arrow-highlight"
        d="M42 18 Q36 21 36 28 L36 36 L81 48 L42 22 Z"
      />

    </svg>

  </button>


  <!-- 말박스 -->

  <div
    class="talk-box"
    id="talkBox"
  ></div>


  <!-- 모험 시작 -->

  <button
    id="adventureBtn"
    class="adventure-btn"
    type="button"
    onclick="startAdventure()"
  >
    모험시작
  </button>

</div>


<!-- =====================================================
     엔딩 영상
===================================================== -->

<div
  id="videoModal"
  class="video-modal"
>

  <div class="video-box">

    <video
      id="endVideo"
      class="end-video"
      playsinline
      muted
      preload="auto"
    >

      <source
        src="bdum.mp4"
        type="video/mp4"
      >

    </video>

  </div>

</div>


<!-- =====================================================
     테스트 초기화
===================================================== -->

<button
  class="dev-reset"
  type="button"
  onclick="devReset()"
>
  테스트 초기화
</button>


<script>

/* =========================================================
   저장 키
========================================================= */

const PROGRESS_KEY =
  "bdu_progress_v1";

const END_VIDEO_KEY =
  "bdum_end_video_started";

const INTRO_DONE_KEY =
  "bdum_intro_done";


let endTimer =
  null;


/* =========================================================
   처음 안내 대사
========================================================= */

const introTalks = [

  `“래빗홀 속 세계에 온 걸 환영해!”`,

  `“여기가 네가 처음 모험을 시작할 '책열매나무'야.
이 나무에는 평범한 열매 대신, 신비한 이야기가
담긴 책열매가 열리지.”`,

  `“책열매를 선택하면 새로운 장소로 이어질 거야.
그곳의 문제를 해결하면 다시 이곳으로 돌아올 수
있어.”`,

  `“자, 친구를 찾고 싶다면 책열매 하나를 골라봐!
래빗홀의 모험은 여기서부터 시작이야.”`

];


let currentTalk =
  0;


/* =========================================================
   요소
========================================================= */

const introStage =
  document.getElementById(
    "introStage"
  );


const talkBox =
  document.getElementById(
    "talkBox"
  );


const prevTalkBtn =
  document.getElementById(
    "prevTalkBtn"
  );


const nextTalkBtn =
  document.getElementById(
    "nextTalkBtn"
  );


const adventureBtn =
  document.getElementById(
    "adventureBtn"
  );


/* =========================================================
   진행 데이터
========================================================= */

function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(
        PROGRESS_KEY
      )
    ) || {};

  }

  catch(e){

    return {};

  }

}


/* =========================================================
   전체 완료 확인
========================================================= */

function allMissionsDone(
  progress
){

  for(
    let i=1;
    i<=5;
    i++
  ){

    if(
      !progress[i]
      ||
      !progress[i].completed
    ){

      return false;

    }

  }


  return true;

}


/* =========================================================
   책 상태
========================================================= */

function applyBookState(){

  const progress =
    getProgress();


  for(
    let i=1;
    i<=5;
    i++
  ){

    const button =
      document.getElementById(
        "book" + i
      );


    button.disabled =
      !!(
        progress[i]
        &&
        progress[i].completed
      );

  }


  if(
    !allMissionsDone(
      progress
    )
  ){

    sessionStorage.removeItem(
      END_VIDEO_KEY
    );

  }

}


/* =========================================================
   책열매 등장
========================================================= */

function showBooks(){

  for(
    let i=1;
    i<=5;
    i++
  ){

    const button =
      document.getElementById(
        "book" + i
      );


    if(
      !button.disabled
    ){

      button
        .classList
        .add(
          "open"
        );


      button.style.animation =
        `bookOpen .45s ease ${((i-1) * .08)}s both`;

    }

  }

}


/* =========================================================
   처음 스토리
========================================================= */

function showIntro(){

  currentTalk=0;


  introStage
    .classList
    .add(
      "show"
    );


  updateTalk();

}


/* =========================================================
   모험시작 버튼 위치

   ★ 말박스 실제 하단 + 12px
========================================================= */

function updateAdventurePosition(){

  requestAnimationFrame(
    function(){

      const styles =
        getComputedStyle(
          talkBox
        );


      const talkTop =
        parseFloat(
          styles.top
        );


      const talkHeight =
        talkBox.offsetHeight;


      adventureBtn.style.top =
        (
          talkTop
          +
          talkHeight
          +
          12
        )
        +
        "px";

    }
  );

}


/* =========================================================
   대사 갱신
========================================================= */

function updateTalk(){

  talkBox.textContent =
    introTalks[
      currentTalk
    ];


  /* 첫 번째 */

  if(
    currentTalk===0
  ){

    prevTalkBtn
      .classList
      .add(
        "hidden"
      );

  }

  else{

    prevTalkBtn
      .classList
      .remove(
        "hidden"
      );

  }


  const isLast =
    currentTalk ===
    introTalks.length - 1;


  /* 마지막 */

  if(isLast){

    nextTalkBtn.style.visibility =
      "hidden";


    nextTalkBtn.style.pointerEvents =
      "none";


    adventureBtn
      .classList
      .add(
        "show"
      );


    updateAdventurePosition();

  }

  else{

    nextTalkBtn.style.visibility =
      "visible";


    nextTalkBtn.style.pointerEvents =
      "auto";


    adventureBtn
      .classList
      .remove(
        "show"
      );

  }

}


/* =========================================================
   다음
========================================================= */

function nextTalk(){

  if(
    currentTalk <
    introTalks.length - 1
  ){

    currentTalk++;

    updateTalk();

  }

}


/* =========================================================
   이전
========================================================= */

function prevTalk(){

  if(
    currentTalk > 0
  ){

    currentTalk--;

    updateTalk();

  }

}


/* =========================================================
   모험 시작
========================================================= */

function startAdventure(){

  sessionStorage.setItem(
    INTRO_DONE_KEY,
    "true"
  );


  introStage
    .classList
    .remove(
      "show"
    );


  showBooks();


  checkEnding();

}


/* =========================================================
   문제 이동
========================================================= */

function goMission(
  number
){

  const button =
    document.getElementById(
      "book" + number
    );


  if(
    button.disabled
  ){

    return;

  }


  location.href =
    `https://baekko.github.io/cnedu/bduq${number}.html`;

}


/* =========================================================
   엔딩 확인
========================================================= */

function checkEnding(){

  const progress =
    getProgress();


  if(
    !allMissionsDone(
      progress
    )
  ){

    return;

  }


  if(
    sessionStorage.getItem(
      END_VIDEO_KEY
    )
    ===
    "true"
  ){

    return;

  }


  clearTimeout(
    endTimer
  );


  endTimer =
    setTimeout(
      function(){

        sessionStorage.setItem(
          END_VIDEO_KEY,
          "true"
        );


        playEndingVideo();

      },

      5000
    );

}


/* =========================================================
   엔딩 영상
========================================================= */

function playEndingVideo(){

  const modal =
    document.getElementById(
      "videoModal"
    );


  const video =
    document.getElementById(
      "endVideo"
    );


  modal
    .classList
    .add(
      "show"
    );


  video.currentTime=0;

  video.load();


  video.onended =
    function(){

      goEnd();

    };


  video.onerror =
    function(){

      setTimeout(
        goEnd,
        1000
      );

    };


  const playPromise =
    video.play();


  if(
    playPromise !==
    undefined
  ){

    playPromise
      .catch(
        function(){

          setTimeout(
            goEnd,
            1000
          );

        }
      );

  }

}


/* =========================================================
   엔딩
========================================================= */

function goEnd(){

  location.href =
    "https://baekko.github.io/cnedu/bduend.html";

}


/* =========================================================
   테스트 초기화
========================================================= */

function devReset(){

  localStorage.removeItem(
    PROGRESS_KEY
  );


  sessionStorage.removeItem(
    END_VIDEO_KEY
  );


  sessionStorage.removeItem(
    INTRO_DONE_KEY
  );


  clearTimeout(
    endTimer
  );


  location.reload();

}


/* =========================================================
   페이지 복귀
========================================================= */

window.addEventListener(
  "pageshow",
  function(){

    applyBookState();


    if(
      sessionStorage.getItem(
        INTRO_DONE_KEY
      )
      ===
      "true"
    ){

      introStage
        .classList
        .remove(
          "show"
        );


      showBooks();

      checkEnding();

    }

  }
);


/* =========================================================
   화면 크기 변경
========================================================= */

window.addEventListener(
  "resize",
  function(){

    if(
      adventureBtn
        .classList
        .contains(
          "show"
        )
    ){

      updateAdventurePosition();

    }

  }
);


/* =========================================================
   최초 실행
========================================================= */

applyBookState();


if(
  sessionStorage.getItem(
    INTRO_DONE_KEY
  )
  !==
  "true"
){

  setTimeout(
    function(){

      showIntro();

    },

    1000
  );

}

else{

  showBooks();

  checkEnding();

}

</script>

</body>
</html>
