<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY THE BOOK OUTRO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
  position:relative;
  background:url("ptbout.png") no-repeat center center / cover;
}

/* 점수 이미지 모달 */
.score-modal{
  position:fixed;
  inset:0;
  z-index:900;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
}

.score-modal.show{
  display:flex;
}

.score-box{
  position:relative;
  width:min(82vw,560px);
  max-height:82vh;
  background:#fff7e8;
  border-radius:22px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.42);
}

.score-box img{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  display:block;
  border-radius:16px;
}

.score-close{
  position:absolute;
  right:-12px;
  top:-12px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#5a321d;
  color:white;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}

/* 하단 버튼 영역 */
.bottom-btn-area{
  position:fixed;
  left:50%;
  bottom:clamp(42px,6vh,70px);
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:14px;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
}

.bottom-btn{
  border:none;
  border-radius:999px;
  padding:13px 32px;
  background:rgba(80,46,24,.88);
  color:#fff8e8;
  font-size:clamp(17px,2.4vw,24px);
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:
    0 10px 24px rgba(0,0,0,.35),
    inset 0 2px 2px rgba(255,255,255,.25),
    inset 0 -4px 8px rgba(0,0,0,.25);
}

.bottom-btn:active{
  transform:scale(.96);
}

.reopen-btn{
  display:none;
}

.reopen-btn.show{
  display:block;
}

/* 리셋 모달 */
.reset-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.58);
}

.reset-modal.show{
  display:flex;
}

.reset-box{
  width:min(86vw,420px);
  border-radius:22px;
  padding:28px 24px;
  background:rgba(255,247,232,.96);
  text-align:center;
  box-shadow:0 20px 45px rgba(0,0,0,.42);
}

.reset-title{
  color:#2b160c;
  font-size:26px;
  font-weight:900;
  margin-bottom:12px;
}

.reset-desc{
  color:#4a2a18;
  font-size:17px;
  font-weight:700;
  line-height:1.5;
  margin-bottom:18px;
}

.reset-input{
  width:100%;
  height:52px;
  border:2px solid rgba(90,50,29,.35);
  border-radius:14px;
  padding:0 14px;
  font-size:22px;
  font-weight:900;
  text-align:center;
  outline:none;
  color:#2b160c;
  background:white;
  margin-bottom:18px;
}

.reset-input:focus{
  border-color:#5a321d;
}

.reset-actions{
  display:flex;
  gap:10px;
}

.reset-action-btn{
  flex:1;
  height:48px;
  border:none;
  border-radius:14px;
  color:white;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  background:#5a321d;
  box-shadow:
    0 8px 16px rgba(0,0,0,.28),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}

.reset-action-btn.cancel{
  background:#8a6a55;
}

.reset-message{
  min-height:22px;
  margin-top:14px;
  font-size:15px;
  font-weight:800;
  color:#b3261e;
}

@media(max-width:600px){
  .score-box{
    width:88vw;
    padding:12px;
  }

  .score-close{
    right:-8px;
    top:-8px;
    width:36px;
    height:36px;
    font-size:21px;
  }

  .bottom-btn-area{
    bottom:36px;
    gap:8px;
  }

  .bottom-btn{
    padding:10px 16px;
    font-size:15px;
  }

  .reset-box{
    width:88vw;
    padding:24px 18px;
  }

  .reset-title{
    font-size:23px;
  }

  .reset-desc{
    font-size:15px;
  }

  .reset-input{
    height:48px;
    font-size:20px;
  }

  .reset-action-btn{
    height:46px;
    font-size:16px;
  }
}

@media(max-width:390px){
  .bottom-btn-area{
    bottom:30px;
    gap:6px;
  }

  .bottom-btn{
    padding:9px 12px;
    font-size:14px;
  }

  .reset-title{
    font-size:21px;
  }

  .reset-desc{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="score-modal" id="scoreModal">
  <div class="score-box">
    <button class="score-close" onclick="closeScoreModal()">×</button>
    <img id="scoreImage" src="" alt="엔딩 편지">
  </div>
</div>

<div class="bottom-btn-area">
  <button class="bottom-btn reopen-btn" id="reopenBtn" onclick="openScoreModal()">편지 다시보기</button>
  <button class="bottom-btn reset-btn" onclick="openResetModal()">RESET</button>
</div>

<div class="reset-modal" id="resetModal">
  <div class="reset-box">
    <div class="reset-title">관리자 초기화</div>
    <div class="reset-desc">리셋 암호를 입력하세요.</div>

    <input
      id="resetInput"
      class="reset-input"
      type="password"
      inputmode="numeric"
      maxlength="8"
      autocomplete="off"
      placeholder="암호 입력"
    >

    <div class="reset-actions">
      <button class="reset-action-btn cancel" onclick="closeResetModal()">취소</button>
      <button class="reset-action-btn" onclick="checkResetPassword()">확인</button>
    </div>

    <div class="reset-message" id="resetMessage"></div>
  </div>
</div>

<script>
const PROGRESS_KEY = "ptb_progress_v1";
const RESET_PASSWORD = "1216";

let currentScoreImage = "";

function getProgress(){
  try{
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
  }catch(e){
    return {};
  }
}

function getTotalScore(){
  const progress = getProgress();
  let total = 0;

  for(let i=1; i<=5; i++){
    if(progress[i] && progress[i].completed){
      total += Number(progress[i].score || 0);
    }
  }

  return total;
}

function getScoreImageName(){
  let score = getTotalScore();

  if(score < 0) score = 0;
  if(score > 100) score = 100;

  score = Math.round(score / 10) * 10;

  return "ptbo" + score + ".png";
}

function setScoreImage(){
  currentScoreImage = getScoreImageName();
  document.getElementById("scoreImage").src = currentScoreImage;
}

function openScoreModal(){
  setScoreImage();
  document.getElementById("scoreModal").classList.add("show");
}

function closeScoreModal(){
  document.getElementById("scoreModal").classList.remove("show");
  document.getElementById("reopenBtn").classList.add("show");
}

function openResetModal(){
  const modal = document.getElementById("resetModal");
  const input = document.getElementById("resetInput");
  const message = document.getElementById("resetMessage");

  message.style.color = "#b3261e";
  message.textContent = "";
  input.value = "";
  modal.classList.add("show");

  setTimeout(function(){
    input.focus();
  },100);
}

function closeResetModal(){
  document.getElementById("resetModal").classList.remove("show");
}

function checkResetPassword(){
  const input = document.getElementById("resetInput").value.trim();
  const message = document.getElementById("resetMessage");

  if(input !== RESET_PASSWORD){
    message.style.color = "#b3261e";
    message.textContent = "암호가 맞지 않습니다.";
    return;
  }

  localStorage.removeItem("ptb_progress_v1");

  sessionStorage.removeItem("ptbm_modal_seen_once");
  sessionStorage.removeItem("ptbm_end_modal_seen_once");
  sessionStorage.removeItem("ptbin_return_from_next");

  message.style.color = "#1f7a3a";
  message.textContent = "초기화되었습니다.";

  setTimeout(function(){
    location.href = "https://baekko.github.io/cnedu/bdd.html";
  },800);
}

document.getElementById("resetInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    checkResetPassword();
  }
});

document.getElementById("resetModal").addEventListener("click", function(e){
  if(e.target.id === "resetModal"){
    closeResetModal();
  }
});

document.getElementById("scoreModal").addEventListener("click", function(e){
  if(e.target.id === "scoreModal"){
    closeScoreModal();
  }
});

setTimeout(function(){
  openScoreModal();
},1000);
</script>

</body>
</html>
