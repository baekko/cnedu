<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTB QUESTION</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#000;
}

body{
  position:relative;
  background:url("ptbq1.png") no-repeat center center / cover;
}

/* 하단 UI */
.ui-wrap{
  position:absolute;
  left:50%;
  bottom:7vh;
  transform:translateX(-50%);
  width:clamp(420px, 56vw, 560px);
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.answer-row{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0, 1fr) 86px;
  gap:12px;
}

.answer-input{
  width:100%;
  height:58px;
  border:none;
  border-radius:14px;
  padding:0 18px;
  font-size:20px;
  outline:none;
  background:rgba(255,255,255,.95);
  color:#222;
}

.submit-btn{
  height:58px;
  border:none;
  border-radius:14px;
  font-size:18px;
  font-weight:900;
  color:white;
  background:#5a321d;
  cursor:pointer;
  padding:0;
  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}

.action-row{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:12px;
}

.action-btn{
  height:54px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:900;
  color:white;
  background:#5a321d;
  cursor:pointer;
  padding:0;
  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}

.submit-btn:active,
.action-btn:active{
  transform:translateY(2px) scale(.98);
}

.action-btn:disabled{
  opacity:.42;
  cursor:default;
}

/* 글자 모달 */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
  z-index:100;
}

.modal.show{display:flex;}

.modal-box{
  width:min(86vw, 560px);
  background:#fff7e8;
  border-radius:22px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}

.modal-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:18px;
  color:#2b160c;
}

.modal-content{
  font-size:22px;
  line-height:1.6;
  color:#2b160c;
  white-space:pre-line;
  word-break:keep-all;
}

.modal-close{
  margin-top:22px;
  border:none;
  border-radius:14px;
  padding:12px 26px;
  font-size:18px;
  font-weight:900;
  color:#fff;
  background:#5a321d;
  cursor:pointer;
}

/* 이미지 모달 */
.image-modal{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
}

.image-modal.show{
  display:flex;
}

.image-box{
  position:relative;
  width:min(82vw, 560px);
  max-height:82vh;
  background:#fff7e8;
  border-radius:22px;
  padding:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.42);
}

.image-box img{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  display:block;
  border-radius:16px;
}

.image-close{
  position:absolute;
  right:-12px;
  top:-12px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#5a321d;
  color:white;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}

/* 영상 모달 */
.video-modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.68);
  z-index:200;
}

.video-modal.show{
  display:flex;
}

.video-box{
  width:clamp(360px, 58vw, 760px);
  max-height:76vh;
  border-radius:24px;
  overflow:hidden;
  background:transparent;
  box-shadow:0 22px 55px rgba(0,0,0,.55);
}

.result-video{
  width:100%;
  height:auto;
  display:block;
  background:transparent;
  border-radius:24px;
}

.video-fallback{
  display:none;
  width:100%;
  padding:30px 20px;
  text-align:center;
  background:#fff7e8;
  color:#3b2012;
  font-size:22px;
  font-weight:900;
  line-height:1.5;
  border-radius:24px;
}

.video-fallback.show{
  display:block;
}

.shake{
  animation:shake .25s ease;
}

@keyframes shake{
  0%{transform:translateX(-50%) translateX(0);}
  25%{transform:translateX(-50%) translateX(-6px);}
  50%{transform:translateX(-50%) translateX(6px);}
  75%{transform:translateX(-50%) translateX(-4px);}
  100%{transform:translateX(-50%) translateX(0);}
}

/* 휴대폰 */
@media(max-width:600px){
  .ui-wrap{
    width:min(88vw, 330px);
    bottom:5.5vh;
    gap:11px;
  }

  .answer-row{
    grid-template-columns:minmax(0, 1fr) 64px;
    gap:8px;
  }

  .answer-input{
    height:52px;
    font-size:16px;
    padding:0 14px;
    border-radius:13px;
  }

  .submit-btn{
    height:52px;
    font-size:16px;
    border-radius:13px;
  }

  .action-row{
    gap:8px;
  }

  .action-btn{
    height:48px;
    font-size:14px;
    border-radius:13px;
  }

  .modal-title{font-size:23px;}
  .modal-content{font-size:18px;}

  .image-box{
    width:88vw;
    padding:12px;
  }

  .image-close{
    right:-8px;
    top:-8px;
    width:36px;
    height:36px;
    font-size:21px;
  }

  .video-box{
    width:72vw;
    max-width:340px;
    min-width:0;
    border-radius:18px;
  }

  .result-video{
    border-radius:18px;
  }

  .video-fallback{
    border-radius:18px;
    font-size:18px;
    padding:24px 16px;
  }
}

@media(max-width:390px){
  .ui-wrap{
    width:min(90vw, 310px);
  }

  .answer-row{
    grid-template-columns:minmax(0, 1fr) 58px;
    gap:7px;
  }

  .answer-input{
    height:50px;
    font-size:15px;
    padding:0 12px;
  }

  .submit-btn{
    height:50px;
    font-size:15px;
  }

  .action-row{
    gap:7px;
  }

  .action-btn{
    height:46px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="ui-wrap" id="uiWrap">
  <div class="answer-row">
    <input id="answerInput" class="answer-input" type="text" placeholder="정답을 입력하세요" autocomplete="off">
    <button class="submit-btn" onclick="checkAnswer()">입력</button>
  </div>

  <div class="action-row">
    <button class="action-btn" onclick="showHint()">힌트보기</button>
    <button class="action-btn" id="answerBtn" onclick="showAnswer()" disabled>정답보기</button>
    <button class="action-btn" onclick="showScore()">기억보상</button>
  </div>
</div>

<div class="modal" id="infoModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">안내</div>
    <div class="modal-content" id="modalContent"></div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<div class="image-modal" id="imageModal">
  <div class="image-box">
    <button class="image-close" onclick="closeImageModal()">×</button>
    <img id="imageModalImg" src="" alt="안내 이미지">
  </div>
</div>

<div class="video-modal" id="videoModal">
  <div class="video-box">
    <video id="resultVideo" class="result-video" playsinline muted></video>
    <div id="videoFallback" class="video-fallback"></div>
  </div>
</div>

<script>
const PROGRESS_KEY = "ptb_progress_v1";

let usedHint = false;
let usedAnswer = false;
let locked = false;
let pendingScore = null;
let imageModalMode = "intro";

const missionConfig = {
  missionNumber: 1,
  correctAnswer: "library",
  hintText: "집모양을 맞추면 단어가 보입니다.",
  answerText: "library",
  bgImage: "ptbq1.png",
  introImage: "ptbq1m.png",
  correctImage: "ptbq1w.png"
};

function getProgress(){
  try{
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
  }catch(e){
    return {};
  }
}

function setProgress(progress){
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
}

function normalize(text){
  return String(text).replace(/\s+/g,"").trim().toLowerCase();
}

function currentScore(){
  if(usedAnswer) return 0;
  if(usedHint) return 10;
  return 20;
}

function openModal(title, content){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalContent").textContent = content;
  document.getElementById("infoModal").classList.add("show");
}

function closeModal(){
  document.getElementById("infoModal").classList.remove("show");
}

function openImageModal(src, mode){
  imageModalMode = mode;
  document.getElementById("imageModalImg").src = src;
  document.getElementById("imageModal").classList.add("show");
}

function closeImageModal(){
  document.getElementById("imageModal").classList.remove("show");

  if(imageModalMode === "correct" && pendingScore !== null){
    const score = pendingScore;
    pendingScore = null;

    if(score === 0){
      location.href = "ptbm.html";
      return;
    }

    playVideoAndReturn(score);
  }
}

function showHint(){
  if(locked) return;
  usedHint = true;
  document.getElementById("answerBtn").disabled = false;
  openModal("힌트", missionConfig.hintText);
}

function showAnswer(){
  if(locked) return;
  if(!usedHint) return;
  usedAnswer = true;
  openModal("정답", missionConfig.answerText);
}

function getTotalScore(){
  const progress = getProgress();
  let total = 0;

  for(let i = 1; i <= 5; i++){
    if(progress[i] && progress[i].completed){
      total += Number(progress[i].score || 0);
    }
  }

  return total;
}

function showScore(){
  openModal("기억보상", `현재까지 모은 기억보상은 ${getTotalScore()}입니다.`);
}

function saveResult(score){
  const progress = getProgress();

  progress[missionConfig.missionNumber] = {
    completed:true,
    score:score,
    usedHint:usedHint,
    usedAnswer:usedAnswer
  };

  setProgress(progress);
}

function getVideoSrc(score){
  if(score === 20) return "ptbq1.mp4";
  if(score === 10) return "ptbq2.mp4";
  return "ptbq3.mp4";
}

function playVideoAndReturn(score){
  const videoModal = document.getElementById("videoModal");
  const video = document.getElementById("resultVideo");
  const fallback = document.getElementById("videoFallback");

  videoModal.classList.add("show");
  fallback.classList.remove("show");
  fallback.textContent = "";
  video.style.display = "block";

  video.src = getVideoSrc(score);
  video.load();

  const goBack = function(){
    location.href = "ptbm.html";
  };

  video.onended = goBack;

  video.onerror = function(){
    video.style.display = "none";
    fallback.textContent = `${score}점 획득!\n영상 파일을 넣으면 이곳에서 재생됩니다.`;
    fallback.classList.add("show");

    setTimeout(goBack, 1800);
  };

  const playPromise = video.play();

  if(playPromise !== undefined){
    playPromise.catch(function(){
      video.style.display = "none";
      fallback.textContent = `${score}점 획득!\n영상 파일을 넣으면 이곳에서 재생됩니다.`;
      fallback.classList.add("show");

      setTimeout(goBack, 1800);
    });
  }
}

function checkAnswer(){
  if(locked) return;

  const input = document.getElementById("answerInput").value;

  if(!input.trim()){
    openModal("안내", "정답을 입력해주세요.");
    return;
  }

  if(normalize(input) === normalize(missionConfig.correctAnswer)){
    locked = true;
    const score = currentScore();

    saveResult(score);
    closeModal();

    pendingScore = score;
    openImageModal(missionConfig.correctImage, "correct");

  }else{
    const ui = document.getElementById("uiWrap");
    ui.classList.remove("shake");
    void ui.offsetWidth;
    ui.classList.add("shake");

    openModal("오답", "정답이 아닙니다.");
  }
}

document.getElementById("answerInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    checkAnswer();
  }
});

document.body.style.backgroundImage = `url("${missionConfig.bgImage}")`;
document.title = `PTBQ${missionConfig.missionNumber}`;

setTimeout(function(){
  openImageModal(missionConfig.introImage, "intro");
}, 1000);
</script>

</body>
</html>
