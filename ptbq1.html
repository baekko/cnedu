<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>PTB QUESTION 1</title>

<!-- 래빗홀과 같은 웹폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  background:#000;

  font-family:
    "Gowun Dodum",
    sans-serif;
}


/* =========================================================
   색상
========================================================= */

:root{

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#784738;

  --blue:#235a9e;
  --orange:#ff884d;

  /* 편지왔어요 기존 버튼색 */
  --button:#5a321d;

  --ui-bottom:5.5vh;
}


/* =========================================================
   배경

   ★ 이제 미션카드가 없는 새 ptbq1.png 사용
========================================================= */

body{
  position:relative;

  background:
    url("ptbq1.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   미션카드
========================================================= */

.mission-wrap{
  position:fixed;

  left:50%;
  top:43%;

  transform:
    translate(-50%,-50%);

  width:
    min(86vw,620px);

  display:none;

  z-index:25;
}


.mission-wrap.show{
  display:block;
}


/* 카드 본체 */

.mission-card{
  width:100%;

  padding:
    30px 28px 27px;

  border:
    5px solid
    var(--paper-border);

  border-radius:
    28px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 14px 30px
    rgba(0,0,0,.30);
}


/* 기억 #1 */

.mission-title{
  color:
    var(--paper-text);

  font-size:
    28px;

  font-weight:
    900;

  line-height:
    1.4;

  margin-bottom:
    20px;

  word-break:
    keep-all;
}


/* A1, A2 키트 사용 */

.mission-kit{
  color:
    var(--blue);

  font-size:
    30px;

  font-weight:
    900;

  margin-bottom:
    22px;
}


/* =========================================================
   주황색 문제 그림 영역
========================================================= */

.mission-image-box{
  width:100%;

  padding:
    7px;

  margin-bottom:
    20px;

  border:
    5px solid
    var(--orange);

  border-radius:
    10px;

  background:#fff;

  display:flex;

  justify-content:center;
  align-items:center;
}


.mission-image{
  display:block;

  width:100%;
  height:auto;

  max-height:
    125px;

  object-fit:
    contain;
}


/* 정답은 알파벳 7자 */

.mission-guide{
  color:#000;

  font-size:
    30px;

  font-weight:
    900;

  line-height:
    1.35;
}


/* =========================================================
   하단 정답 UI

   ★ 기존 ptbq 스타일 유지
   ★ 처음에는 숨김
========================================================= */

.ui-wrap{
  position:fixed;

  left:50%;
  bottom:
    var(--ui-bottom);

  transform:
    translateX(-50%);

  width:
    clamp(420px,56vw,560px);

  z-index:35;

  display:none;

  flex-direction:column;

  gap:14px;
}


.ui-wrap.show{
  display:flex;
}


/* 입력창 + 입력 */

.answer-row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    86px;

  gap:12px;
}


.answer-input{
  width:100%;
  height:58px;

  border:none;

  border-radius:14px;

  padding:
    0 18px;

  outline:none;

  background:
    rgba(255,255,255,.97);

  color:#222;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;

  font-weight:700;

  box-shadow:
    0 8px 18px
    rgba(0,0,0,.25);
}


.submit-btn{
  height:58px;

  border:none;

  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:18px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}


/* =========================================================
   힌트 / 정답 / 기억보상
========================================================= */

.action-row{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}


.action-btn{
  height:54px;

  border:none;

  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:17px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}


.submit-btn:active,
.action-btn:active{
  transform:
    translateY(2px)
    scale(.98);
}


.action-btn:disabled{
  opacity:.42;

  cursor:default;
}


/* =========================================================
   글자 안내 모달
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);
}


.modal.show{
  display:flex;
}


.modal-box{
  width:
    min(86vw,560px);

  padding:
    30px 24px;

  border-radius:
    22px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 18px 40px
    rgba(0,0,0,.35);
}


.modal-title{
  color:
    #2b160c;

  font-size:
    28px;

  font-weight:
    900;

  margin-bottom:
    18px;
}


.modal-content{
  color:
    #2b160c;

  font-size:
    22px;

  font-weight:
    700;

  line-height:
    1.6;

  white-space:
    pre-line;

  word-break:
    keep-all;
}


.modal-close{
  height:50px;

  min-width:
    100px;

  margin-top:
    22px;

  padding:
    0 24px;

  border:none;

  border-radius:
    14px;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:
    17px;

  font-weight:
    900;

  cursor:pointer;
}


/* =========================================================
   편지 이미지 모달
========================================================= */

.image-modal{
  position:fixed;

  inset:0;

  z-index:150;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);
}


.image-modal.show{
  display:flex;
}


.image-box{
  position:relative;

  width:
    min(82vw,560px);

  max-height:
    82vh;

  padding:
    18px;

  border-radius:
    22px;

  background:
    #fff7e8;

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.42);
}


.image-box img{
  display:block;

  width:100%;

  max-height:
    72vh;

  object-fit:
    contain;

  border-radius:
    16px;
}


.image-close{
  position:absolute;

  right:-12px;
  top:-12px;

  width:42px;
  height:42px;

  border:none;

  border-radius:50%;

  background:
    #5a321d;

  color:#fff;

  font-size:
    24px;

  font-weight:
    900;

  cursor:pointer;

  box-shadow:
    0 6px 14px
    rgba(0,0,0,.35);
}


/* =========================================================
   영상
========================================================= */

.video-modal{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.68);
}


.video-modal.show{
  display:flex;
}


.video-box{
  width:
    clamp(360px,58vw,760px);

  max-height:
    76vh;

  overflow:hidden;

  border-radius:
    24px;

  background:
    transparent;

  box-shadow:
    0 22px 55px
    rgba(0,0,0,.55);
}


.result-video{
  display:block;

  width:100%;
  height:auto;

  border-radius:
    24px;

  background:
    transparent;
}


.video-fallback{
  display:none;

  width:100%;

  padding:
    30px 20px;

  border-radius:
    24px;

  background:
    #fff7e8;

  color:
    #3b2012;

  text-align:center;

  font-size:
    22px;

  font-weight:
    900;

  line-height:
    1.5;

  white-space:
    pre-line;
}


.video-fallback.show{
  display:block;
}


/* =========================================================
   오답 흔들림
========================================================= */

.shake{
  animation:
    shake .25s ease;
}


@keyframes shake{

  0%{
    transform:
      translateX(-50%)
      translateX(0);
  }

  25%{
    transform:
      translateX(-50%)
      translateX(-6px);
  }

  50%{
    transform:
      translateX(-50%)
      translateX(6px);
  }

  75%{
    transform:
      translateX(-50%)
      translateX(-4px);
  }

  100%{
    transform:
      translateX(-50%)
      translateX(0);
  }

}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px){

  .mission-wrap{
    width:
      min(88vw,380px);

    top:42%;
  }


  .mission-card{
    padding:
      22px 18px 20px;

    border-width:
      4px;

    border-radius:
      22px;
  }


  .mission-title{
    font-size:
      19px;

    margin-bottom:
      13px;
  }


  .mission-kit{
    font-size:
      21px;

    margin-bottom:
      14px;
  }


  .mission-image-box{
    padding:5px;

    margin-bottom:
      13px;

    border-width:
      3px;

    border-radius:
      8px;
  }


  .mission-image{
    max-height:
      78px;
  }


  .mission-guide{
    font-size:
      21px;
  }


  /* 정답 UI */

  .ui-wrap{
    width:
      min(88vw,330px);

    bottom:4.5vh;

    gap:11px;
  }


  .answer-row{
    grid-template-columns:
      minmax(0,1fr)
      64px;

    gap:8px;
  }


  .answer-input{
    height:52px;

    padding:
      0 14px;

    border-radius:
      13px;

    font-size:
      16px;
  }


  .submit-btn{
    height:52px;

    border-radius:
      13px;

    font-size:
      16px;
  }


  .action-row{
    gap:8px;
  }


  .action-btn{
    height:48px;

    border-radius:
      13px;

    font-size:
      14px;
  }


  .modal-title{
    font-size:23px;
  }


  .modal-content{
    font-size:18px;
  }


  .image-box{
    width:88vw;

    padding:12px;
  }


  .image-close{
    right:-8px;
    top:-8px;

    width:36px;
    height:36px;

    font-size:21px;
  }


  .video-box{
    width:72vw;

    max-width:340px;

    min-width:0;

    border-radius:18px;
  }


  .result-video{
    border-radius:18px;
  }


  .video-fallback{
    border-radius:18px;

    font-size:18px;

    padding:
      24px 16px;
  }

}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  .mission-wrap{
    width:90vw;

    top:41%;
  }


  .mission-card{
    padding:
      19px 15px 18px;
  }


  .mission-title{
    font-size:18px;
  }


  .mission-kit{
    font-size:20px;
  }


  .mission-image{
    max-height:
      70px;
  }


  .mission-guide{
    font-size:20px;
  }


  .ui-wrap{
    width:
      min(90vw,310px);

    bottom:4vh;
  }


  .answer-row{
    grid-template-columns:
      minmax(0,1fr)
      58px;

    gap:7px;
  }


  .answer-input{
    height:50px;

    padding:
      0 12px;

    font-size:15px;
  }


  .submit-btn{
    height:50px;

    font-size:15px;
  }


  .action-row{
    gap:7px;
  }


  .action-btn{
    height:46px;

    font-size:13px;
  }

}


/* =========================================================
   낮은 화면
========================================================= */

@media(max-height:700px){

  .mission-wrap{
    top:38%;
  }


  .mission-card{
    padding-top:16px;
    padding-bottom:16px;
  }


  .mission-title{
    margin-bottom:10px;
  }


  .mission-kit{
    margin-bottom:10px;
  }


  .mission-image-box{
    margin-bottom:10px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     미션카드
===================================================== -->

<div
  class="mission-wrap"
  id="missionWrap"
>

  <div class="mission-card">


    <div class="mission-title">
      기억 #1: 순례주택
    </div>


    <div class="mission-kit">
      A 1, A 2 키트 사용
    </div>


    <div class="mission-image-box">

      <img
        class="mission-image"
        src="ptbq111.png"
        alt="순례주택 미션 그림"
      >

    </div>


    <div class="mission-guide">
      정답은 알파벳 7자
    </div>


  </div>

</div>


<!-- =====================================================
     정답 입력 UI
===================================================== -->

<div
  class="ui-wrap"
  id="uiWrap"
>

  <div class="answer-row">

    <input
      id="answerInput"
      class="answer-input"
      type="text"
      placeholder="정답을 입력하세요"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >


    <button
      class="submit-btn"
      type="button"
      onclick="checkAnswer()"
    >
      입력
    </button>

  </div>


  <div class="action-row">

    <button
      class="action-btn"
      type="button"
      onclick="showHint()"
    >
      힌트보기
    </button>


    <button
      class="action-btn"
      id="answerBtn"
      type="button"
      onclick="showAnswer()"
      disabled
    >
      정답보기
    </button>


    <button
      class="action-btn"
      type="button"
      onclick="showScore()"
    >
      기억보상
    </button>

  </div>

</div>


<!-- =====================================================
     글자 모달
===================================================== -->

<div
  class="modal"
  id="infoModal"
>

  <div class="modal-box">

    <div
      class="modal-title"
      id="modalTitle"
    >
      안내
    </div>


    <div
      class="modal-content"
      id="modalContent"
    ></div>


    <button
      class="modal-close"
      type="button"
      onclick="closeModal()"
    >
      닫기
    </button>

  </div>

</div>


<!-- =====================================================
     편지 이미지 모달
===================================================== -->

<div
  class="image-modal"
  id="imageModal"
>

  <div class="image-box">

    <button
      class="image-close"
      type="button"
      onclick="closeImageModal()"
    >
      ×
    </button>


    <img
      id="imageModalImg"
      src=""
      alt="편지"
    >

  </div>

</div>


<!-- =====================================================
     결과 영상
===================================================== -->

<div
  class="video-modal"
  id="videoModal"
>

  <div class="video-box">

    <video
      id="resultVideo"
      class="result-video"
      playsinline
      muted
    ></video>


    <div
      id="videoFallback"
      class="video-fallback"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   문제 설정
========================================================= */

const missionConfig = {

  missionNumber:1,

  correctAnswer:"library",

  hintText:
    "집모양을 맞추면 단어가 보입니다.",

  answerText:
    "library",

  /*
    미션카드가 없는 새로운 배경
  */
  bgImage:
    "ptbq1.png",

  /*
    문제 시작 전 편지
  */
  introImage:
    "ptbq1m.png",

  /*
    정답 후 편지
  */
  correctImage:
    "ptbq1w.png"

};


/* =========================================================
   저장
========================================================= */

const PROGRESS_KEY =
  "ptb_progress_v1";


let usedHint=false;
let usedAnswer=false;
let locked=false;

let pendingScore=null;


/*
  intro   = 첫 편지
  correct = 정답 후 편지
*/

let imageModalMode =
  "intro";


/* =========================================================
   진행상황
========================================================= */

function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(
        PROGRESS_KEY
      )
    ) || {};

  }

  catch(e){

    return {};

  }

}


function setProgress(
  progress
){

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );

}


/* =========================================================
   정답 정리
========================================================= */

function normalize(
  text
){

  return String(text)

    .replace(
      /\s+/g,
      ""
    )

    .trim()

    .toLowerCase();

}


/* =========================================================
   점수

   기존 편지왔어요 방식 유지
========================================================= */

function currentScore(){

  if(
    usedAnswer
  ){
    return 0;
  }


  if(
    usedHint
  ){
    return 10;
  }


  return 20;

}


/* =========================================================
   진행 저장
========================================================= */

function saveResult(
  score
){

  const progress =
    getProgress();


  progress[
    missionConfig.missionNumber
  ]={

    completed:true,

    score:score,

    usedHint:usedHint,

    usedAnswer:usedAnswer

  };


  setProgress(
    progress
  );

}


/* =========================================================
   글자 모달
========================================================= */

function openModal(
  title,
  content
){

  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      title;


  document
    .getElementById(
      "modalContent"
    )
    .textContent =
      content;


  document
    .getElementById(
      "infoModal"
    )
    .classList
    .add(
      "show"
    );

}


function closeModal(){

  document
    .getElementById(
      "infoModal"
    )
    .classList
    .remove(
      "show"
    );

}


/* =========================================================
   편지 열기
========================================================= */

function openImageModal(
  src,
  mode
){

  imageModalMode =
    mode;


  document
    .getElementById(
      "imageModalImg"
    )
    .src =
      src;


  document
    .getElementById(
      "imageModal"
    )
    .classList
    .add(
      "show"
    );

}


/* =========================================================
   편지 닫기

   ★ 실행 흐름 핵심
========================================================= */

function closeImageModal(){

  document
    .getElementById(
      "imageModal"
    )
    .classList
    .remove(
      "show"
    );


  /* =====================================================
     첫 번째 편지를 닫음

     → 2초 뒤 미션카드 + 문제 UI
  ===================================================== */

  if(
    imageModalMode ===
    "intro"
  ){

    setTimeout(
      function(){

        showMission();

      },

      2000
    );


    return;

  }


  /* =====================================================
     정답 후 편지를 닫음

     → 바로 결과 영상
  ===================================================== */

  if(
  imageModalMode ===
  "correct"
  &&
  pendingScore !== null
){

  const score =
    pendingScore;

  pendingScore =
    null;


  /* 정답보기 사용 = 0점 → 영상 없이 바로 메인으로 */
  if(score === 0){

    location.href =
      "ptbm.html";

    return;
  }


  /* 힌트 미사용 20점 / 힌트 사용 10점만 영상 재생 */
  playVideoAndReturn(
    score
  );

}

}


/* =========================================================
   미션카드 표시
========================================================= */

function showMission(){

  document
    .getElementById(
      "missionWrap"
    )
    .classList
    .add(
      "show"
    );


  document
    .getElementById(
      "uiWrap"
    )
    .classList
    .add(
      "show"
    );


  /*
    ★ focus() 없음

    사용자가 입력창을 직접 눌렀을 때만
    휴대폰 키보드가 나타남.
  */

}


/* =========================================================
   미션카드 숨김
========================================================= */

function hideMission(){

  document
    .getElementById(
      "missionWrap"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "uiWrap"
    )
    .classList
    .remove(
      "show"
    );

}


/* =========================================================
   힌트
========================================================= */

function showHint(){

  if(
    locked
  ){
    return;
  }


  usedHint =
    true;


  document
    .getElementById(
      "answerBtn"
    )
    .disabled =
      false;


  openModal(
    "힌트",
    missionConfig.hintText
  );

}


/* =========================================================
   정답보기
========================================================= */

function showAnswer(){

  if(
    locked
  ){
    return;
  }


  if(
    !usedHint
  ){
    return;
  }


  usedAnswer =
    true;


  openModal(
    "정답",
    missionConfig.answerText
  );

}


/* =========================================================
   총 기억보상
========================================================= */

function getTotalScore(){

  const progress =
    getProgress();


  let total =
    0;


  for(
    let i=1;
    i<=5;
    i++
  ){

    if(
      progress[i]
      &&
      progress[i].completed
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }


  return total;

}


/* =========================================================
   기억보상
========================================================= */

function showScore(){

  openModal(

    "기억보상",

    `현재까지 모은 기억보상은 ${getTotalScore()}입니다.`

  );

}


/* =========================================================
   정답 확인
========================================================= */

function checkAnswer(){

  if(
    locked
  ){
    return;
  }


  const input =
    document
      .getElementById(
        "answerInput"
      )
      .value;


  if(
    !input.trim()
  ){

    openModal(
      "안내",
      "정답을 입력해주세요."
    );


    return;

  }


  /* =====================================================
     정답
  ===================================================== */

  if(
    normalize(input)
    ===
    normalize(
      missionConfig.correctAnswer
    )
  ){

    locked =
      true;


    const score =
      currentScore();


    saveResult(
      score
    );


    pendingScore =
      score;


    closeModal();


    /*
      ★ 카드와 입력 UI 즉시 제거
    */

    hideMission();


    /*
      ★ 2초 뒤 정답 편지
    */

    setTimeout(
      function(){

        openImageModal(
          missionConfig.correctImage,
          "correct"
        );

      },

      2000
    );


    return;

  }


  /* =====================================================
     오답
  ===================================================== */

  const ui =
    document.getElementById(
      "uiWrap"
    );


  ui
    .classList
    .remove(
      "shake"
    );


  void ui.offsetWidth;


  ui
    .classList
    .add(
      "shake"
    );


  openModal(
    "오답",
    "정답이 아닙니다."
  );

}


/* =========================================================
   점수별 영상
========================================================= */

function getVideoSrc(score){

  if(score === 20){
    return "ptbq1.mp4";
  }

  if(score === 10){
    return "ptbq2.mp4";
  }

  return "";
}


/* =========================================================
   영상 → ptbm
========================================================= */

function playVideoAndReturn(
  score
){

  const videoModal =
    document.getElementById(
      "videoModal"
    );


  const video =
    document.getElementById(
      "resultVideo"
    );


  const fallback =
    document.getElementById(
      "videoFallback"
    );


  videoModal
    .classList
    .add(
      "show"
    );


  fallback
    .classList
    .remove(
      "show"
    );


  fallback.textContent =
    "";


  video.style.display =
    "block";


  video.src =
    getVideoSrc(
      score
    );


  video.load();


  const goBack =
    function(){

      location.href =
        "ptbm.html";

    };


  /*
    영상 종료
  */

  video.onended =
    goBack;


  /*
    파일 오류
  */

  video.onerror =
    function(){

      video.style.display =
        "none";


      fallback.textContent =
        `${score}점 획득!
영상 파일을 확인해주세요.`;


      fallback
        .classList
        .add(
          "show"
        );


      setTimeout(
        goBack,
        1800
      );

    };


  const playPromise =
    video.play();


  if(
    playPromise !==
    undefined
  ){

    playPromise.catch(
      function(){

        video.style.display =
          "none";


        fallback.textContent =
          `${score}점 획득!
영상을 재생할 수 없습니다.`;


        fallback
          .classList
          .add(
            "show"
          );


        setTimeout(
          goBack,
          1800
        );

      }
    );

  }

}


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    "answerInput"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key ===
        "Enter"
      ){

        checkAnswer();

      }

    }
  );


/* =========================================================
   최초 실행

   화면 로드
   → 미션카드는 숨김
   → 1초 후 첫 편지
========================================================= */

document.body.style.backgroundImage =
  `url("${missionConfig.bgImage}")`;


setTimeout(
  function(){

    openImageModal(
      missionConfig.introImage,
      "intro"
    );

  },

  1000
);

</script>
