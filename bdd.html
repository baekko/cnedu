<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOK돋음</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    position:relative;
    background:url("bdd.png") no-repeat center center;
    background-size:cover;
}

/* 버튼 */
.start-btn{
    position:absolute;
    left:50%;
    bottom:23%;
    transform:translateX(-50%);

    width:clamp(190px,28vw,300px);
    height:clamp(56px,7vw,76px);

    border:none;
    border-radius:999px;

    cursor:pointer;

    color:#fff;
    font-size:clamp(22px,2.4vw,34px);
    font-weight:900;

    background:linear-gradient(#93d83b,#69b928);

    box-shadow:
        0 10px 20px rgba(0,0,0,.28),
        inset 0 4px 0 rgba(255,255,255,.35),
        inset 0 -6px 0 rgba(55,120,15,.35);

    transition:.18s;
    -webkit-tap-highlight-color:transparent;
}

.start-btn:hover{
    transform:translateX(-50%) translateY(-3px) scale(1.03);
}

.start-btn:active{
    transform:translateX(-50%) translateY(2px) scale(.98);
}

.start-btn span{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    line-height:1;
    transform:translateY(-2px);
}

.arrow{
    font-size:1.15em;
    font-weight:900;
}
.start-text{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    width:100%;
    height:100%;
    animation:blinkText 1s infinite;
}

@keyframes blinkText{
    0%,100%{
        filter:brightness(1);
    }
    50%{
        filter:brightness(.45);
    }
}

/* 휴대폰 */
@media(max-width:600px){

    .start-btn{
        bottom:22%;
        width:120px;
        height:35px;
        font-size:13px;
        
    }

    .start-btn span{
        gap:8px;
        transform:translateY(-1px);
    }

}

</style>
</head>

<body>

<button class="start-btn" onclick="location.href='https://baekko.github.io/cnedu/ptb.html'">
    <span class="start-text">
    시작하기
    <span class="arrow">›</span>
</span>
</button>

</body>
</html>
