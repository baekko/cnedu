<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLAY THE BOOK</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head><body><iframe id="gameFrame" title="PLAY THE BOOK" allow="autoplay; fullscreen" allowfullscreen></iframe><script>
(function(){
 const frame=document.getElementById('gameFrame');
 const KEY='ptb_resume_rabbit', DEFAULT='bdut.html';
 const valid=p=>/^[A-Za-z0-9_-]+\.html$/.test(p||'');
 const current=()=>{try{return frame.contentWindow.location.pathname.split('/').pop()}catch(e){return ''}};
 // 실제 iframe에 표시된 페이지를 기록한다. 뒤로가기로 이동한 경우도 반영한다.
 frame.addEventListener('load',()=>{const p=current();if(valid(p))sessionStorage.setItem(KEY,p)});
 const saved=sessionStorage.getItem(KEY);
 frame.src=valid(saved)?saved:DEFAULT;
 window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='PTB_NAV')return;
  const p=String(e.data.page||'');if(!valid(p))return;
  sessionStorage.setItem(KEY,p);frame.src=p;
 });
 // 처음 표시 영역을 고정하지 않는다. 브라우저 상하단 바가 자리 잡으면 iframe도 맞춰진다.
 // 키보드가 열린 동안만 마지막 정상 높이를 보존하고, 닫히면 현재 높이를 다시 따른다.
 let normalHeight=window.innerHeight, keyboard=false;
 const focused=()=>{try{return /^(INPUT|TEXTAREA)$/.test(frame.contentDocument.activeElement.tagName)}catch(e){return false}};
 function resize(){
  const h=window.innerHeight;
  if(focused()&&h<normalHeight-120){keyboard=true;frame.style.height=normalHeight+'px';}
  else if(!focused()||h>=normalHeight-60){keyboard=false;frame.style.height='100%';normalHeight=h;}
 }
 window.addEventListener('resize',resize);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
 frame.addEventListener('load',()=>{keyboard=false;frame.style.height='100%';normalHeight=window.innerHeight});
})();
</script></body></html>
