<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RABBIT HOLE - MISSION 4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;

  background:#000;
}

:root{
  /* 녹색 버튼 */
  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  /* 대화창 */
  --talk-width:min(88vw,600px);
  --talk-bottom:15vh;

  /* 화살표 */
  --control-bottom:31vh;
  --arrow-w:82px;
  --arrow-h:68px;

  /* 화살표 아래에서 말박스까지 고정 간격 */
  --talk-gap:34px;

  /* 문제 UI */
  --ui-bottom:5.5vh;

  /* 대화창 색 */
  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}


/* =========================================================
   배경

   ★ bduq42.png는 사용하지 않음
========================================================= */

body{
  position:relative;

  background:
    url("bduq41.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   대화창
========================================================= */

.talk-box-wrap{
  position:fixed;

  left:50%;

  /* 말박스 윗선 고정: 화살표 아래에서 항상 같은 위치 */
  top:calc(100dvh - var(--control-bottom) + var(--talk-gap));
  bottom:auto;

  transform:translateX(-50%);

  width:var(--talk-width);

  display:none;

  z-index:30;
}

.talk-box-wrap.show{
  display:block;

  animation:fadeSimple .35s ease;
}


.talk-box{
  width:100%;

  padding:22px 25px;

  border:3px solid var(--paper-border);

  background:var(--paper);

  color:var(--paper-text);

  font-size:23px;
  font-weight:700;
  line-height:1.55;

  word-break:keep-all;
  white-space:pre-line;

  box-shadow:
    0 7px 14px rgba(0,0,0,.22);
}


/* =========================================================
   화살표 / 미션시작 / 나무로
========================================================= */

.talk-controls{
  position:fixed;

  left:50%;
  bottom:var(--control-bottom);

  transform:translateX(-50%);

  width:var(--talk-width);
  height:var(--arrow-h);

  display:none;

  align-items:center;
  justify-content:space-between;

  z-index:40;
}

.talk-controls.show{
  display:flex;

  animation:fadeSimple .35s ease;
}


/* =========================================================
   화살표
========================================================= */

.arrow-btn{
  width:var(--arrow-w);
  height:var(--arrow-h);

  flex:0 0 var(--arrow-w);

  border:none;
  background:transparent;

  padding:0;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;

  transition:transform .15s ease;
}

.arrow-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}

.arrow-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}

.arrow-btn svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(0 7px 8px rgba(0,0,0,.40))
    drop-shadow(0 2px 2px rgba(0,0,0,.30));
}

.arrow-shape{
  fill:var(--green);

  stroke:var(--green-dark);
  stroke-width:3;
}

.arrow-highlight{
  fill:rgba(255,255,255,.25);
}

.arrow-btn.hidden{
  visibility:hidden;
  pointer-events:none;
}


/* =========================================================
   미션시작 / 나무로
========================================================= */

.round-btn{
  display:none;

  height:58px;
  min-width:130px;

  padding:0 25px;

  border:3px solid var(--green-dark);

  border-radius:15px;

  background:var(--green);

  color:#fffdf1;

  font-size:20px;
  font-weight:900;

  line-height:1;

  white-space:nowrap;

  cursor:pointer;

  box-shadow:
    0 7px 8px rgba(0,0,0,.35),
    0 2px 2px rgba(0,0,0,.25),
    inset 0 2px 2px rgba(255,255,255,.25);

  text-shadow:
    0 1px 2px rgba(0,0,0,.25);

  -webkit-tap-highlight-color:transparent;

  transition:transform .15s ease;
}

.round-btn.show{
  display:block;
}

.round-btn:hover{
  transform:
    translateY(-2px)
    scale(1.03);
}

.round-btn:active{
  transform:
    translateY(2px)
    scale(.94);
}


/* =========================================================
   미션 카드
========================================================= */

.mission-wrap{
  position:fixed;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(86vw,620px);

  display:none;

  z-index:25;
}

.mission-wrap.show{
  display:block;

  animation:missionOpen .4s ease;
}


.mission-card{
  width:100%;

  padding:34px 30px 30px;

  border:5px solid var(--paper-border);

  border-radius:14px;

  background:var(--paper);

  text-align:center;

  box-shadow:
    0 14px 30px rgba(0,0,0,.30);
}


.mission-title{
  color:#784738;

  font-size:28px;
  font-weight:900;

  line-height:1.4;

  margin-bottom:24px;

  word-break:keep-all;
}


.mission-kit{
  color:#235a9e;

  font-size:31px;
  font-weight:900;

  margin-bottom:28px;
}


.mission-question{
  width:100%;

  padding:17px 15px;

  border:5px solid #8d4cff;

  border-radius:13px;

  background:#fff;

  color:#000;

  font-size:28px;
  font-weight:900;

  line-height:1.4;

  margin-bottom:25px;

  word-break:keep-all;
}


.mission-guide{
  color:#000;

  font-size:38px;
  font-weight:900;

  line-height:1.35;
}


/* =========================================================
   문제 입력 UI
========================================================= */

.ui-wrap{
  position:fixed;

  left:50%;
  bottom:var(--ui-bottom);

  transform:translateX(-50%);

  width:clamp(420px,56vw,560px);

  z-index:35;

  display:none;

  flex-direction:column;

  gap:14px;
}

.ui-wrap.show{
  display:flex;

  animation:fadeUp .35s ease;
}


.answer-row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    86px;

  gap:12px;
}


.answer-input{
  width:100%;
  height:58px;

  border:none;
  border-radius:14px;

  padding:0 18px;

  font-size:20px;

  outline:none;

  background:#fff;

  color:#222;

  box-shadow:
    0 8px 18px rgba(0,0,0,.25);
}


.submit-btn{
  height:58px;

  border:none;
  border-radius:14px;

  font-size:18px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      var(--green-light),
      var(--green)
    );

  cursor:pointer;

  box-shadow:
    0 7px 0 var(--green-dark),
    0 10px 16px rgba(0,0,0,.28),
    inset 0 2px 2px rgba(255,255,255,.30);
}


/* =========================================================
   하단 버튼
========================================================= */

.action-row{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}


.action-btn{
  height:54px;

  border:none;
  border-radius:14px;

  font-size:17px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      var(--green-light),
      var(--green)
    );

  cursor:pointer;

  box-shadow:
    0 6px 0 var(--green-dark),
    0 9px 15px rgba(0,0,0,.27),
    inset 0 2px 2px rgba(255,255,255,.30);
}


.submit-btn:active,
.action-btn:active{
  transform:translateY(4px);
}


.action-btn:disabled{
  opacity:.42;

  cursor:default;
}


/* =========================================================
   안내 모달
========================================================= */

.info-modal{
  position:fixed;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.55);

  z-index:100;
}


.info-modal.show{
  display:flex;
}


.info-box{
  width:min(86vw,560px);

  background:var(--paper);

  border-radius:22px;

  padding:30px 24px;

  text-align:center;

  box-shadow:
    0 18px 40px rgba(0,0,0,.35);
}


.modal-title{
  font-size:28px;
  font-weight:900;

  margin-bottom:18px;

  color:var(--green-dark);
}


.modal-content{
  font-size:22px;

  line-height:1.6;

  color:#25351d;

  white-space:pre-line;

  word-break:keep-all;
}


.modal-close{
  margin-top:22px;

  height:50px;

  min-width:100px;

  border:none;
  border-radius:14px;

  padding:0 24px;

  font-size:17px;
  font-weight:900;

  color:#fff;

  background:var(--green);

  cursor:pointer;
}


/* =========================================================
   결과 영상
========================================================= */

.video-modal{
  position:fixed;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.68);

  z-index:300;
}


.video-modal.show{
  display:flex;
}


.video-box{
  width:clamp(360px,58vw,760px);

  max-height:76vh;

  overflow:hidden;

  border-radius:24px;

  background:transparent;
}


.result-video{
  display:block;

  width:100%;
  height:auto;

  border-radius:24px;

  background:transparent;
}


/* =========================================================
   애니메이션
========================================================= */

.shake{
  animation:shake .25s ease;
}


@keyframes shake{
  0%{
    transform:translateX(-50%) translateX(0);
  }

  25%{
    transform:translateX(-50%) translateX(-6px);
  }

  50%{
    transform:translateX(-50%) translateX(6px);
  }

  75%{
    transform:translateX(-50%) translateX(-4px);
  }

  100%{
    transform:translateX(-50%) translateX(0);
  }
}


@keyframes fadeUp{
  from{
    opacity:0;

    transform:
      translateX(-50%)
      translateY(12px);
  }

  to{
    opacity:1;

    transform:
      translateX(-50%)
      translateY(0);
  }
}


@keyframes fadeSimple{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}


@keyframes missionOpen{
  from{
    opacity:0;

    transform:
      translate(-50%,-47%)
      scale(.96);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px){

  :root{
    --talk-width:min(92vw,360px);

    --talk-bottom:12vh;

    --control-bottom:28vh;

    --arrow-w:58px;
    --arrow-h:48px;

    --talk-gap:24px;

    --ui-bottom:4.5vh;
  }


  .talk-box{
    padding:15px 17px;

    border-width:2px;

      0 5px 10px rgba(0,0,0,.22);
  }


  .round-btn{
    height:46px;
    min-width:100px;

    padding:0 16px;

    border-width:3px;
    border-radius:13px;

    font-size:15px;

    box-shadow:
      0 6px 7px rgba(0,0,0,.32),
      0 2px 2px rgba(0,0,0,.22),
      inset 0 2px 2px rgba(255,255,255,.25);
  }


  .mission-wrap{
    width:min(88vw,380px);

    top:43%;
  }


  .mission-card{
    padding:24px 18px 22px;

  }

  }

  }

  }

    padding:0 14px;

  }


  .submit-btn{
    height:52px;

    border-radius:13px;
  }

    gap:8px;
  }

  }

/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{
    --talk-width:92vw;

    --talk-bottom:12vh;

  }

    font-size:15px;

  }

  }

  }

  }

  }

  }

  }

/* 낮은 화면 */
@media(max-height:700px){

  .talk-box{
    font-size:14px;
    line-height:1.4;

    padding:11px 14px;
  }

  }

  .mission-card{
    padding-top:18px;
    padding-bottom:18px;
  }

/* =========================================================
   ★ 래빗홀 공통 색상 잠금
   휴대폰 / 태블릿 / PC에서 색이 달라 보이지 않도록
   색상과 말박스 불투명도를 동일하게 고정
========================================================= */

:root{
  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}

.talk-box,
.mission-card,
.info-box{
  background:var(--paper) !important;
}

.talk-box{
  color:var(--paper-text) !important;
  border-color:var(--paper-border) !important;
}

.round-btn,
.adventure-btn,
.next-page-btn,
.next-btn,
.submit-btn,
.action-btn,
.modal-close{
  background:var(--green) !important;
  color:#fffdf1 !important;
  border-color:var(--green-dark) !important;
}

.arrow-shape{
  fill:var(--green) !important;
  stroke:var(--green-dark) !important;
}
/* 가로 화면 안내 */
.landscape-guide{
  display:none;
}

@media (orientation: landscape){
  .landscape-guide{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
  }

  .landscape-guide-text{
    font-family:"Gowun Dodum",sans-serif;
    font-size:20px;
    font-weight:700;
    line-height:1.7;
    text-align:center;
    color:#fff;
  }
}

/* =========================================================
   PTBQ 스타일 UI 통일 (래빗홀 녹색 유지)
   - 입력창/입력/힌트/정답보기/당근개수: PTBQ 형태
   - 미션카드: PTBQ 편지지형
========================================================= */

/* PTBQ와 동일한 기본 폰트 */
.answer-input,
.submit-btn,
.action-btn,
.mission-card,
.mission-title,
.mission-kit,
.mission-question,
.mission-guide{
  font-family:"Gowun Dodum",sans-serif !important;
}

/* 입력 UI: PTBQ의 크기/둥근모서리/그림자 */
.ui-wrap{
  width:clamp(420px,56vw,560px) !important;
  gap:14px !important;
}
.answer-row{
  grid-template-columns:minmax(0,1fr) 86px !important;
  gap:12px !important;
}
.answer-input{
  height:58px !important;
  border:none !important;
  border-radius:14px !important;
  padding:0 18px !important;
  outline:none !important;
  background:rgba(255,255,255,.97) !important;
  color:#222 !important;
  font-size:20px !important;
  font-weight:700 !important;
  box-shadow:0 8px 18px rgba(0,0,0,.25) !important;
}
.submit-btn{
  height:58px !important;
  border:none !important;
  border-radius:14px !important;
  padding:0 !important;
  background:var(--green) !important;
  color:#fff !important;
  font-size:18px !important;
  font-weight:900 !important;
  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25) !important;
}
.action-row{
  gap:12px !important;
}
.action-btn{
  height:54px !important;
  border:none !important;
  border-radius:14px !important;
  padding:0 !important;
  background:var(--green) !important;
  color:#fff !important;
  font-size:17px !important;
  font-weight:900 !important;
  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25) !important;
}
.submit-btn:active,
.action-btn:active{
  transform:translateY(2px) scale(.98) !important;
}
.action-btn:disabled{
  opacity:.42 !important;
  cursor:default !important;
}

/* PTBQ 편지지형 미션카드 */
.mission-card{
  position:relative !important;
  overflow:hidden !important;
  border:1px solid #c7a37d !important;
  border-radius:5px !important;
  background:
    linear-gradient(rgba(255,250,240,.82),rgba(248,237,217,.82)),
    radial-gradient(circle at 25% 20%,rgba(150,105,60,.08),transparent 34%),
    radial-gradient(circle at 75% 72%,rgba(150,105,60,.07),transparent 38%),
    #f6ead6 !important;
  box-shadow:
    0 20px 45px rgba(0,0,0,.34),
    inset 0 0 35px rgba(130,85,45,.08) !important;
  padding:34px 36px 31px !important;
}
.mission-card::before{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid rgba(166,116,68,.55);
  pointer-events:none;
  z-index:0;
}
.mission-card > *{
  position:relative;
  z-index:1;
}
/* 카드 내부 글자도 PTBQ 비율로 */
.mission-title{
  color:#784738 !important;
  font-size:28px !important;
  font-weight:900 !important;
  line-height:1.4 !important;
  margin-bottom:20px !important;
}
.mission-kit{
  color:#235a9e !important;
  font-size:30px !important;
  font-weight:900 !important;
  margin-bottom:22px !important;
}
.mission-question{
  padding:14px 12px !important;
  margin-bottom:20px !important;
  border:3px solid #d58a58 !important;
  border-radius:10px !important;
  background:rgba(255,255,255,.78) !important;
  color:#000 !important;
  font-size:24px !important;
  font-weight:900 !important;
  line-height:1.4 !important;
}
.mission-guide{
  color:#000 !important;
  font-size:30px !important;
  font-weight:900 !important;
  line-height:1.35 !important;
}

@media(max-width:600px){
  .mission-card{padding:27px 26px 24px !important;}
  .mission-card::before{inset:11px;}
  .mission-title{font-size:19px !important;margin-bottom:13px !important;}
  .mission-kit{font-size:21px !important;margin-bottom:14px !important;}
  .mission-question{padding:10px 8px !important;margin-bottom:13px !important;border-width:2px !important;font-size:18px !important;}

  missionQuestion:
    "달빛 레스토랑의 히든 메뉴는?",

  missionGuide:
    "정답은 한글 5자",


  /* =====================================================
     정답 후 대사
  ===================================================== */

  successTexts:[

    `와, 완벽해! 달빛 레스토랑의 가장 특별한 
비밀 메뉴를 정확히 찾아냈구나!`,

    `달빛 레스토랑의 진짜 손님이 될 자격을 충분히
증명했는걸?`,

    `네가 찾아낸 메뉴는 어떤 아픈 기억도 부드럽게
감싸 안아주는 마법 같은 힘을 가지고 있어.`,

    `자, 따뜻해진 마음을 품고 다음 비밀이 기다리는
곳으로 발걸음을 옮겨보자!`

  ]

};


/* =========================================================
   저장
========================================================= */

const PROGRESS_KEY =
  "bdu_progress_v1";


let usedHint=false;
let usedAnswer=false;
let locked=false;

let talkMode="intro";
let currentTalk=0;

let pendingScore=null;


/* =========================================================
   요소
========================================================= */

const talkBoxWrap =
  document.getElementById("talkBoxWrap");

const talkBox =
  document.getElementById("talkBox");

const talkControls =
  document.getElementById("talkControls");

const prevTalkBtn =
  document.getElementById("prevTalkBtn");

const nextTalkBtn =
  document.getElementById("nextTalkBtn");

const missionStartBtn =
  document.getElementById("missionStartBtn");

const treeBtn =
  document.getElementById("treeBtn");

const missionWrap =
  document.getElementById("missionWrap");

const uiWrap =
  document.getElementById("uiWrap");


/* =========================================================
   진행상황
========================================================= */

function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(PROGRESS_KEY)
    ) || {};

  }

  catch(e){

    return {};

  }

}


function setProgress(progress){

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );

}

/* =========================================================
   ★ 힌트 / 정답보기 사용 상태 즉시 저장
   새로고침·뒤로가기·재진입해도 패널티 유지
========================================================= */

function saveUsageState(){

  const progress = getProgress();
  const missionNumber = missionConfig.missionNumber;
  const oldData = progress[missionNumber] || {};

  /* 이미 완료한 문제는 최초 기록을 절대 변경하지 않음 */
  if(oldData.completed){
    return;
  }

  progress[missionNumber] = {
    completed:false,
    usedHint:usedHint,
    usedAnswer:usedAnswer
  };

  setProgress(progress);
}


function loadUsageState(){

  const progress = getProgress();
  const missionData = progress[missionConfig.missionNumber];

  if(!missionData){
    return;
  }

  usedHint = missionData.usedHint === true;
  usedAnswer = missionData.usedAnswer === true;

  if(usedHint){
    document.getElementById("answerBtn").disabled = false;
  }
}


/* =========================================================
   정답 비교
========================================================= */

function normalize(text){

  return String(text)
    .replace(/\s+/g,"")
    .trim()
    .toLowerCase();

}


/* =========================================================
   리워드 2 / 1 / 0
========================================================= */

function currentScore(){

  /* 정답보기 사용 */
  if(usedAnswer){
    return 0;
  }

  /* 힌트 사용 */
  if(usedHint){
    return 1;
  }

  /* 힌트 없이 정답 */
  return 2;

}


/* =========================================================
   현재까지 획득한 당근
========================================================= */

function getTotalScore(){

  const progress =
    getProgress();

  let total=0;


  for(let i=1;i<=5;i++){

    if(
      progress[i]
      &&
      progress[i].completed
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }


  return total;

}


/* =========================================================
   결과 저장
========================================================= */

function saveResult(score){

  const progress = getProgress();
  const missionNumber = missionConfig.missionNumber;
  const oldData = progress[missionNumber] || {};

  /* 이미 완료했다면 최초 점수를 절대 덮어쓰지 않음 */
  if(oldData.completed){
    return false;
  }

  progress[missionNumber] = {
    completed:true,
    score:score,
    usedHint:usedHint,
    usedAnswer:usedAnswer
  };

  setProgress(progress);

  return true;
}


/* =========================================================
   안내 모달
========================================================= */

function openModal(title,content){

  document
    .getElementById("modalTitle")
    .textContent=title;


  document
    .getElementById("modalContent")
    .textContent=content;


  document
    .getElementById("infoModal")
    .classList
    .add("show");

}


function closeModal(){

  document
    .getElementById("infoModal")
    .classList
    .remove("show");

}


/* =========================================================
   힌트
========================================================= */

function showHint(){
  if(window.PTB_ADMIN_ALLOW_HINT && !window.PTB_ADMIN_ALLOW_HINT()) return;

  if(locked){
    return;
  }


  usedHint=true;

  saveUsageState();


  document
    .getElementById("answerBtn")
    .disabled=false;


  openModal(
    "힌트",
    missionConfig.hintText
  );

}


/* =========================================================
   정답보기
========================================================= */

function showAnswer(){
  if(window.PTB_ADMIN_ALLOW_ANSWER && !window.PTB_ADMIN_ALLOW_ANSWER()) return;

  if(locked){
    return;
  }


  if(!usedHint){
    return;
  }


  usedAnswer=true;

  saveUsageState();


  openModal(
    "정답",
    missionConfig.answerText
  );

}


/* =========================================================
   당근 갯수
========================================================= */

function showReward(){

  const total = getTotalScore();

  openModal(
    "당근 갯수",
    total === 0
      ? "현재까지 획득한 당근은 0개입니다."
      : "🥕".repeat(total)
  );

}


/* =========================================================
   현재 대사 배열
========================================================= */

function getCurrentTalkList(){

  if(talkMode==="intro"){

    return missionConfig.introTexts;

  }


  return missionConfig.successTexts;

}


/* =========================================================
   대화 표시
========================================================= */

function showTalk(){

  const list =
    getCurrentTalkList();


  talkBox.textContent =
    list[currentTalk];


  talkBoxWrap
    .classList
    .add("show");


  talkControls
    .classList
    .add("show");


  updateTalkControls();

}


/* =========================================================
   화살표 / 버튼 상태
========================================================= */

function updateTalkControls(){

  const list =
    getCurrentTalkList();


  const total =
    list.length;


  /* 첫 대사는 왼쪽 화살표 없음 */

  if(currentTalk===0){

    prevTalkBtn
      .classList
      .add("hidden");

  }

  else{

    prevTalkBtn
      .classList
      .remove("hidden");

  }


  /* 오른쪽 버튼 초기화 */

  nextTalkBtn.style.display="none";


  missionStartBtn
    .classList
    .remove("show");


  treeBtn
    .classList
    .remove("show");


  /* 마지막 대사가 아니면 오른쪽 화살표 */

  if(currentTalk < total-1){

    nextTalkBtn.style.display="block";

    return;

  }


  /* 문제 시작 전 마지막 대사 */

  if(talkMode==="intro"){

    missionStartBtn
      .classList
      .add("show");

  }


  /* 문제 해결 후 마지막 대사 */

  else{

    treeBtn
      .classList
      .add("show");

  }

}


/* =========================================================
   다음 대사
========================================================= */

function nextTalk(){

  const list =
    getCurrentTalkList();


  if(currentTalk < list.length-1){

    currentTalk++;

    showTalk();

  }

}


/* =========================================================
   이전 대사
========================================================= */

function prevTalk(){

  if(currentTalk>0){

    currentTalk--;

    showTalk();

  }

}


/* =========================================================
   미션 카드 작성
========================================================= */

function fillMissionCard(){

  document
    .getElementById("missionTitle")
    .textContent =
      missionConfig.missionTitle;


  document
    .getElementById("missionKit")
    .textContent =
      missionConfig.missionKit;


  document
    .getElementById("missionQuestion")
    .textContent =
      missionConfig.missionQuestion;


  document
    .getElementById("missionGuide")
    .textContent =
      missionConfig.missionGuide;

}


/* =========================================================
   미션 시작

   ★ bduq42.png 사용하지 않음
   ★ 배경은 계속 bduq41.png
========================================================= */

function startMission(){

  talkBoxWrap
    .classList
    .remove("show");


  talkControls
    .classList
    .remove("show");


  fillMissionCard();


  missionWrap
    .classList
    .add("show");


  uiWrap
    .classList
    .add("show");


  

}


/* =========================================================
   정답 확인
========================================================= */

function checkAnswer(){

  if(locked){
    return;
  }


  const input =
    document
      .getElementById("answerInput")
      .value;


  if(!input.trim()){

    openModal(
      "안내",
      "정답을 입력해주세요."
    );

    return;

  }


  /* =====================================================
     정답
  ===================================================== */

  if(
    normalize(input)
    ===
    normalize(
      missionConfig.correctAnswer
    )
  ){

    locked=true;


    const progressBeforeSave =
      getProgress();

    const previousResult =
      progressBeforeSave[
        missionConfig.missionNumber
      ];

    const alreadyCompleted =
      !!(
        previousResult
        &&
        previousResult.completed
      );

    if(alreadyCompleted){

      /* ★ 재진입: 최초 점수 유지 + 보상 영상 재생 금지 */
      pendingScore=null;

    }

    else{

      pendingScore=
        currentScore();

      saveResult(
        pendingScore
      );

    }


    closeModal();


    /* 미션 카드 제거 */

    missionWrap
      .classList
      .remove("show");


    /* 입력 UI 제거 */

    uiWrap
      .classList
      .remove("show");


    /* 성공 대화 */

    talkMode="success";

    currentTalk=0;


    setTimeout(
      function(){

        showTalk();

      },

      1000
    );

  }


  /* =====================================================
     오답
  ===================================================== */

  else{

    uiWrap
      .classList
      .remove("shake");


    void uiWrap.offsetWidth;


    uiWrap
      .classList
      .add("shake");


    openModal(
      "오답",
      "정답이 아닙니다."
    );

  }

}


/* =========================================================
   나무로
========================================================= */

function finishMission(){

  /*
    ★ 이미 완료했던 문제에 다시 들어와 푼 경우
    당근 획득 영상을 다시 재생하지 않고 바로 나무로 이동
  */
  if(pendingScore===null){

    goMain();

    return;

  }


  talkBoxWrap
    .classList
    .remove("show");


  talkControls
    .classList
    .remove("show");


  /* 정답보기 사용 = 0점 = 영상 없음 */

  if(pendingScore===0){

    goMain();

    return;

  }


  playResultVideo(
    pendingScore
  );

}


/* =========================================================
   영상 선택
========================================================= */

function getVideoSrc(score){

  /* 힌트 없이 성공 = 2점 */

  if(score===2){

    return "bduq1.mp4";

  }


  /* 힌트 사용 = 1점 */

  if(score===1){

    return "bduq2.mp4";

  }


  return "";

}


/* =========================================================
   영상 재생
========================================================= */

function playResultVideo(score){

  const videoModal =
    document.getElementById(
      "videoModal"
    );


  const video =
    document.getElementById(
      "resultVideo"
    );


  const src =
    getVideoSrc(score);


  if(!src){

    goMain();

    return;

  }


  videoModal
    .classList
    .add("show");


  video.src=src;

  video.load();


  /* 영상 종료 → 나무 */

  video.onended=
    function(){

      goMain();

    };


  /* 영상 오류 */

  video.onerror=
    function(){

      setTimeout(
        goMain,
        1000
      );

    };


  const playPromise=
    video.play();


  if(playPromise!==undefined){

    playPromise.catch(
      function(){

        setTimeout(
          goMain,
          1000
        );

      }
    );

  }

}


/* =========================================================
   메인 나무
========================================================= */

function goMain(){

  location.href =
    "bdum.html";

}


/* =========================================================
   엔터 입력
========================================================= */

document
  .getElementById("answerInput")
  .addEventListener(
    "keydown",

    function(e){

      if(e.key==="Enter"){

        checkAnswer();

      }

    }
  );


/* =========================================================
   최초 실행
========================================================= */

fillMissionCard();

/* 이전 힌트/정답보기 사용 기록 복원 */
loadUsageState();


/* 2초 후 첫 번째 대화 */

setTimeout(
  function(){

    talkMode="intro";

    currentTalk=0;

    showTalk();

  },

  2000
);

</script>


<script>
/* ===== PTB 관리자 힌트 제한 ===== */
(function(){
  const STORAGE_KEY="ptb_admin_hint_limits_v1", GAME_KEY="rabbit";
  function level(){try{return Number((JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"))[GAME_KEY]||0);}catch(e){return 0;}}
  function buttons(){return {hint:document.querySelector('[onclick="showHint()"]'),answer:document.getElementById('answerBtn')||document.querySelector('[onclick="showAnswer()"]')};}
  function enforce(){const l=level(),b=buttons();if(!b.hint||!b.answer)return;if(l>=2){b.hint.disabled=true;b.answer.disabled=true;}else if(l===1){b.answer.disabled=true;}}
  window.PTB_ADMIN_ALLOW_HINT=function(){return level()<2;};
  window.PTB_ADMIN_ALLOW_ANSWER=function(){return level()<1;};
  addEventListener('DOMContentLoaded',()=>{enforce();new MutationObserver(enforce).observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});});
  addEventListener('storage',enforce);
})();
</script>

</body>
</html>
