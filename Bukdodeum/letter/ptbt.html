<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY THE BOOK INTRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Gowun Dodum",sans-serif}
:root{
 --card-size:clamp(330px,75vw,670px);
 --card-top:clamp(95px,14vh,150px);
 --arrow-w:clamp(78px,11vw,120px);
 --arrow-h:clamp(66px,9vw,96px);
 --arrow-gap:clamp(50px,8vw,90px);
 --arrow-top-gap:clamp(28px,4vh,42px);
 --next-bottom:clamp(48px,7vh,80px);
}
body{position:relative;background:url("ptbin.png") no-repeat center center/cover}
.intro-wrap{position:relative;width:100%;height:100%}
.card-area{
 position:absolute;left:50%;top:var(--card-top);transform:translateX(-50%);
 width:var(--card-size);height:var(--card-size);z-index:5;
 border:7px solid #7f4b3a;background:#15110f;overflow:hidden;
 box-shadow:0 18px 36px rgba(0,0,0,.38);
}
.story-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.story-img{opacity:0;transition:opacity .22s ease}
.story-img.show{opacity:1}
.caption{
 position:absolute;z-index:8;left:50%;bottom:7%;transform:translateX(-50%);
 width:82%;padding:15px 18px;color:#fff;
 font-size:clamp(16px,2.2vw,24px);font-weight:700;line-height:1.45;
 text-align:center;word-break:keep-all;
 border:1px solid rgba(255,255,255,.42);
 box-shadow:0 5px 12px rgba(0,0,0,.24);
 text-shadow:0 1px 2px rgba(0,0,0,.20);
}
.caption.brown{background:rgba(139,88,63,.95)}
.caption.gray{background:rgba(126,116,109,.95)}
.caption.hidden{display:none}
.arrow-area{
 position:absolute;left:50%;top:calc(var(--card-top) + var(--card-size) + var(--arrow-top-gap));
 transform:translateX(-50%);display:flex;gap:var(--arrow-gap);
 align-items:center;justify-content:center;z-index:10
}
.arrow-area.video-mode{display:none}
.arrow-btn{width:var(--arrow-w);height:var(--arrow-h);border:0;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.arrow-btn svg{width:100%;height:100%;display:block;filter:drop-shadow(0 9px 10px rgba(0,0,0,.42)) drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.arrow-shape{fill:#5b351d;stroke:#2d160b;stroke-width:3}
.arrow-highlight{fill:rgba(255,255,255,.22)}
.arrow-btn.hidden{visibility:hidden;pointer-events:none}
.arrow-btn:active{transform:translateY(2px) scale(.95)}
.next-btn{
 position:absolute;left:50%;bottom:var(--next-bottom);transform:translateX(-50%);
 z-index:20;display:none;height:58px;min-width:145px;padding:0 28px;
 border:3px solid #2d160b;border-radius:15px;background:#5b351d;color:#fffdf1;
 font-family:"Gowun Dodum",sans-serif;font-size:20px;font-weight:900;cursor:pointer;
 box-shadow:0 5px 8px rgba(0,0,0,.30),inset 0 2px 2px rgba(255,255,255,.25);
 text-shadow:0 1px 2px rgba(0,0,0,.25);
}
.next-btn.show{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.landscape-guide{display:none}
@media(orientation:landscape){
 .landscape-guide{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:#111}
 .landscape-guide-text{font-size:20px;font-weight:700;line-height:1.7;text-align:center;color:#fff}
}
@media(max-width:600px){
 :root{--card-size:min(82vw,360px);--card-top:13vh;--arrow-w:72px;--arrow-h:62px;--arrow-gap:44px;--arrow-top-gap:24px;--next-bottom:42px}
 .card-area{border-width:5px}
 .caption{width:84%;padding:10px 12px;font-size:14px;line-height:1.42}
 .next-btn{height:46px;min-width:110px;padding:0 18px;border-radius:13px;font-size:15px}
}
@media(max-width:390px){
 :root{--card-size:80vw;--card-top:12vh;--arrow-w:64px;--arrow-h:56px;--arrow-gap:36px;--arrow-top-gap:22px;--next-bottom:36px}
 .caption{font-size:13px;padding:9px 10px}
 .next-btn{height:44px;min-width:105px;padding:0 15px;font-size:14px}
}
.start-game-btn{
position:absolute;left:50%;top:calc(var(--card-top) + var(--card-size) + var(--arrow-top-gap));
transform:translateX(-50%);z-index:20;display:none;height:58px;min-width:220px;padding:0 28px;
border:3px solid #2d160b;border-radius:15px;background:#5b351d;color:#fffdf1;
font-family:"Gowun Dodum",sans-serif;font-size:20px;font-weight:900;line-height:1;white-space:nowrap;cursor:pointer;
box-shadow:0 5px 8px rgba(0,0,0,.30),inset 0 2px 2px rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.start-game-btn.show{display:block;animation:fadeUp .35s ease}
.start-game-btn:active{transform:translateX(-50%) translateY(2px) scale(.98)}
@media(max-width:600px){.start-game-btn{height:46px;min-width:180px;padding:0 18px;border-radius:13px;font-size:15px}}
@media(max-width:390px){.start-game-btn{height:44px;min-width:170px;padding:0 15px;font-size:14px}}



/* 이미지/영상 경계의 서브픽셀 흰선 제거 */
.card-area .story-img,
.card-area .story-media{
  inset:-1px !important;
  width:calc(100% + 2px) !important;
  height:calc(100% + 2px) !important;
}

</style>
</head>
<body>
<div class="landscape-guide"><div class="landscape-guide-text">📱<br>원활한 진행을 위해<br>세로 모드를 유지해 주세요.</div></div>
<div class="intro-wrap">
 <div class="card-area">
  <video id="introVideo" class="story-media" muted playsinline preload="auto"><source src="ptbt.mp4" type="video/mp4"></video>
  <img id="storyImg" class="story-media story-img" src="ptbin111.png" alt="인트로 이미지">
  <div id="caption" class="caption hidden"></div>
 </div>
 <div class="arrow-area video-mode" id="arrowArea">
  <button id="prevBtn" class="arrow-btn hidden" onclick="prevSlide()" aria-label="이전">
   <svg viewBox="0 0 120 96"><path class="arrow-shape" d="M84 10 Q92 15 92 26 L92 70 Q92 81 84 86 Q76 91 67 84 L22 54 Q13 48 22 42 L67 12 Q76 5 84 10 Z"/><path class="arrow-highlight" d="M78 18 Q84 21 84 28 L84 36 L39 48 L78 22 Z"/></svg>
  </button>
  <button id="nextArrowBtn" class="arrow-btn" onclick="nextSlide()" aria-label="다음">
   <svg viewBox="0 0 120 96"><path class="arrow-shape" d="M36 10 Q28 15 28 26 L28 70 Q28 81 36 86 Q44 91 53 84 L98 54 Q107 48 98 42 L53 12 Q44 5 36 10 Z"/><path class="arrow-highlight" d="M42 18 Q36 21 36 28 L36 36 L81 48 L42 22 Z"/></svg>
  </button>
 </div>
 <button id="startGameBtn" class="start-game-btn" type="button" onclick="beginSlides()">편지왔어요 게임 시작</button>
 <button id="nextPageBtn" class="next-btn" onclick="parent.postMessage({type:"PTB_NAV",page:'ptbm.html'},"*")">다음</button>
</div>
<script>
const slides=[
  {img:"ptbin111.png", text:"편지가 왔다는 연락을 받고<br>도서관으로 향했다.", tone:"gray"},
  {img:"ptbin111.png", text:"누군가 꼭 전달해달라며<br>편지를 맡기고 갔다고 했다.", tone:"gray"},
  {img:"ptbin111.png", text:"보낸 사람도 적혀 있지 않은 편지라니...<br>왠지 마음이 이상했다.", tone:"gray"},
  {img:"ptbin222.png", text:"왔구나.<br>오늘도 네 앞으로 온 편지가 있어.", tone:"brown"},
  {img:"ptbin333.png", text:"저한테 편지요...?<br>그리고... '오늘도'라고요?", tone:"brown"},
  {img:"ptbin222.png", text:"그래, 나도 자세한 건 몰라.<br>이 편지는 네가 도착하면<br>꼭 전해 달라고 부탁받았단다.", tone:"brown"},
  {img:"ptbin444.png", text:"처음 받아보는 편지인데...<br>이상하게 낯설지만은 않다.", tone:"gray"},
  {img:"ptbin555.png", text:"'오늘도'라는 말이<br>자꾸 마음에 걸린다.<br>일단 편지를 읽어봐야겠다.", tone:"gray"},
  {img:"ptbin555.png", text:"편지를 펼치는 순간,<br>손끝이 조금 떨렸다.<br>익숙한 글씨가 눈에 들어왔다.", tone:"gray"},
  {img:"ptbin555.png", text:"한 줄씩 읽어 내려갈수록<br>가슴이 두근거렸다.", tone:"gray"},
  {img:"ptbin333.png", text:"편지를 다 읽고 나서,<br>오늘은 편지의 이야기를<br>따라가봐야겠다고 생각했다.", tone:"gray"}
];
let current=0;
const video=document.getElementById("introVideo");
const img=document.getElementById("storyImg");
const caption=document.getElementById("caption");
const arrows=document.getElementById("arrowArea");
const prev=document.getElementById("prevBtn");
const next=document.getElementById("nextArrowBtn");
const nextPage=document.getElementById("nextPageBtn");
const startGameBtn=document.getElementById("startGameBtn");

function showSlide(){
 const s=slides[current];
 img.src=s.img;
 img.classList.add("show");
 caption.innerHTML=s.text;
 caption.className="caption "+s.tone;
 prev.classList.toggle("hidden",current===0);
 next.classList.toggle("hidden",current===slides.length-1);
 nextPage.classList.toggle("show",current===slides.length-1);
}
function nextSlide(){if(current<slides.length-1){current++;showSlide();}}
function prevSlide(){if(current>0){current--;showSlide();}}
function beginSlides(){
 video.pause();
 video.style.display="none";
 startGameBtn.classList.remove("show");
 arrows.classList.remove("video-mode");
 current=0;
 showSlide();
}
function startPage(){
 current=0;
 nextPage.classList.remove("show");
 startGameBtn.classList.remove("show");
 arrows.classList.add("video-mode");
 caption.className="caption hidden";
 img.classList.remove("show");
 video.style.display="block";
 video.currentTime=0;
 const p=video.play();
 if(p) p.catch(function(){
  startGameBtn.classList.add("show");
});
}
video.addEventListener("ended",function(){
 /* 마지막 프레임을 그대로 유지한 채 시작 버튼만 표시 */
 startGameBtn.classList.add("show");
});
window.addEventListener("load",startPage);
window.addEventListener("pageshow",function(e){if(e.persisted)startPage();});
</script>
</body>
</html>
