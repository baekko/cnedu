<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MBS SLIDE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
  position:relative;
  background:url("mbs.png") no-repeat center center / cover;
}

/*
  이미지 원본 비율: 250 × 400
  가로÷세로 = 0.625
*/
:root{
  --slide-ratio:250 / 400;

  --arrow-width:clamp(58px,18vw,92px);
  --arrow-height:clamp(48px,15vw,76px);

  --safe-top:max(14px,env(safe-area-inset-top));
  --safe-bottom:max(8px,env(safe-area-inset-bottom));
}

.slide-wrap{
  position:relative;
  width:100%;
  height:100%;
  min-height:100svh;
}


/* =========================================================
   250×400 이미지 영역
========================================================= */

.card-area{
  position:absolute;
  left:50%;
  top:var(--safe-top);

  transform:translateX(-50%);

  width:min(
    92vw,
    calc((100svh - 125px - var(--safe-top)) * 0.625),
    625px
  );

  aspect-ratio:250 / 400;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:5;
}


/* 원본 이미지 전체 표시 */

.story-img{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  user-select:none;
  -webkit-user-drag:none;
}


/* =========================================================
   하단 화살표 + 페이지 표시
========================================================= */

.arrow-area{
  position:fixed;

  left:50%;
  bottom:calc(var(--safe-bottom) + 2px);

  transform:translateX(-50%);

  display:grid;

  grid-template-columns:
    var(--arrow-width)
    auto
    var(--arrow-width);

  align-items:center;

  column-gap:18px;

  z-index:20;
}


/* =========================================================
   페이지 표시 박스
========================================================= */

.page-indicator{
  min-width:84px;

  height:46px;

  padding:0 14px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    3px solid
    #2d160b;

  border-radius:10px;

  background:
    rgba(255,247,232,.96);

  color:
    #5b351d;

  font-size:18px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;

  box-shadow:
    0 6px 10px
    rgba(0,0,0,.32);
}


/* =========================================================
   화살표 버튼
========================================================= */

.arrow-btn{
  width:var(--arrow-width);
  height:var(--arrow-height);

  border:none;
  padding:0;

  background:transparent;

  cursor:pointer;

  position:relative;

  transition:transform .15s ease;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;
}


.arrow-btn:active{
  transform:scale(.92);
}


.arrow-btn svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(0 7px 8px rgba(0,0,0,.42))
    drop-shadow(0 2px 2px rgba(0,0,0,.35));
}


.arrow-shape{
  fill:#5b351d;

  stroke:#2d160b;

  stroke-width:3;
}


.arrow-highlight{
  fill:rgba(255,255,255,.22);
}


.arrow-btn.hidden{
  visibility:hidden;

  pointer-events:none;
}


/* =========================================================
   가로가 매우 좁은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{
    --arrow-width:58px;
    --arrow-height:48px;
  }


  .card-area{
    width:min(
      91vw,
      calc((100svh - 105px - var(--safe-top)) * 0.625)
    );
  }


  .arrow-area{
    column-gap:12px;
  }


  .page-indicator{
    min-width:72px;

    height:40px;

    padding:0 10px;

    border-width:2px;

    border-radius:8px;

    font-size:16px;
  }

}


/* =========================================================
   화면 높이가 짧은 휴대폰
========================================================= */

@media(max-height:700px){

  :root{
    --arrow-width:54px;
    --arrow-height:45px;
  }


  .card-area{
    width:min(
      88vw,
      calc((100svh - 92px - var(--safe-top)) * 0.625)
    );
  }


  .page-indicator{
    height:38px;

    min-width:68px;

    font-size:15px;
  }

}


/* =========================================================
   태블릿 및 큰 화면
========================================================= */

@media(min-width:768px){

  .card-area{
    width:min(
      72vw,
      calc((100svh - 145px - var(--safe-top)) * 0.625),
      625px
    );
  }


  .arrow-area{
    column-gap:28px;
  }


  .page-indicator{
    min-width:94px;

    height:50px;

    font-size:20px;
  }

}

</style>
</head>

<body>

<div class="slide-wrap">


  <!-- =====================================================
       스토리 이미지
  ===================================================== -->

  <div class="card-area">

    <img
      id="storyImg"
      class="story-img"
      src="mbs1.png"
      alt="이야기 이미지 1"
    >

  </div>


  <!-- =====================================================
       화살표 + 페이지 표시
  ===================================================== -->

  <div class="arrow-area">


    <!-- 이전 -->

    <button
      id="prevBtn"
      class="arrow-btn hidden"
      type="button"
      onclick="prevSlide()"
      aria-label="이전 이미지"
    >

      <svg
        viewBox="0 0 120 96"
        aria-hidden="true"
      >

        <path
          class="arrow-shape"
          d="
          M84 10
          Q92 15 92 26
          L92 70
          Q92 81 84 86
          Q76 91 67 84
          L22 54
          Q13 48 22 42
          L67 12
          Q76 5 84 10 Z
          "
        />

        <path
          class="arrow-highlight"
          d="
          M78 18
          Q84 21 84 28
          L84 36
          L39 48
          L78 22 Z
          "
        />

      </svg>

    </button>


    <!-- 페이지 표시 -->

    <div
      id="pageIndicator"
      class="page-indicator"
      aria-live="polite"
    >
      1 / 29
    </div>


    <!-- 다음 -->

    <button
      id="nextBtn"
      class="arrow-btn"
      type="button"
      onclick="nextSlide()"
      aria-label="다음 이미지"
    >

      <svg
        viewBox="0 0 120 96"
        aria-hidden="true"
      >

        <path
          class="arrow-shape"
          d="
          M36 10
          Q28 15 28 26
          L28 70
          Q28 81 36 86
          Q44 91 53 84
          L98 54
          Q107 48 98 42
          L53 12
          Q44 5 36 10 Z
          "
        />

        <path
          class="arrow-highlight"
          d="
          M42 18
          Q36 21 36 28
          L36 36
          L81 48
          L42 22 Z
          "
        />

      </svg>

    </button>


  </div>

</div>


<script>

const TOTAL_SLIDES = 29;

let currentSlide = 1;


const storyImg =
  document.getElementById(
    "storyImg"
  );


const prevBtn =
  document.getElementById(
    "prevBtn"
  );


const nextBtn =
  document.getElementById(
    "nextBtn"
  );


const pageIndicator =
  document.getElementById(
    "pageIndicator"
  );


/* =========================================================
   슬라이드 갱신
========================================================= */

function updateSlide(){

  storyImg.src =
    `mbs${currentSlide}.png`;


  storyImg.alt =
    `이야기 이미지 ${currentSlide}`;


  /*
    페이지 번호
    1 / 29
    2 / 29
    ...
  */

  pageIndicator.textContent =
    `${currentSlide} / ${TOTAL_SLIDES}`;


  /*
    첫 페이지에서는 이전 버튼 숨김
  */

  prevBtn
    .classList
    .toggle(
      "hidden",
      currentSlide === 1
    );


  /*
    마지막 페이지에서는 다음 버튼 숨김
  */

  nextBtn
    .classList
    .toggle(
      "hidden",
      currentSlide === TOTAL_SLIDES
    );

}


/* =========================================================
   다음
========================================================= */

function nextSlide(){

  if(
    currentSlide >= TOTAL_SLIDES
  ){

    return;

  }


  currentSlide++;

  updateSlide();

}


/* =========================================================
   이전
========================================================= */

function prevSlide(){

  if(
    currentSlide <= 1
  ){

    return;

  }


  currentSlide--;

  updateSlide();

}


/* =========================================================
   페이지를 새로 열면 첫 이미지부터
========================================================= */

window.addEventListener(
  "pageshow",
  function(){

    currentSlide = 1;

    updateSlide();

  }
);


/* =========================================================
   다음 이미지 미리 불러오기
========================================================= */

storyImg.addEventListener(
  "load",
  function(){

    const nextNumber =
      currentSlide + 1;


    if(
      nextNumber <= TOTAL_SLIDES
    ){

      const preloadImage =
        new Image();


      preloadImage.src =
        `mbs${nextNumber}.png`;

    }

  }
);


updateSlide();

</script>

</body>
</html>
