<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;

  background:#000;
}

:root{
  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#784738;

  --blue:#235a9e;
  --orange:#ff884d;

  --button:#5a321d;

  --ui-bottom:5.5vh;
}


/* =========================================================
   배경
========================================================= */

body{
  position:relative;

  background:
    url("ptbq5.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   미션카드
========================================================= */

.mission-wrap{
  position:fixed;

  left:50%;
  top:43%;

  transform:
    translate(-50%,-50%);

  width:
    min(86vw,620px);

  display:none;

  z-index:25;
}

.mission-wrap.show{
  display:block;
}

.mission-card{
  width:100%;

  padding:
    30px 28px 27px;

  border:
    5px solid
    var(--paper-border);

  border-radius:
    28px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 14px 30px
    rgba(0,0,0,.30);
}


/* =========================================================
   제목
========================================================= */

.mission-title{
  color:
    var(--paper-text);

  font-size:28px;
  font-weight:900;

  line-height:1.4;

  margin-bottom:20px;

  word-break:keep-all;
}


/* =========================================================
   키트
========================================================= */

.mission-kit{
  color:
    var(--blue);

  font-size:30px;
  font-weight:900;

  margin-bottom:22px;
}


/* =========================================================
   이미지 박스
========================================================= */

.mission-image-box{
  width:100%;

  padding:7px;

  margin-bottom:20px;

  border:
    5px solid
    var(--orange);

  border-radius:10px;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.mission-image{
  display:block;

  width:100%;
  height:auto;

  max-height:125px;

  object-fit:contain;
}


/* =========================================================
   정답 안내
========================================================= */

.mission-guide{
  color:#000;

  font-size:30px;
  font-weight:900;

  line-height:1.35;
}


/* =========================================================
   입력 UI
========================================================= */

.ui-wrap{
  position:fixed;

  left:50%;
  bottom:
    var(--ui-bottom);

  transform:
    translateX(-50%);

  width:
    clamp(420px,56vw,560px);

  z-index:35;

  display:none;

  flex-direction:column;

  gap:14px;
}

.ui-wrap.show{
  display:flex;
}

.answer-row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    86px;

  gap:12px;
}

.answer-input{
  width:100%;
  height:58px;

  border:none;
  border-radius:14px;

  padding:
    0 18px;

  outline:none;

  background:
    rgba(255,255,255,.97);

  color:#222;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;
  font-weight:700;

  box-shadow:
    0 8px 18px
    rgba(0,0,0,.25);
}

.submit-btn{
  height:58px;

  border:none;
  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:18px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}


/* =========================================================
   힌트 / 정답 / 기억보상
========================================================= */

.action-row{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}

.action-btn{
  height:54px;

  border:none;
  border-radius:14px;

  padding:0;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:17px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 16px rgba(0,0,0,.32),
    inset 0 2px 2px rgba(255,255,255,.22),
    inset 0 -4px 8px rgba(0,0,0,.25);
}

.submit-btn:active,
.action-btn:active{
  transform:
    translateY(2px)
    scale(.98);
}

.action-btn:disabled{
  opacity:.42;
  cursor:default;
}


/* =========================================================
   일반 모달
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:
    min(86vw,560px);

  padding:
    30px 24px;

  border-radius:22px;

  background:
    var(--paper);

  text-align:center;

  box-shadow:
    0 18px 40px
    rgba(0,0,0,.35);
}

.modal-title{
  color:#2b160c;

  font-size:28px;
  font-weight:900;

  margin-bottom:18px;
}

.modal-content{
  color:#2b160c;

  font-size:22px;
  font-weight:700;

  line-height:1.6;

  white-space:pre-line;
  word-break:keep-all;
}

.modal-close{
  height:50px;
  min-width:100px;

  margin-top:22px;

  padding:
    0 24px;

  border:none;
  border-radius:14px;

  background:
    var(--button);

  color:#fff;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}



/* HTML 편지 모달 */
.letter-modal{position:fixed;inset:0;z-index:150;display:none;justify-content:center;align-items:center;padding:18px;background:rgba(0,0,0,.55)}
.letter-modal.show{display:flex;animation:letterFade .28s ease}
.letter-paper{position:relative;width:min(88vw,520px);height:min(76vh,700px);min-height:560px;padding:118px 46px 82px;overflow:hidden;background:linear-gradient(rgba(255,250,240,.78),rgba(248,237,217,.78)),radial-gradient(circle at 25% 20%,rgba(150,105,60,.08),transparent 34%),radial-gradient(circle at 75% 72%,rgba(150,105,60,.07),transparent 38%),#f6ead6;border:1px solid #c7a37d;border-radius:5px;box-shadow:0 20px 45px rgba(0,0,0,.42),inset 0 0 35px rgba(130,85,45,.08);animation:letterOpen .38s ease}
.letter-paper:before{content:"";position:absolute;inset:15px;border:1px solid rgba(166,116,68,.55);pointer-events:none}
.letter-top{position:absolute;top:7%;left:50%;transform:translateX(-50%);color:#a77a50;font-size:28px;letter-spacing:.14em;white-space:nowrap}
.letter-content{position:relative;z-index:2;color:#2d2925;font-family:"Nanum Pen Script","Gowun Dodum",sans-serif;font-size:30px;font-weight:400;line-height:1.42;letter-spacing:.015em;display:block;height:auto;white-space:pre-line;word-break:keep-all;text-align:left}
.letter-bottom{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);color:#b58a61;font-size:18px;letter-spacing:.18em;white-space:nowrap}
.letter-close{position:absolute;right:8%;bottom:8%;z-index:4;height:42px;min-width:76px;padding:0 17px;border:none;border-radius:13px;background:var(--button);color:#fff;font-family:"Gowun Dodum",sans-serif;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.28)}
@keyframes letterOpen{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes letterFade{from{opacity:0}to{opacity:1}}
@keyframes missionReveal{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes uiReveal{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mission-wrap.show{display:block;animation:missionReveal .38s ease both}.ui-wrap.show{display:flex;animation:uiReveal .38s ease both}

/* =========================================================

========================================================= */

}

@keyframes shake{

  0%{
    transform:
      translateX(-50%)
      translateX(0);
  }

  25%{
    transform:
      translateX(-50%)
      translateX(-6px);
  }

  50%{
    transform:
      translateX(-50%)
      translateX(6px);
  }

  75%{
    transform:
      translateX(-50%)
      translateX(-4px);
  }

  100%{

      translateX(0);
  }
}

/* =========================================================

<script>

/* =========================================================
   문제 설정
========================================================= */

const missionConfig={

  missionNumber:5,

  correctAnswer:"4795",

  hintText:
    "동물들은 글자를 하나씩 품고 있습니다.",

  answerText:
    "4795",

  bgImage:
    "ptbq5.png",

  introLetter:
    `태웅이는 곰이 되어 보고 나서야,
변하는 건 모습일 뿐.
마음은 그대로라는 걸 알게 되었다.
그렇다면 기억이 사라져도,
마음은 그대로 남아 있을 수 있을까?`,

  correctLetter:
    `어제와 다른 하루가 시작되어도,
이곳에 오면 
다시 나를 찾을 수 있었다.
이곳에서만큼은 
늘 나답게 웃을 수 있었다.`

};


/* =========================================================
   저장
========================================================= */

const PROGRESS_KEY=
  "ptb_progress_v1";

let usedHint=false;
let usedAnswer=false;
let locked=false;

let pendingScore=null;

let letterModalMode=
  "intro";


function getProgress(){

  try{

    return JSON.parse(
      localStorage.getItem(
        PROGRESS_KEY
      )
    ) || {};

  }

  catch(e){

    return {};

  }

}


function setProgress(progress){

  localStorage.setItem(
    PROGRESS_KEY,
    JSON.stringify(progress)
  );

}
function saveUsageState(){
  const progress=getProgress(), n=missionConfig.missionNumber, old=progress[n]||{};
  if(old.completed===true) return;
  progress[n]={completed:false,usedHint:usedHint,usedAnswer:usedAnswer};
  setProgress(progress);
}
function loadUsageState(){
  const saved=getProgress()[missionConfig.missionNumber];
  if(!saved) return;
  usedHint=saved.usedHint===true;
  usedAnswer=saved.usedAnswer===true;
  if(usedHint) document.getElementById("answerBtn").disabled=false;
}


/* =========================================================
   정답 비교
========================================================= */

function normalize(text){

  return String(text)
    .replace(/\s+/g,"")
    .trim()
    .toLowerCase();

}


/* =========================================================
   점수
========================================================= */

function currentScore(){

  if(usedAnswer){
    return 0;
  }

  if(usedHint){
    return 10;
  }

  return 20;

}


/* =========================================================
   결과 저장
========================================================= */

function saveResult(score){
  const progress=getProgress(), n=missionConfig.missionNumber, old=progress[n]||{};
  if(old.completed===true) return false;
  progress[n]={completed:true,score:score,usedHint:usedHint,usedAnswer:usedAnswer};
  setProgress(progress);
  return true;
}


/* =========================================================
   일반 모달
========================================================= */

function openModal(title,content){

  document
    .getElementById("modalTitle")
    .textContent=title;

  document
    .getElementById("modalContent")
    .textContent=content;

  document
    .getElementById("infoModal")
    .classList
    .add("show");

}


function closeModal(){

  document
    .getElementById("infoModal")
    .classList
    .remove("show");

}


/* =========================================================
   HTML 편지
========================================================= */
function openLetterModal(content,mode){
  letterModalMode=mode;
  document.getElementById("letterContent").textContent=content;
  document.getElementById("letterModal").classList.add("show");
}
function closeLetterModal(){
  document.getElementById("letterModal").classList.remove("show");
  if(letterModalMode==="intro"){
    requestAnimationFrame(showMission);
    return;
  }
  if(letterModalMode==="correct" && pendingScore!==null){
    const score=pendingScore; pendingScore=null;
    if(score===0){location.href="ptbm.html";return;}
    playVideoAndReturn(score);
  }
}

/* =========================================================
   미션 표시
========================================================= */

function showMission(){

  document
    .getElementById("missionWrap")
    .classList
    .add("show");

  document
    .getElementById("uiWrap")
    .classList
    .add("show");

}


/* =========================================================
   미션 숨김
========================================================= */

function hideMission(){

  document
    .getElementById("missionWrap")
    .classList
    .remove("show");

  document
    .getElementById("uiWrap")
    .classList
    .remove("show");

}


/* =========================================================
   힌트
========================================================= */

function showHint(){

  if(locked){
    return;
  }

  usedHint=true;

  saveUsageState();

  document
    .getElementById("answerBtn")
    .disabled=false;

  openModal(
    "힌트",
    missionConfig.hintText
  );

}


/* =========================================================
   정답보기
========================================================= */

function showAnswer(){

  if(locked){
    return;
  }

  if(!usedHint){
    return;
  }

  usedAnswer=true;

  saveUsageState();

  openModal(
    "정답",
    missionConfig.answerText
  );

}


/* =========================================================
   기억보상
========================================================= */

function getTotalScore(){

  const progress=
    getProgress();

  let total=0;

  for(let i=1;i<=5;i++){

    if(
      progress[i]
      &&
      progress[i].completed
    ){

      total +=
        Number(
          progress[i].score || 0
        );

    }

  }

  return total;

}


function showScore(){

  openModal(
    "기억보상",
    `현재까지 모은 기억보상은 ${getTotalScore()}입니다.`
  );

}


/* =========================================================
   정답 확인
========================================================= */

function checkAnswer(){

  if(locked){
    return;
  }

  const input=
    document
      .getElementById("answerInput")
      .value;


  if(!input.trim()){

    openModal(
      "안내",
      "정답을 입력해주세요."
    );

    return;
  }


  if(
    normalize(input)
    ===
    normalize(
      missionConfig.correctAnswer
    )
  ){

    locked=true;

    const existingResult=getProgress()[missionConfig.missionNumber];
    if(existingResult && existingResult.completed===true){
      location.href="ptbm.html";
      return;
    }
    pendingScore=currentScore();
    saveResult(pendingScore);

    closeModal();

    hideMission();


    /*
      2초 후 성공 편지
    */

    setTimeout(
      function(){

        openLetterModal(missionConfig.correctLetter,"correct");

      },
      2000
    );

    return;
  }


  /* 오답 */

  const ui=
    document.getElementById("uiWrap");

  ui.classList.remove("shake");

  void ui.offsetWidth;

  ui.classList.add("shake");

  openModal(
    "오답",
    "정답이 아닙니다."
  );

}


/* =========================================================
   점수별 영상

   20점 = ptbq1.mp4
   10점 = ptbq2.mp4
   0점  = 영상 없음
========================================================= */

function getVideoSrc(score){

  if(score === 20){
    return "ptbq1.mp4";
  }

  if(score === 10){
    return "ptbq2.mp4";
  }

  return "";
}


/* =========================================================
   영상 재생 후 메인으로
========================================================= */

function playVideoAndReturn(score){

  const videoModal=
    document.getElementById("videoModal");

  const video=
    document.getElementById("resultVideo");


  videoModal
    .classList
    .add("show");


  video.src=
    getVideoSrc(score);


  video.onended=function(){

    location.href=
      "ptbm.html";

  };


  /*
    영상 자체에 문제가 생겨도
    별도 문구 없이 메인으로 이동
  */

  video.onerror=function(){

    location.href=
      "ptbm.html";

  };


  video.load();


  const playPromise=
    video.play();


  if(playPromise !== undefined){

    playPromise.catch(
      function(){

        location.href=
          "ptbm.html";

      }
    );

  }

}


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById("answerInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        checkAnswer();
      }

    }
  );


/* =========================================================
   최초 실행
========================================================= */

document.body.style.backgroundImage=
  `url("${missionConfig.bgImage}")`;


loadUsageState();
setTimeout(function(){
  openLetterModal(missionConfig.introLetter,"intro");
},1000);

</script>

</body>
</html>
