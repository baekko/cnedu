<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY THE BOOK TITLE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
}

.video-bg{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  background:#000;
}

.video-bg video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.next-btn{
  position:fixed;
  left:50%;
  bottom:clamp(45px,7vh,90px);
  transform:translateX(-50%);
  z-index:20;
  display:none;

  border:none;
  border-radius:999px;
  padding:16px 48px;

  background:linear-gradient(#7c492c,#5a321d);
  color:#fff8e8;

  font-size:clamp(20px,2.5vw,30px);
  font-weight:900;
  cursor:pointer;

  box-shadow:
    0 12px 24px rgba(0,0,0,.38),
    inset 0 2px 2px rgba(255,255,255,.26),
    inset 0 -5px 9px rgba(0,0,0,.25);

  -webkit-tap-highlight-color:transparent;
}

.next-btn.show{
  display:block;
  animation:fadeUp .35s ease;
}

.next-btn:active{
  transform:translateX(-50%) scale(.96);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(14px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

@media(max-width:600px){
  .next-btn{
    bottom:35px;
    padding:13px 36px;
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="video-bg">
  <video id="bgVideo" muted playsinline>
    <source src="ptbt.mp4" type="video/mp4">
  </video>
</div>

<button id="nextBtn" class="next-btn" onclick="goNext()">다음</button>

<script>
const video = document.getElementById("bgVideo");
const nextBtn = document.getElementById("nextBtn");

let nextTimer = null;

function startPage(){
  nextBtn.classList.remove("show");

  clearTimeout(nextTimer);

  video.pause();
  video.currentTime = 0;

  video.play().catch(function(){
    // 모바일에서 자동재생이 막히는 경우에도 버튼은 12초 후 표시
  });

  nextTimer = setTimeout(function(){
    nextBtn.classList.add("show");
  }, 12000);
}

video.addEventListener("ended", function(){
  video.pause();
});

function goNext(){
  location.href = "https://baekko.github.io/cnedu/ptbin.html";
}

window.addEventListener("load", startPage);

window.addEventListener("pageshow", function(){
  startPage();
});
</script>

</body>
</html>
