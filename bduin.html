<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RABBIT HOLE INTRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

/* =========================================================
   기본
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;

  font-family:
    "Gowun Dodum",
    sans-serif;

  background:#000;
}


/* =========================================================
   공통 변수
========================================================= */

:root{

  --green:#4f7d32;
  --green-light:#79a94d;
  --green-dark:#29451b;

  /* 대화창 너비 */
  --talk-width:min(88vw,600px);

  /* 화살표 위치 */
  --control-bottom:31vh;

  /* 화살표 크기 */
  --arrow-w:82px;
  --arrow-h:68px;

  /*
    ★ 화살표 아래 → 말박스 사이 간격

    화살표 높이 68px의 절반 정도
  */
  --talk-gap:34px;

  /* 마지막 다음 버튼 */
  --next-bottom:5vh;

  /* 말박스 색 */
  --paper:#f4ecd1;
  --paper-border:#7f4b3a;
  --paper-text:#8c4a2e;
}


/* =========================================================
   배경
========================================================= */

body{
  position:relative;

  background:
    url("bduin1.png")
    no-repeat
    center center / cover;
}


/* =========================================================
   화살표 영역

   ★ 위치는 bduq와 동일
========================================================= */

.talk-controls{

  position:fixed;

  left:50%;
  bottom:var(--control-bottom);

  transform:translateX(-50%);

  width:var(--talk-width);
  height:var(--arrow-h);

  display:none;

  align-items:center;
  justify-content:space-between;

  z-index:40;
}


.talk-controls.show{

  display:flex;

  animation:
    fadeSimple .35s ease;
}


/* =========================================================
   대화창

   ★ 핵심 수정

   기존:
   bottom 기준

   변경:
   화살표 하단을 기준으로
   일정한 간격 아래에서 시작

   따라서 글이 1줄이든 5줄이든
   말박스 윗부분 위치가 동일함.
========================================================= */

.talk-box-wrap{

  position:fixed;

  left:50%;

  /*
    화살표의 아래쪽 위치:
    100dvh - control-bottom

    거기서 talk-gap 만큼 더 내려감.
  */
  top:
    calc(
      100dvh
      - var(--control-bottom)
      + var(--talk-gap)
    );

  bottom:auto;

  transform:
    translateX(-50%);

  width:var(--talk-width);

  display:none;

  z-index:30;
}


.talk-box-wrap.show{

  display:block;

  animation:
    fadeSimple .35s ease;
}


/* =========================================================
   말박스
========================================================= */

.talk-box{

  width:100%;

  padding:
    22px 25px;

  border:
    3px solid
    var(--paper-border);

  background:
    rgba(244,236,209,.97);

  color:
    var(--paper-text);

  font-size:23px;

  font-weight:700;

  line-height:1.55;

  word-break:keep-all;

  /*
    줄바꿈은 유지하지만
    코드에 빈 줄이 없으면
    중간에 이상한 한 줄 공백이 생기지 않음.
  */
  white-space:pre-line;

  box-shadow:
    0 7px 14px
    rgba(0,0,0,.22);
}


/* =========================================================
   화살표 버튼
========================================================= */

.arrow-btn{

  width:var(--arrow-w);
  height:var(--arrow-h);

  flex:
    0 0 var(--arrow-w);

  border:none;

  background:transparent;

  padding:0;

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

  transition:
    transform .15s ease;
}


.arrow-btn:hover{

  transform:
    translateY(-2px)
    scale(1.03);
}


.arrow-btn:active{

  transform:
    translateY(2px)
    scale(.94);
}


.arrow-btn svg{

  width:100%;
  height:100%;

  display:block;

  filter:

    drop-shadow(
      0 7px 8px
      rgba(0,0,0,.40)
    )

    drop-shadow(
      0 2px 2px
      rgba(0,0,0,.30)
    );
}


.arrow-shape{

  fill:
    var(--green);

  stroke:
    var(--green-dark);

  stroke-width:3;
}


.arrow-highlight{

  fill:
    rgba(255,255,255,.25);
}


.arrow-btn.hidden{

  visibility:hidden;

  pointer-events:none;
}


/* =========================================================
   마지막 다음 버튼

   ★ 화살표 영역에서 완전히 분리
   ★ 화면 하단 중앙
========================================================= */

.next-page-btn{

  position:fixed;

  left:50%;
  bottom:var(--next-bottom);

  transform:
    translateX(-50%);

  z-index:60;

  display:none;

  height:58px;

  min-width:130px;

  padding:
    0 28px;

  border:
    3px solid
    var(--green-dark);

  border-radius:15px;

  background:
    var(--green);

  color:#fffdf1;

  font-family:
    "Gowun Dodum",
    sans-serif;

  font-size:20px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;

  cursor:pointer;

  box-shadow:

    0 7px 8px
    rgba(0,0,0,.35),

    0 2px 2px
    rgba(0,0,0,.25),

    inset 0 2px 2px
    rgba(255,255,255,.25);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.25);

  -webkit-tap-highlight-color:
    transparent;

  transition:
    transform .15s ease;
}


.next-page-btn.show{

  display:block;

  animation:
    fadeSimple .35s ease;
}


.next-page-btn:hover{

  transform:
    translateX(-50%)
    translateY(-2px)
    scale(1.03);
}


.next-page-btn:active{

  transform:
    translateX(-50%)
    translateY(2px)
    scale(.94);
}


/* =========================================================
   애니메이션
========================================================= */

@keyframes fadeSimple{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}


/* =========================================================
   휴대폰

   ★ bduq와 동일한 화살표 크기/위치
========================================================= */

@media(max-width:600px){

  :root{

    --talk-width:
      min(92vw,360px);

    --control-bottom:28vh;

    --arrow-w:58px;

    --arrow-h:48px;

    /*
      휴대폰 화살표 높이 48px
      → 절반 24px
    */
    --talk-gap:24px;

    --next-bottom:
      calc(
        3vh
        +
        env(safe-area-inset-bottom)
      );
  }


  .talk-box{

    padding:
      15px 17px;

    border-width:2px;

    font-size:16px;

    line-height:1.5;

    box-shadow:
      0 5px 10px
      rgba(0,0,0,.22);
  }


  .next-page-btn{

    height:46px;

    min-width:100px;

    padding:
      0 18px;

    border-width:3px;

    border-radius:13px;

    font-size:15px;

    box-shadow:

      0 6px 7px
      rgba(0,0,0,.32),

      0 2px 2px
      rgba(0,0,0,.22),

      inset 0 2px 2px
      rgba(255,255,255,.25);
  }

}


/* =========================================================
   작은 휴대폰
========================================================= */

@media(max-width:390px){

  :root{

    --talk-width:92vw;

    --control-bottom:27vh;

    --arrow-w:54px;

    --arrow-h:45px;

    --talk-gap:22px;
  }


  .talk-box{

    font-size:15px;

    padding:
      13px 15px;
  }


  .next-page-btn{

    height:44px;

    min-width:94px;

    padding:
      0 15px;

    font-size:14px;
  }

}


/* =========================================================
   높이가 낮은 휴대폰
========================================================= */

@media(max-height:700px){

  .talk-box{

    font-size:14px;

    line-height:1.4;

    padding:
      11px 14px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     화살표
===================================================== -->

<div
  class="talk-controls"
  id="talkControls"
>


  <!-- 왼쪽 -->

  <button
    id="prevTalkBtn"
    class="arrow-btn hidden"
    type="button"
    onclick="prevTalk()"
    aria-label="이전"
  >

    <svg
      viewBox="0 0 120 96"
      aria-hidden="true"
    >

      <path
        class="arrow-shape"
        d="
        M84 10
        Q92 15 92 26
        L92 70
        Q92 81 84 86
        Q76 91 67 84
        L22 54
        Q13 48 22 42
        L67 12
        Q76 5 84 10 Z
        "
      />

      <path
        class="arrow-highlight"
        d="
        M78 18
        Q84 21 84 28
        L84 36
        L39 48
        L78 22 Z
        "
      />

    </svg>

  </button>


  <!-- 오른쪽 -->

  <button
    id="nextTalkBtn"
    class="arrow-btn"
    type="button"
    onclick="nextTalk()"
    aria-label="다음"
  >

    <svg
      viewBox="0 0 120 96"
      aria-hidden="true"
    >

      <path
        class="arrow-shape"
        d="
        M36 10
        Q28 15 28 26
        L28 70
        Q28 81 36 86
        Q44 91 53 84
        L98 54
        Q107 48 98 42
        L53 12
        Q44 5 36 10 Z
        "
      />

      <path
        class="arrow-highlight"
        d="
        M42 18
        Q36 21 36 28
        L36 36
        L81 48
        L42 22 Z
        "
      />

    </svg>

  </button>

</div>


<!-- =====================================================
     대화창
===================================================== -->

<div
  class="talk-box-wrap"
  id="talkBoxWrap"
>

  <div
    class="talk-box"
    id="talkBox"
  ></div>

</div>


<!-- =====================================================
     마지막 다음 버튼

     ★ 화살표 영역 밖
===================================================== -->

<button
  id="nextPageBtn"
  class="next-page-btn"
  type="button"
  onclick="goNextPage()"
>
  다음
</button>


<script>

/* =========================================================
   1장
   bduin1.png
========================================================= */

const scene1Talks = [

  `교실 뒤편 벽에 걸려 있는 커다란 금빛 거울.
평소엔 그저 평범한 거울이었어.`,

  `그런데 며칠 전부터 내 친구가
쉬는 시간만 되면 혼자 거울 앞에 서서
한참 동안 거울 속을 바라보는 것이었어.`,

  `“너 거기서 뭐 해?”
물어봐도 친구는 대답하지 않았어.`,

  `그러던 어느 날,
친구가 거울을 향해 작은 목소리로 무언가를 말했어.`,

  `그리고 잠깐 다른 곳을 바라본 사이
친구가 사라졌어.`,

  `교실에도, 복도에도 없었어.
가방과 책은 그대로인데 친구만 흔적도 없이
사라졌어.`,

  `그날 이후 나는 자꾸만 친구가 마지막으로 서 있던
거울이 신경 쓰였어.`,

  `교실 뒤의 오래된 금빛 거울.
혹시 친구가 사라진 이유가
저 거울과 관련 있는 건 아닐까?`

];


/* =========================================================
   2장
   bduin2.png
========================================================= */

const scene2Talks = [

  `친구를 찾기 위해 천천히 거울 앞으로 다가갔어.
그리고 한참 거울을 바라봤어.`,

  `아무 일도 일어나지 않아 자리를 뜨려 한 그 순간,
그 녀석이 나타났어.`

];


/* =========================================================
   3장
   bduin3.png
========================================================= */

const scene3Talks = [

  /*
    ★ 기존 코드에 있던 빈 줄 제거
  */

  `“놀라지 마. 이 거울은 ‘래빗홀’이야.
너희와 나의 신비한 세계를 이어 주는 문이지.”
“내 친구 어디 있어? 네가 데려갔지?”
우리는 토끼를 보자마자 다급하게 물었어.`,

  `“데려간 건 맞지만, 납치한 건 아니야!
네 친구는 매일 이 거울 앞에서
거울 너머에는 무엇이 있는지 궁금해했어.
그래서 내가 특별히 래빗홀의 모험에 초대했지.
지금은 신나게 이곳저곳을 여행하고 있을걸?”`,

  `하지만 우리는 믿을 수 없었어.
“거짓말하지 마. 내 친구 돌려보내!”`,

  `“정 못 믿겠으면 너희가 직접 들어와서
친구를 데려가.
토끼가 거울 너머로 손짓했다.
대신 한 가지 규칙이 있어.”`,

  `“래빗홀에 한번 들어오면 마음대로 나갈 수 없어.
이곳에는 여러 개의 신비한 장소가 있고,
그곳에 숨겨진 문제를 하나씩 해결해야
다음 장소로 이동할 수 있거든.”`,

  `“모든 문제를 풀고 친구를 찾으면
다시 이곳으로 돌아올 수 있어.”`,

  `잠시 망설였지만 선택지는 없었어.
친구를 찾으려면, 래빗홀로 들어가야 했어.
우리는 천천히 거울을 향해 손을 뻗었어.`

];


/* =========================================================
   현재 상태
========================================================= */

let currentScene = 1;

let currentTalk = 0;


/* =========================================================
   요소
========================================================= */

const talkBoxWrap =
  document.getElementById(
    "talkBoxWrap"
  );

const talkBox =
  document.getElementById(
    "talkBox"
  );

const talkControls =
  document.getElementById(
    "talkControls"
  );

const prevTalkBtn =
  document.getElementById(
    "prevTalkBtn"
  );

const nextTalkBtn =
  document.getElementById(
    "nextTalkBtn"
  );

const nextPageBtn =
  document.getElementById(
    "nextPageBtn"
  );


/* =========================================================
   현재 대화
========================================================= */

function getCurrentTalks(){

  if(currentScene === 1){

    return scene1Talks;

  }


  if(currentScene === 2){

    return scene2Talks;

  }


  return scene3Talks;

}


/* =========================================================
   배경 변경
========================================================= */

function updateBackground(){

  document
    .body
    .style
    .backgroundImage =
      `url("bduin${currentScene}.png")`;

}


/* =========================================================
   대화 표시
========================================================= */

function showTalk(){

  const talks =
    getCurrentTalks();


  talkBox.textContent =
    talks[currentTalk];


  talkBoxWrap
    .classList
    .add(
      "show"
    );


  talkControls
    .classList
    .add(
      "show"
    );


  updateControls();

}


/* =========================================================
   버튼 상태
========================================================= */

function updateControls(){

  const talks =
    getCurrentTalks();


  /* =====================================================
     왼쪽 버튼

     전체 이야기의 첫 장 첫 대사에서만 숨김
  ===================================================== */

  if(
    currentScene === 1
    &&
    currentTalk === 0
  ){

    prevTalkBtn
      .classList
      .add(
        "hidden"
      );

  }

  else{

    prevTalkBtn
      .classList
      .remove(
        "hidden"
      );

  }


  /* =====================================================
     오른쪽 초기화
  ===================================================== */

  nextTalkBtn
    .style
    .display =
      "none";


  nextPageBtn
    .classList
    .remove(
      "show"
    );


  /* =====================================================
     전체 스토리 마지막
  ===================================================== */

  const isLastTalk =

    currentScene === 3
    &&
    currentTalk ===
      talks.length - 1;


  if(isLastTalk){

    /*
      마지막에는 오른쪽 화살표 없음

      다음 버튼은 화면 하단 중앙
    */

    nextPageBtn
      .classList
      .add(
        "show"
      );

    return;

  }


  /* =====================================================
     나머지는 오른쪽 화살표 표시
  ===================================================== */

  nextTalkBtn
    .style
    .display =
      "block";

}


/* =========================================================
   다음 대화
========================================================= */

function nextTalk(){

  const talks =
    getCurrentTalks();


  /* =====================================================
     현재 배경 안의 다음 대사
  ===================================================== */

  if(
    currentTalk <
    talks.length - 1
  ){

    currentTalk++;

    showTalk();

    return;

  }


  /* =====================================================
     bduin1 마지막
     → bduin2
  ===================================================== */

  if(currentScene === 1){

    currentScene = 2;

    currentTalk = 0;

    updateBackground();

    showTalk();

    return;

  }


  /* =====================================================
     bduin2 마지막
     → bduin3
  ===================================================== */

  if(currentScene === 2){

    currentScene = 3;

    currentTalk = 0;

    updateBackground();

    showTalk();

  }

}


/* =========================================================
   이전 대화
========================================================= */

function prevTalk(){

  /* =====================================================
     현재 장면 안에서 이전
  ===================================================== */

  if(currentTalk > 0){

    currentTalk--;

    showTalk();

    return;

  }


  /* =====================================================
     bduin2 첫 대사
     → bduin1 마지막 대사
  ===================================================== */

  if(currentScene === 2){

    currentScene = 1;

    currentTalk =
      scene1Talks.length - 1;

    updateBackground();

    showTalk();

    return;

  }


  /* =====================================================
     bduin3 첫 대사
     → bduin2 마지막 대사
  ===================================================== */

  if(currentScene === 3){

    currentScene = 2;

    currentTalk =
      scene2Talks.length - 1;

    updateBackground();

    showTalk();

  }

}


/* =========================================================
   다음 페이지
========================================================= */

function goNextPage(){

  location.href =
    "https://baekko.github.io/cnedu/bdum.html";

}


/* =========================================================
   최초 실행
========================================================= */

updateBackground();


/*
  페이지 로드 2초 후
  첫 번째 대화
*/

setTimeout(

  function(){

    currentScene = 1;

    currentTalk = 0;

    showTalk();

  },

  2000

);

</script>

</body>
</html>
